<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人体小秘密 · 器官朋友探险</title>
<link rel="stylesheet" href="../touch.css">
<link rel="stylesheet" href="body-secrets.css">
<script src="../touch.js"></script>
</head>
<body>
<main aria-label="人体小秘密">
  <div class="storybook"><img src="body-secrets.webp" alt="小探险家和透明人体里的脑、肺、心脏、胃与血细胞朋友" draggable="false"></div>
  <div class="invitation">点一点，认识身体里的朋友</div>
  <aside aria-label="器官探险">
    <div class="choices" id="choices"></div>
    <section class="discovery" aria-live="polite">
      <div class="demo" id="demo" aria-hidden="true"></div>
      <div class="words"><h1 id="name"></h1><p id="secret"></p><p class="hint" id="hint"></p></div>
    </section>
    <div class="actions"><button id="action" data-speak-ignore></button><span id="progress" aria-label="探索进度"></span></div>
  </aside>
</main>
<script src="../speak.js"></script>
<script src="body-secrets.js"></script>
</body>
</html>
