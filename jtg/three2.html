<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>小堆场 3857 - Three.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #1e1e1e; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #ddd;
    font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,0.4);
    padding: 6px 10px; border-radius: 4px; pointer-events: none;
  }
  #error {
    position: absolute; top: 10px; left: 10px; color: #fff; background: #a33;
    font-family: sans-serif; font-size: 14px; padding: 10px 14px; border-radius: 4px;
    display: none; max-width: 480px;
  }
</style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
<div id="info">duiwei3857.geojson + 房子3857 &nbsp;|&nbsp; 黄色边线 / 灰色填充 &nbsp;|&nbsp; 房子按 high 属性挤出 &nbsp;|&nbsp; 鼠标拖拽旋转，滚轮缩放 &nbsp;|&nbsp; M 键显隐底图 &nbsp;|&nbsp; H 键显隐房子 &nbsp;|&nbsp; 点击房子定位</div>
<div id="error"></div>
<div style="position:absolute;bottom:20px;left:16px;z-index:10;display:flex;gap:8px">
  <button id="toggle-basemap" type="button" aria-pressed="true">显示 / 隐藏底图</button>
  <button id="toggle-houses" type="button" aria-pressed="true">显示 / 隐藏房子</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-0.160.0/build/three.module.js",
    "three/addons/": "../vendor/three-0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.5;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// 限制到上半球，相机的仰角（相对 controls.target）不能转到水平线以下，
// 避免拖拽/双击定位后把镜头转到地图瓦片下面朝上看
controls.maxPolarAngle = Math.PI / 2 - 0.01;
// 滚轮不设下限的话，缩放能把相机拉到和 target 几乎重合（距离趋近 0），容易出现数值不稳定
controls.minDistance = 5;
// 右键/双指拖拽平移默认是"屏幕空间"平移，往上下拖屏幕会直接改变相机高度（可以把 target
// 和相机一起拖到地图下面去，maxPolarAngle 限制的是绕 target 的旋转角度，管不到平移）。
// 关掉后平移改成沿地面水平方向（贴合 camera.up=Y 的水平面）走，不会再改变高度
controls.screenSpacePanning = false;

// ---- 天空 ----
const sky = new Sky();
sky.scale.setScalar(20000);
scene.add(sky);

const sun = new THREE.Vector3();
const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 8;
skyUniforms['rayleigh'].value = 2;
skyUniforms['mieCoefficient'].value = 0.005;
skyUniforms['mieDirectionalG'].value = 0.8;

const elevation = 8; // 太阳高度角
const azimuth = 180; // 太阳方位角
const phi = THREE.MathUtils.degToRad(90 - elevation);
const theta = THREE.MathUtils.degToRad(azimuth);
sun.setFromSphericalCoords(1, phi, theta);
skyUniforms['sunPosition'].value.copy(sun);

// ---- 水面 ----
const waterGeometry = new THREE.PlaneGeometry(20000, 20000);
const water = new Water(waterGeometry, {
  textureWidth: 512,
  textureHeight: 512,
  waterNormals: new THREE.TextureLoader().load(
    '../vendor/three-0.160.0/examples/textures/waternormals.jpg',
    texture => { texture.wrapS = texture.wrapT = THREE.RepeatWrapping; }
  ),
  sunDirection: sun.clone(),
  sunColor: 0xffffff,
  waterColor: 0x0a3d5c,
  distortionScale: 3.7,
  fog: scene.fog !== undefined,
});
water.rotation.x = -Math.PI / 2;
water.position.y = -1;
water.visible = false;   // 隐藏水面（改回可见改成 true）
scene.add(water);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const MIN_VIEW_Y = 0; // 地图瓦片在 BASEMAP_Y=-2，这里留出安全余量，相机/target 高度不允许比这个还低

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // 双保险：screenSpacePanning=false + maxPolarAngle 已经从平移/旋转两个入口挡住大部分情况，
  // 这里再兜底夹一下高度，防止极端情况下相机还是钻到地图下面、看到贴图背面翻转的画面
  if (controls.target.y < MIN_VIEW_Y) controls.target.y = MIN_VIEW_Y;
  if (camera.position.y < MIN_VIEW_Y) camera.position.y = MIN_VIEW_Y;
  water.material.uniforms['time'].value += 1.0 / 60.0;
  renderer.render(scene, camera);
}
animate();

function showError(msg) {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.innerHTML = msg;
}

// ---- 加载 GeoJSON 并绘制 ----
Promise.all([
  fetch('./duiwei3857.geojson').then(res => { if (!res.ok) throw new Error('duiwei3857.geojson HTTP ' + res.status); return res.json(); }),
  fetch('./房子.geojson').then(res => { if (!res.ok) throw new Error('房子.geojson HTTP ' + res.status); return res.json(); }),
])
  .then(([geojson, houseGeojson]) => buildScene(geojson, houseGeojson))
  .catch(err => {
    showError(
      '加载 GeoJSON 失败: ' + err.message +
      '<br>请通过本地 HTTP 服务器打开本页面（例如 VSCode Live Server），' +
      '直接以 file:// 方式打开会因浏览器安全限制导致 fetch 失败。'
    );
    console.error(err);
  });

function buildScene(geojson, houseGeojson) {
  const features = geojson.features || [];
  const houseFeatures = (houseGeojson && houseGeojson.features) || [];

  // 计算整体包围盒中心，用于把巨大的 EPSG:3857 坐标平移到原点附近
    // 所有顶点的 x 都减了 13247141.69，y 都减了 4752277.70
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  [...features, ...houseFeatures].forEach(f => {
    forEachRing(f.geometry, ring => {
      ring.forEach(([x, y]) => {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      });
    });
  });
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const size = Math.max(maxX - minX, maxY - minY) || 1;

  // ---- 当前位置的底图瓦片 ----
  addBasemapTiles(minX, maxX, minY, maxY, cx, cy);

  const group = new THREE.Group();

  const fillMaterial = new THREE.MeshBasicMaterial({
    color: 0x808080,
    side: THREE.DoubleSide,
  });
  const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffff00 });

  // 先收集所有 feature 的几何信息，用于判断相邻格位
  const featureInfos = [];
  features.forEach(feature => {
    const polygons = getPolygons(feature.geometry);
    polygons.forEach(rings => {
      if (!rings.length) return;
      const outerRing = rings[0];
      const info = ringCenterAndAngle(outerRing, cx, cy);
      featureInfos.push({ feature, outerRing, info });
    });
  });

  // 判断格位某一侧（-1 西 / +1 东）是否紧邻另一个格位
  function hasCloseNeighbor(info, side) {
    const perpX = Math.sin(info.angle);
    const perpZ = -Math.cos(info.angle);
    const sideX = info.cx + perpX * info.ewWidth * 0.6 * side;
    const sideZ = info.cz + perpZ * info.ewWidth * 0.6 * side;
    for (const other of featureInfos) {
      if (other.info === info) continue;
      const dx = other.info.cx - sideX;
      const dz = other.info.cz - sideZ;
      // 南北向距离必须在半个格位高度内（同一排）
      const alongX = Math.cos(info.angle);
      const alongZ = Math.sin(info.angle); // 南北向在 (x,z) 平面中的方向
      const alongDist = Math.abs(dx * alongX + dz * alongZ);
      if (alongDist > info.nsHeight * 0.5) continue;
      // 东西向距离小于本格位宽度的 60% 视为紧邻
      const perpDist = Math.abs(dx * perpX + dz * perpZ);
      if (perpDist < info.ewWidth * 0.6) return true;
    }
    return false;
  }

  featureInfos.forEach(({ feature, outerRing, info }) => {
    const name = feature.properties?.name || '';
    const rings = getPolygons(feature.geometry)[0];
    const outer = ringToPoints(outerRing, cx, cy);
    const shape = new THREE.Shape(outer);
    for (let i = 1; i < rings.length; i++) {
      shape.holes.push(new THREE.Path(ringToPoints(rings[i], cx, cy)));
    }

    // 灰色填充
    const geometry = new THREE.ShapeGeometry(shape);
    const mesh = new THREE.Mesh(geometry, fillMaterial);
    mesh.rotation.x = -Math.PI / 2;
    group.add(mesh);

    // 黄色边线（每个环都画，含洞）
    rings.forEach(ring => {
      const pts = ringToPoints(ring, cx, cy).map(p => new THREE.Vector3(p.x, 0.05, -p.y));
      const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.LineLoop(lineGeom, lineMaterial);
      group.add(line);
    });

    // 名称标签（广告牌，始终朝向相机）
    //   Z 排（名称以 Z 开头）：文字放堆位北侧边线外
    //   Y 排（名称以 Y 开头）：文字放堆位南侧边线外
    //   其余堆位：放在格位东西两侧，紧邻格位的内侧不显示
    if (name) {
      const { cx: fx, cz: fz, angle: fAngle, nsHeight, ewWidth } = info;
      const labelHeight = Math.max(2, nsHeight * 0.06);
      const firstChar = name.trim().charAt(0).toUpperCase();

      const placeLabel = (px, pz) => {
        const sprite = makeLabelSprite(name);
        const aspect = sprite.userData.aspect;
        sprite.scale.set(labelHeight * aspect, labelHeight, 1);
        sprite.position.set(px, labelHeight / 2, pz);
        group.add(sprite);
      };

      if (firstChar === 'Z' || firstChar === 'Y') {
        // 沿格位南北向长轴偏移到北/南边线外
        const alongX = Math.cos(fAngle);
        const alongZ = Math.sin(fAngle);
        // (alongX, alongZ) * northSign 指向 -z（正北）
        const northSign = alongZ < 0 ? 1 : -1;
        const dir = firstChar === 'Z' ? northSign : -northSign;
        const nsOffset = nsHeight / 2 + nsHeight * 0.05;
        placeLabel(fx + alongX * nsOffset * dir, fz + alongZ * nsOffset * dir);
      } else {
        const offset = ewWidth / 2 + ewWidth * 0.05;
        const perpX = Math.sin(fAngle);
        const perpZ = -Math.cos(fAngle);

        const sides = [];
        if (!hasCloseNeighbor(info, -1)) sides.push(-1); // 西侧没邻居才显示
        if (!hasCloseNeighbor(info, 1))  sides.push(1);  // 东侧没邻居才显示

        for (const side of sides) {
          placeLabel(fx + perpX * offset * side, fz + perpZ * offset * side);
        }
      }
    }
  });

  // 房子：按 properties.high 挤出成体块，浅蓝顶部边线 + 名称标签
  // 单独用一个 group 装房子（而不是直接塞进堆位的 group），这样才能只切房子的显隐、不影响堆位
  houseGroup = new THREE.Group();
  houseGroup.name = 'houses';
  addHouses(houseFeatures, cx, cy, houseGroup);
  group.add(houseGroup);

  scene.add(group);

  // 辅助轴
  const axesHelper = new THREE.AxesHelper(size * 0.6);
  scene.add(axesHelper);

  // 相机根据数据范围自适应
  camera.position.set(0, size * 0.8, size * 0.8);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ================= 底图瓦片 =================
// GeoJSON 已是 EPSG:3857，直接按标准 XYZ 瓦片方案把每块瓦片贴到地面对应的墨卡托位置
const basemapGroup = new THREE.Group();
basemapGroup.name = 'basemap';
scene.add(basemapGroup);

// 房子整体的显隐开关（房子在 buildScene 里异步创建，先占位，创建后再赋值）
let houseGroup = null;

// 瓦片地址模板。{s} 为子域名占位符（域名分片，突破单域名 6 并发限制）
//   船讯网(谷歌混合影像代理)：http://gwxn.shipxy.com/vt?lyrs=y&hl=zh-CN&gl=CN&x={x}&y={y}&z={z}&s=Gal （无 {s}，WGS84）
//   船讯网(海图)：https://gwxc.shipxy.com/tile.g?z={z}&x={x}&y={y} （无 {s}）
//   天地图影像  ：https://{s}.tianditu.gov.cn/img_w/wmts?service=wmts&request=GetTile&version=1.0.0&layer=img&style=default&tilematrixset=w&format=tiles&tilematrix={z}&tilerow={y}&tilecol={x}&tk=40b190683706230fade806c1ac8c14e8  （{s}=t0..t7）
//   ESRI 卫星影像：https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x} （无 {s}，最高 z19+）
//   注意：高德/腾讯瓦片是 GCJ-02 偏移坐标，会和本图错开约 500m，不要直接用
// ESRI 卫星影像：自带 CORS 头可直连；国内若慢/连不上，跑 tile-proxy 并把地址换成
//   set TILE_TARGET=https://server.arcgisonline.com  ->  http://localhost:8809/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
const TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const TILE_SUBDOMAINS = [];  // 无子域名的源留空数组 []
const TILE_MAX_Z = 19;   // 该源支持的最高级别
const BASEMAP_CONCURRENCY = 24;  // 同时进行的瓦片请求数
const BASEMAP_CACHE = 'basemap-tiles-v1';  // 本地持久缓存名（清缓存改版本号即可）

const MERC_ORIGIN = 20037508.342789244;   // 半个地球周长（米）
const MERC_WORLD  = MERC_ORIGIN * 2;

const BASEMAP_Y = -2;       // 底图高度，压在堆位面（y=0）下方，避免深度冲突闪烁
const BASEMAP_BRIGHTNESS = 1.5;  // 底图亮度，1=原图，>1 更亮
const BASEMAP_PAD_X = 8;   // 底图东西向外扩倍数（相对堆位范围）
const BASEMAP_PAD_Y = 3;   // 底图南北向外扩倍数
const BASEMAP_MAX_TILES = 1000;  // 瓦片数量上限，越大范围越广/加载越慢

function addBasemapTiles(minX, maxX, minY, maxY, cx, cy) {
  // 向四周留余量，多显示一点周边环境
  const padX = (maxX - minX) * BASEMAP_PAD_X || 100;
  const padY = (maxY - minY) * BASEMAP_PAD_Y || 100;
  minX -= padX; maxX += padX;
  minY -= padY; maxY += padY;

  // 从高到低挑一个瓦片数量可接受的缩放级别
  let pick = null;
  for (let z = TILE_MAX_Z; z >= 10; z--) {
    const span = MERC_WORLD / Math.pow(2, z);
    const x0 = Math.floor((minX + MERC_ORIGIN) / span);
    const x1 = Math.floor((maxX + MERC_ORIGIN) / span);
    const y0 = Math.floor((MERC_ORIGIN - maxY) / span);
    const y1 = Math.floor((MERC_ORIGIN - minY) / span);
    if ((x1 - x0 + 1) * (y1 - y0 + 1) <= BASEMAP_MAX_TILES) { pick = { z, span, x0, x1, y0, y1 }; break; }
  }
  if (!pick) return;

  const { z, span, x0, x1, y0, y1 } = pick;
  const loader = new THREE.TextureLoader();
  loader.crossOrigin = 'anonymous';

  // 本地持久缓存（Cache Storage，localhost/https 下可用）：命中直接用，未命中下载后存起来
  //   —— 同一地点第二次打开秒开，断网也能显示
  const cachePromise = (self.caches ? caches.open(BASEMAP_CACHE).catch(() => null) : Promise.resolve(null));
  function loadTexture(url) {
    return cachePromise.then(cache => {
      if (!cache) return new Promise((ok, no) => loader.load(url, ok, undefined, no));
      return cache.match(url).then(hit => {
        const respP = hit
          ? Promise.resolve(hit)
          : fetch(url, { mode: 'cors' }).then(r => {
              if (r.ok) cache.put(url, r.clone());
              return r;
            });
        return respP
          .then(r => r.blob())
          .then(blob => new Promise((ok, no) => {
            const obj = URL.createObjectURL(blob);
            loader.load(obj, t => { URL.revokeObjectURL(obj); ok(t); },
                        undefined, e => { URL.revokeObjectURL(obj); no(e); });
          }));
      });
    });
  }

  // 收集所有瓦片任务，按到中心的距离排序 —— 中间的先加载
  const midX = (x0 + x1) / 2, midY = (y0 + y1) / 2;
  const jobs = [];
  for (let tx = x0; tx <= x1; tx++) {
    for (let ty = y0; ty <= y1; ty++) {
      // toneMapped:false 让瓦片跳过 ACES 色调映射/曝光，保持原图亮度
      const mat = new THREE.MeshBasicMaterial({ color: 0x1e1e1e, side: THREE.DoubleSide, toneMapped: false });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(span, span), mat);
      mesh.rotation.x = -Math.PI / 2;
      // 瓦片中心的墨卡托坐标 -> 世界坐标（x 不变，z = -y，与堆位几何一致）
      const mercCX = (tx + 0.5) * span - MERC_ORIGIN;
      const mercCY = MERC_ORIGIN - (ty + 0.5) * span;
      mesh.position.set(mercCX - cx, BASEMAP_Y, -(mercCY - cy));
      mesh.renderOrder = -1;
      basemapGroup.add(mesh);

      const sub = TILE_SUBDOMAINS.length
        ? TILE_SUBDOMAINS[((tx % TILE_SUBDOMAINS.length) + ((ty % 2) ? 4 : 0)) % TILE_SUBDOMAINS.length]
        : '';
      const url = TILE_URL
        .replace('{s}', sub).replace('{z}', z).replace('{x}', tx).replace('{y}', ty);
      const dist = (tx - midX) ** 2 + (ty - midY) ** 2;
      jobs.push({ url, mat, mesh, dist });
    }
  }
  jobs.sort((a, b) => a.dist - b.dist);

  // 并发池：始终保持 BASEMAP_CONCURRENCY 个请求在跑
  let next = 0, done = 0, failed = 0;
  const total = jobs.length;
  const runOne = () => {
    if (next >= total) return;
    const { url, mat, mesh } = jobs[next++];
    const finish = () => {
      done++;
      if (done === total) console.log(`底图瓦片加载完成：${total - failed}/${total}（失败 ${failed}）`);
      runOne();
    };
    loadTexture(url).then(
      tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
        mat.map = tex;
        mat.color.setScalar(BASEMAP_BRIGHTNESS);
        mat.needsUpdate = true;
        finish();
      },
      () => { failed++; mesh.visible = false; finish(); }   // 该瓦片 404/跨域失败则隐藏
    );
  };
  for (let i = 0; i < BASEMAP_CONCURRENCY; i++) runOne();
}

// 按 M 键显隐底图，按 H 键显隐房子
document.getElementById('toggle-basemap').addEventListener('click', (e) => {
  basemapGroup.visible = !basemapGroup.visible;
  e.currentTarget.setAttribute('aria-pressed', String(basemapGroup.visible));
});
document.getElementById('toggle-houses').addEventListener('click', (e) => {
  if (!houseGroup) return;
  houseGroup.visible = !houseGroup.visible;
  e.currentTarget.setAttribute('aria-pressed', String(houseGroup.visible));
});
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') basemapGroup.visible = !basemapGroup.visible;
  if ((e.key === 'h' || e.key === 'H') && houseGroup) houseGroup.visible = !houseGroup.visible;
});

// 双击某栋房子，镜头平移过去（保持当前的观察角度和缩放距离，只是把 controls.target
// 和 camera 一起按同样的偏移量搬到那栋房子上——而不是重新对准一个固定的距离/角度）
const houseRaycaster = new THREE.Raycaster();
const housePointerNDC = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  if (!houseGroup || !houseGroup.visible) return;
  const rect = renderer.domElement.getBoundingClientRect();
  housePointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  housePointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  houseRaycaster.setFromCamera(housePointerNDC, camera);
  const hits = houseRaycaster.intersectObjects(houseGroup.children, true);
  if (!hits.length) return;
  // 具体建造几何体（mesh/圆柱等）不一定自己带 userData.house，往上找到挂了它的那层 group
  let obj = hits[0].object;
  while (obj && !obj.userData.house && obj !== houseGroup) obj = obj.parent;
  if (obj && obj.userData.house) flyToHouse(obj.userData.house.center);
});

function flyToHouse(targetPos, duration = 800) {
  const startTarget = controls.target.clone();
  const startCamPos = camera.position.clone();
  const delta = new THREE.Vector3().subVectors(targetPos, startTarget);
  const endCamPos = startCamPos.clone().add(delta);
  const startTime = performance.now();
  function step(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
    camera.position.lerpVectors(startCamPos, endCamPos, eased);
    controls.target.lerpVectors(startTarget, targetPos, eased);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// 房子：每个 feature 按自己的 properties.high（米，缺失则用默认值）挤出成体块。
// ExtrudeGeometry 默认沿本地 Z 方向挤出，挤出体做和其它面片一样的 rotation.x=-90°
// 后，本地 Z 会变成世界 +Y（朝上），效果就是墙体立在地面上、高度=high。
// 底图贴在 y=BASEMAP_Y（见上，负值，压在堆位面下方防止深度冲突）而墙体从 y=0 起挤，
// 两者之间会露出一条缝，看起来像房子飘在地面上方。不能简单把整栋楼往下移
// position.y = BASEMAP_Y（那样屋顶也会跟着变矮 BASEMAP_Y 这么多），而是把墙体/柱体
// 底部往下多挤出 WALL_EMBED_DEPTH 再整体下沉同样距离——顶部高度不变，只是墙变“高”了，
// 多出来的部分埋进地面以下盖住缝隙。
const WALL_EMBED_DEPTH = -BASEMAP_Y;
const HOUSE_DEFAULT_HEIGHT_M = 3;
const TANK_DOME_RATIO = 0.4; // 罐体圆顶高度 = 半径 * 该比例，越大顶越尖
const ROOF_RIDGE_RATIO = 0.1; // 精品库屋脊高度 = 短边半宽 * 该比例，越大坡度越陡
const OFFICE_PANE_WIDTH_M = 3;  // 玻璃幕墙横向每格宽度（米）
const OFFICE_PANE_HEIGHT_M = 3; // 玻璃幕墙纵向每格高度（米，约等于层高）
const DORM_BAY_WIDTH_M = 6;   // 宿舍楼窗户横向每格宽度（米）：楼长约 60m，约 10 个窗/层
const DORM_BAY_HEIGHT_M = 5;  // 宿舍楼窗户纵向每格高度（米，约等于层高）：楼高约 20m，约 4 层
const OFFICE_ROOM_BAY_WIDTH_M = 6;  // 办公室窗户横向每格宽度（米）：楼长约 46m，约 8 个窗/层
const OFFICE_ROOM_BAY_HEIGHT_M = 5; // 办公室窗户纵向每格高度（米，约等于层高）：楼高约 10m，2 层

// 生成一格幕墙贴图：深色竖梃/横梁边框 + 蓝色玻璃渐变高光，wrapRepeat 平铺成整面幕墙
function makeGlassPaneTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // 竖梃/横梁边框（深灰）
  ctx.fillStyle = '#3c4650';
  ctx.fillRect(0, 0, size, size);

  // 玻璃面板：对角渐变模拟高光反射
  const inset = 6;
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, 'rgba(200,230,240,0.6)');
  grad.addColorStop(0.5, 'rgba(120,175,205,0.78)');
  grad.addColorStop(1, 'rgba(60,105,140,0.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(inset, inset, size - inset * 2, size - inset * 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // 避免密集条纹贴图在斜视角下出现摩尔纹
  return texture;
}

// ExtrudeGeometry 默认的侧墙 UV 生成器（WorldUVGenerator）有两个问题：
// 1) U/V 直接用挤出前后的世界坐标（米），不做 0~1 归一化，所以不能简单用 repeat=high/层高 去套（那样会变成
//    高度的平方级重复，贴图疯狂压缩、密集到看不出格子）；
// 2) U 只取该墙边 x/y 两个分量里变化更大的那个分量差，斜着的墙边会被按坐标差而不是真实边长计算，导致拉伸。
// 这里换成自定义 UVGenerator：按“这条墙边的真实长度 / 建筑真实高度”各自四舍五入出整数个格子，
// 直接把 UV 写成 0..cols、0..rows 的整数网格（配合贴图的 RepeatWrapping 平铺），
// 这样每一面墙的窗户都是整数个、不会在墙角/屋顶处被截断半格。
function makeIntegerBayUVGenerator(bayWidthM, bayHeightM) {
  return {
    generateTopUV(geometry, vertices, indexA, indexB, indexC) {
      const ax = vertices[indexA * 3], ay = vertices[indexA * 3 + 1];
      const bx = vertices[indexB * 3], by = vertices[indexB * 3 + 1];
      const cx = vertices[indexC * 3], cy = vertices[indexC * 3 + 1];
      return [new THREE.Vector2(ax, ay), new THREE.Vector2(bx, by), new THREE.Vector2(cx, cy)];
    },
    generateSideWallUV(geometry, vertices, indexA, indexB, indexC, indexD) {
      // a/b 是这面墙的两个地面顶点（同一层，z 相同），d 是 a 正上方的顶点，
      // 因此 (b-a) 的长度就是这条墙边的真实长度，(d.z-a.z) 就是这面墙的真实高度
      const ax = vertices[indexA * 3], ay = vertices[indexA * 3 + 1], az = vertices[indexA * 3 + 2];
      const bx = vertices[indexB * 3], by = vertices[indexB * 3 + 1];
      const dz = vertices[indexD * 3 + 2];

      const edgeLenM = Math.hypot(bx - ax, by - ay);
      const wallHeightM = Math.abs(dz - az);
      const cols = Math.max(1, Math.round(edgeLenM / bayWidthM));
      const rows = Math.max(1, Math.round(wallHeightM / bayHeightM));

      return [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(cols, 0),
        new THREE.Vector2(cols, rows),
        new THREE.Vector2(0, rows),
      ];
    },
  };
}

// 生成一格开窗墙面贴图：墙面 + 居中的开窗（深色窗框 + 蓝色玻璃），和幕墙的满铺玻璃不同，
// 这里窗户只占格子中间一部分，四周留出实墙。宿舍楼（白墙）和办公室（橙墙）共用这个生成器，只是墙色不同
function makeWallWindowTexture(wallColor) {
  const w = 160, h = 128; // 比例对应格子宽:高 = 6:5，避免窗户被拉伸变形
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // 墙面
  ctx.fillStyle = wallColor;
  ctx.fillRect(0, 0, w, h);

  // 窗框（深灰）
  const winX = w * 0.18, winY = h * 0.22, winW = w * 0.64, winH = h * 0.5;
  ctx.fillStyle = '#4a4f55';
  ctx.fillRect(winX, winY, winW, winH);

  // 玻璃（浅蓝渐变，模拟一点反光）
  const inset = 4;
  const grad = ctx.createLinearGradient(winX, winY, winX + winW, winY + winH);
  grad.addColorStop(0, 'rgba(210,232,240,0.85)');
  grad.addColorStop(1, 'rgba(120,165,190,0.9)');
  ctx.fillStyle = grad;
  ctx.fillRect(winX + inset, winY + inset, winW - inset * 2, winH - inset * 2);

  // 窗棂十字
  ctx.strokeStyle = '#4a4f55';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(winX + winW / 2, winY + inset);
  ctx.lineTo(winX + winW / 2, winY + winH - inset);
  ctx.moveTo(winX + inset, winY + winH / 2);
  ctx.lineTo(winX + winW - inset, winY + winH / 2);
  ctx.stroke();

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // 避免密集条纹贴图在斜视角下出现摩尔纹
  return texture;
}

// 生成罐体贴图：横向渐变模拟曲面明暗过渡（一侧亮一侧暗），偏浅灰白色而非纯白。
// CylinderGeometry/SphereGeometry 的 U（经度）都是 0~1 环绕一周，
// 罐身和球顶共用同一张贴图，明暗方向能自然衔接
function makeTankTexture() {
  const w = 256, h = 128;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, '#dadcd4');
  grad.addColorStop(0.38, '#ffffff');
  grad.addColorStop(0.62, '#f9faf6');
  grad.addColorStop(1, '#dcded6');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}
function addHouses(features, cx, cy, group) {
  // ExtrudeGeometry 的材质组顺序是 [0]=顶/底盖、[1]=侧墙（和直觉相反，源码 buildLidFaces
  // addGroup(...,0)、buildSideFaces addGroup(...,1)），数组顺序不能写反，否则墙顶颜色互换
  const houseMaterials = [
    new THREE.MeshBasicMaterial({ color: 0xc5c8cc, side: THREE.DoubleSide }), // 浅灰顶
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }), // 纯白墙
  ];
  const tankMaterial = new THREE.MeshBasicMaterial({ map: makeTankTexture(), side: THREE.DoubleSide });
  // 场景没有灯光，MeshBasicMaterial 不会自动明暗，两坡面手动给深浅两色，才能看出屋脊
  const gableRoofMaterialLight = new THREE.MeshBasicMaterial({ color: 0x276bd1, side: THREE.DoubleSide }); // 库房南坡（亮，蓝）
  const gableRoofMaterialDark = new THREE.MeshBasicMaterial({ color: 0x1d61c7, side: THREE.DoubleSide }); // 库房北坡（暗，蓝）
  const cafeteriaRoofMaterialLight = new THREE.MeshBasicMaterial({ color: 0x8c2a2a, side: THREE.DoubleSide }); // 食堂南坡（亮，暗红）
  const cafeteriaRoofMaterialDark = new THREE.MeshBasicMaterial({ color: 0x6e1f1f, side: THREE.DoubleSide }); // 食堂北坡（暗，暗红）
  // "办公楼" 玻璃幕墙 / "宿舍楼" 开窗墙体：贴图 + UV 生成器只需各建一份，
  // 每栋楼的整数格子数由 makeIntegerBayUVGenerator 按各自的墙边长度/高度动态算出，不用再按 high clone 贴图
  const officeGlassTexture = makeGlassPaneTexture(); // "办公楼" 玻璃幕墙贴图基底（竖梃网格 + 蓝色渐变高光）
  const officeGlassMaterial = new THREE.MeshBasicMaterial({
    map: officeGlassTexture,
    transparent: true,
    opacity: 0.92,
    side: THREE.DoubleSide,
  });
  const officeGlassUVGenerator = makeIntegerBayUVGenerator(OFFICE_PANE_WIDTH_M, OFFICE_PANE_HEIGHT_M);
  const dormWindowTexture = makeWallWindowTexture('#f2f2ef'); // "宿舍楼" 开窗贴图基底（白墙）
  const dormWallMaterial = new THREE.MeshBasicMaterial({ map: dormWindowTexture, side: THREE.DoubleSide });
  const dormWindowUVGenerator = makeIntegerBayUVGenerator(DORM_BAY_WIDTH_M, DORM_BAY_HEIGHT_M);
  const officeRoomWindowTexture = makeWallWindowTexture('#ff8c00'); // "办公室" 开窗贴图基底（橙墙）
  const officeRoomWallMaterial = new THREE.MeshBasicMaterial({ map: officeRoomWindowTexture, side: THREE.DoubleSide });
  const officeRoomUVGenerator = makeIntegerBayUVGenerator(OFFICE_ROOM_BAY_WIDTH_M, OFFICE_ROOM_BAY_HEIGHT_M);

  // 大门塔身（四棱锥）要立在门梁顶板上，而不是从地面拔起，先找到门梁那部分的高度（=顶板高度）
  const gateDeckHigh = Number(
    features.find(f => f.properties?.name === '大门' && Number(f.properties?.high) <= 20)?.properties?.high
  ) || 0;

  features.forEach(feature => {
    const name = feature.properties?.name || '';
    const high = Number(feature.properties?.high) || HOUSE_DEFAULT_HEIGHT_M;

    getPolygons(feature.geometry).forEach(rings => {
      if (!rings.length) return;
      const outer = ringToPoints(rings[0], cx, cy);

      // 罐体：圆柱身（高度=属性 high）+ 球冠圆顶（另外加高，不占用 high）
      if (name.includes('罐')) {
        const c = centroid2D(outer);
        const radius = outer.reduce((sum, p) => sum + Math.hypot(p.x - c.x, p.y - c.y), 0) / outer.length;
        const bodyHeight = high;
        const domeHeight = radius * TANK_DOME_RATIO;
        const totalHeight = bodyHeight + domeHeight;

        const tankGroup = new THREE.Group();

        // 罐身也往下多挤 WALL_EMBED_DEPTH 并整体下沉同样距离，顶部（=bodyHeight）不变
        const bodyMeshHeight = bodyHeight + WALL_EMBED_DEPTH;
        const bodyMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(radius, radius, bodyMeshHeight, 32),
          tankMaterial
        );
        bodyMesh.position.y = bodyMeshHeight / 2 - WALL_EMBED_DEPTH;
        tankGroup.add(bodyMesh);

        // thetaStart=0, thetaLength=PI/2 只取球的上半部分（从极点到赤道），做穹顶
        const domeMesh = new THREE.Mesh(
          new THREE.SphereGeometry(radius, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
          tankMaterial
        );
        domeMesh.scale.y = domeHeight / radius; // 压扁成矮穹顶
        domeMesh.position.y = bodyHeight;
        tankGroup.add(domeMesh);

        tankGroup.position.set(c.x, 0, -c.y);
        tankGroup.userData.house = { name, center: new THREE.Vector3(c.x, totalHeight / 2, -c.y) }; // 双击定位用
        group.add(tankGroup);

        if (name) {
          const sprite = makeLabelSprite(name);
          const labelHeight = Math.max(2, totalHeight * 0.4);
          sprite.scale.set(labelHeight * sprite.userData.aspect, labelHeight, 1);
          sprite.position.set(c.x, totalHeight + labelHeight / 2, -c.y);
          group.add(sprite);
        }
        return;
      }

      // 大门是个组合体：矮的那个（拱跨/门梁）保持平顶，高的那个（塔身）改成从地面直接收尖的四棱锥
      if (name === '大门' && high > 20) {
        let corners = outer.map(p => new THREE.Vector2(p.x, -p.y)); // 转成世界 (x,z)
        if (corners.length > 1 && corners[0].distanceTo(corners[corners.length - 1]) < 1e-6) {
          corners = corners.slice(0, -1);
        }

        if (corners.length === 4) {
          const center = new THREE.Vector2();
          corners.forEach(p => center.add(p));
          center.multiplyScalar(0.25);

          const b = corners.map(p => new THREE.Vector3(p.x, gateDeckHigh, p.y)); // 塔身底角，立在门梁顶板上
          const apex = new THREE.Vector3(center.x, high, center.y);   // 顶部尖点

          // wireframe 的线宽在 WebGL 里基本锁死 1px，调不粗，所以镂空的棱线用实体细圆柱体拼出来
          const spireEdgeMaterial = new THREE.MeshBasicMaterial({ color: 0xd9dbd4 }); // 和下方门梁颜色保持一致
          const edgeRadius = Math.max(0.8, high * 0.03);
          const spireHouseData = { name, center: new THREE.Vector3(center.x, (gateDeckHigh + high) / 2, center.y) };
          [
            [b[0], apex], [b[1], apex], [b[2], apex], [b[3], apex], // 棱线（不画底边，避免看着像 4 根柱子）
          ].forEach(([p1, p2]) => {
            const edge = makeEdgeCylinder(p1, p2, edgeRadius, spireEdgeMaterial);
            edge.userData.house = spireHouseData; // 双击定位用
            group.add(edge);
          });

          if (name) {
            const sprite = makeLabelSprite(name);
            const labelHeight = Math.max(2, high * 0.4);
            sprite.scale.set(labelHeight * sprite.userData.aspect, labelHeight, 1);
            sprite.position.set(center.x, high + labelHeight / 2, center.y);
            group.add(sprite);
          }
          return;
        }
      }

      // 大门矮的那部分（拱跨/门梁）：16 根柱子（沿长边两侧各 8 根）撑起一块顶板，中间镂空走车
      if (name === '大门' && high <= 20) {
        let corners = outer.map(p => new THREE.Vector2(p.x, -p.y)); // 转成世界 (x,z)
        if (corners.length > 1 && corners[0].distanceTo(corners[corners.length - 1]) < 1e-6) {
          corners = corners.slice(0, -1);
        }

        if (corners.length === 4) {
          const center = new THREE.Vector2();
          corners.forEach(p => center.add(p));
          center.multiplyScalar(0.25);

          const edge0 = corners[1].clone().sub(corners[0]);
          const edge1 = corners[2].clone().sub(corners[1]);
          const len0 = edge0.length(), len1 = edge1.length();
          const uDir = (len0 >= len1 ? edge0 : edge1).normalize(); // 长边方向（车行方向）
          const vDir = new THREE.Vector2(-uDir.y, uDir.x);         // 跨度方向（垂直长边）
          const halfLength = Math.max(len0, len1) / 2;
          const halfWidth = Math.min(len0, len1) / 2;

          const deckThickness = Math.max(0.6, high * 0.12);
          const columnTop = high - deckThickness;
          const columnRadius = Math.max(0.6, halfWidth * 0.12);
          const columnInset = Math.min(halfWidth * 0.25, halfWidth - columnRadius * 1.5);
          const colOffset = halfWidth - columnInset; // 柱子距中线的距离，贴近两条长边
          const columnsPerSide = 8; // 两侧各 8 根，共 16 根

          const gateMaterial = new THREE.MeshBasicMaterial({ color: 0xd9dbd4, side: THREE.DoubleSide });
          const gateGroup = new THREE.Group();

          for (let side = -1; side <= 1; side += 2) {
            for (let i = 0; i < columnsPerSide; i++) {
              const t = (i + 0.5) / columnsPerSide - 0.5; // 均匀分布在 -0.5~0.5
              const along = t * (halfLength * 2 - columnRadius * 2);
              const px = center.x + along * uDir.x + side * colOffset * vDir.x;
              const pz = center.y + along * uDir.y + side * colOffset * vDir.y;
              const base = new THREE.Vector3(px, -WALL_EMBED_DEPTH, pz); // 柱脚埋入地面，柱顶 columnTop 不变
              const top = new THREE.Vector3(px, columnTop, pz);
              gateGroup.add(makeEdgeCylinder(base, top, columnRadius, gateMaterial));
            }
          }

          // 顶板：架在柱子上方，覆盖整个跨度，下方镂空供车辆通行
          const angle = Math.atan2(-uDir.y, uDir.x); // 和棚顶/坡屋顶分支一致的角度换算
          const deckGeom = new THREE.BoxGeometry(halfLength * 2, deckThickness, halfWidth * 2);
          const deckMesh = new THREE.Mesh(deckGeom, gateMaterial);
          deckMesh.position.set(center.x, columnTop + deckThickness / 2, center.y);
          deckMesh.rotation.y = angle;
          gateGroup.add(deckMesh);

          gateGroup.userData.house = { name, center: new THREE.Vector3(center.x, columnTop / 2, center.y) }; // 双击定位用
          group.add(gateGroup);

          if (name) {
            const sprite = makeLabelSprite(name);
            const labelHeight = Math.max(2, high * 0.4);
            sprite.scale.set(labelHeight * sprite.userData.aspect, labelHeight, 1);
            sprite.position.set(center.x, high + labelHeight / 2, center.y);
            group.add(sprite);
          }
          return;
        }
      }

      // 名字带"库"的（精品库/仓库/维修库等）以及"食堂"：矩形斜顶（双坡屋顶）——屋脊沿长边方向居中，向两侧短边方向下坡
      //   库房用蓝色顶，食堂用暗红色顶
      if (name.includes('库') || name === '食堂') {
        const isCafeteria = name === '食堂';
        let corners = outer.map(p => new THREE.Vector2(p.x, -p.y)); // 转成世界 (x,z)
        if (corners.length > 1 && corners[0].distanceTo(corners[corners.length - 1]) < 1e-6) {
          corners = corners.slice(0, -1); // 去掉闭合环的重复首尾点
        }

        if (corners.length === 4) {
          const center = new THREE.Vector2();
          corners.forEach(p => center.add(p));
          center.multiplyScalar(0.25);

          const edge0 = corners[1].clone().sub(corners[0]);
          const edge1 = corners[2].clone().sub(corners[1]);
          const len0 = edge0.length(), len1 = edge1.length();
          const uDir = (len0 >= len1 ? edge0 : edge1).normalize(); // 长边方向
          const halfLength = Math.max(len0, len1) / 2;
          const halfWidth = Math.min(len0, len1) / 2;

          const wallHeight = high;
          const roofHeight = halfWidth * ROOF_RIDGE_RATIO;
          const totalHeight = wallHeight + roofHeight;
          const angle = Math.atan2(-uDir.y, uDir.x); // uDir.y 是世界 z 分量

          const gableGroup = new THREE.Group();

          // 墙体顶点（屋顶矮的时候，箱体自带的顶盖会和屋顶斜面几乎重合导致闪烁，
          // 所以只画四面墙、不画顶/底盖，顶完全交给屋顶几何体）
          // 底边往下沉 WALL_EMBED_DEPTH（埋进地面盖住和底图的缝隙），顶边 wallHeight 不变
          const b0 = new THREE.Vector3(-halfLength, -WALL_EMBED_DEPTH, -halfWidth);
          const b1 = new THREE.Vector3(halfLength, -WALL_EMBED_DEPTH, -halfWidth);
          const b2 = new THREE.Vector3(halfLength, -WALL_EMBED_DEPTH, halfWidth);
          const b3 = new THREE.Vector3(-halfLength, -WALL_EMBED_DEPTH, halfWidth);
          const rv0 = new THREE.Vector3(-halfLength, wallHeight, -halfWidth);
          const rv1 = new THREE.Vector3(halfLength, wallHeight, -halfWidth);
          const rv2 = new THREE.Vector3(halfLength, wallHeight, halfWidth);
          const rv3 = new THREE.Vector3(-halfLength, wallHeight, halfWidth);
          // 屋脊点也在墙面三角山墙里用到，先算出来
          const rv4 = new THREE.Vector3(-halfLength, wallHeight + roofHeight, 0);
          const rv5 = new THREE.Vector3(halfLength, wallHeight + roofHeight, 0);

          // 四面墙 + 两端山墙三角（山墙是竖直面，属于墙体，不是屋顶，颜色跟墙一致）
          const wallGeom = new THREE.BufferGeometry().setFromPoints([
            b0, b1, rv1, b0, rv1, rv0, // 前墙
            b1, b2, rv2, b1, rv2, rv1, // 右墙
            b2, b3, rv3, b2, rv3, rv2, // 后墙
            b3, b0, rv0, b3, rv0, rv3, // 左墙
            rv0, rv3, rv4,             // 左端山墙
            rv1, rv2, rv5,             // 右端山墙
          ]);
          const wallMesh = new THREE.Mesh(wallGeom, houseMaterials[1]);
          gableGroup.add(wallMesh);

          // 屋顶：屋脊沿本地 X 轴（长边方向）居中，本地 Z 轴（短边方向）向两侧下坡到屋檐
          // 前坡/后坡分开建两个 mesh、用深浅两色，制造明暗对比，否则没有灯光看不出屋脊
          const frontSlopeGeom = new THREE.BufferGeometry().setFromPoints([rv0, rv1, rv5, rv0, rv5, rv4]);
          const backSlopeGeom = new THREE.BufferGeometry().setFromPoints([rv2, rv3, rv4, rv2, rv4, rv5]);
          // 本地 z=-halfWidth（前坡）经 rotation.y=angle 后世界 z 分量为 -halfWidth*cos(angle)，
          // z=+halfWidth（后坡）为 +halfWidth*cos(angle)；世界 z 增大方向是南（z=-geo_y），
          // 谁的世界 z 更大谁朝南，取决于每栋楼轮廓的画法方向，不能写死用哪一坡
          const frontIsSouth = Math.cos(angle) < 0;
          const roofLight = isCafeteria ? cafeteriaRoofMaterialLight : gableRoofMaterialLight;
          const roofDark = isCafeteria ? cafeteriaRoofMaterialDark : gableRoofMaterialDark;
          gableGroup.add(new THREE.Mesh(frontSlopeGeom, frontIsSouth ? roofLight : roofDark));
          gableGroup.add(new THREE.Mesh(backSlopeGeom, frontIsSouth ? roofDark : roofLight));

          gableGroup.position.set(center.x, 0, center.y);
          gableGroup.rotation.y = angle;
          gableGroup.userData.house = { name, center: new THREE.Vector3(center.x, totalHeight / 2, center.y) }; // 双击定位用
          group.add(gableGroup);

          if (name) {
            const sprite = makeLabelSprite(name);
            const labelHeight = Math.max(2, totalHeight * 0.4);
            sprite.scale.set(labelHeight * sprite.userData.aspect, labelHeight, 1);
            sprite.position.set(center.x, totalHeight + labelHeight / 2, center.y);
            group.add(sprite);
          }
          return;
        }
      }

      const shape = new THREE.Shape(outer);
      for (let i = 1; i < rings.length; i++) {
        shape.holes.push(new THREE.Path(ringToPoints(rings[i], cx, cy)));
      }

      const uvGenerator = name === '办公楼' ? officeGlassUVGenerator
        : name === '宿舍楼' ? dormWindowUVGenerator
        : name === '办公室' ? officeRoomUVGenerator
        : undefined;
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: high + WALL_EMBED_DEPTH,
        bevelEnabled: false,
        ...(uvGenerator ? { UVGenerator: uvGenerator } : {}),
      });
      const wallMaterial = name === '办公楼' ? officeGlassMaterial
        : name === '办公室' ? officeRoomWallMaterial
        : name === '宿舍楼' ? dormWallMaterial
        : houseMaterials[1];
      const mesh = new THREE.Mesh(geometry, [houseMaterials[0], wallMaterial]);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = -WALL_EMBED_DEPTH; // 顶盖仍停在 high，只把底盖往下埋
      const c = centroid2D(outer);
      mesh.userData.house = { name, center: new THREE.Vector3(c.x, high / 2, -c.y) }; // 双击定位用
      group.add(mesh);

      if (name) {
        const sprite = makeLabelSprite(name);
        const labelHeight = Math.max(2, high * 0.4);
        sprite.scale.set(labelHeight * sprite.userData.aspect, labelHeight, 1);
        sprite.position.set(c.x, high + labelHeight / 2, -c.y);
        group.add(sprite);
      }
    });
  });
}

// 用一根细圆柱体连接 p1、p2，模拟可控制粗细的线段（wireframe 线宽在 WebGL 里基本调不动）
function makeEdgeCylinder(p1, p2, radius, material) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const length = dir.length();
  const geom = new THREE.CylinderGeometry(radius, radius, length, 8);
  const mesh = new THREE.Mesh(geom, material);
  mesh.position.copy(p1).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}

function centroid2D(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p.x; y += p.y; }
  return { x: x / pts.length, y: y / pts.length };
}

function getPolygons(geometry) {
  if (!geometry) return [];
  if (geometry.type === 'MultiPolygon') return geometry.coordinates;
  if (geometry.type === 'Polygon') return [geometry.coordinates];
  return [];
}

function forEachRing(geometry, cb) {
  getPolygons(geometry).forEach(rings => rings.forEach(cb));
}

function ringToPoints(ring, cx, cy) {
  return ring.map(([x, y]) => new THREE.Vector2(x - cx, y - cy));
}

// 计算多边形外环的包围盒中心、长边方向角（弧度，绕 y 轴）和长边长度
// 世界坐标：x 对应地理 x，z = -地理 y
function ringCenterAndAngle(ring, cx, cy) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of ring) {
    const dx = x - cx, dy = y - cy;
    if (dx < minX) minX = dx;
    if (dx > maxX) maxX = dx;
    if (dy < minY) minY = dy;
    if (dy > maxY) maxY = dy;
  }
  const dx = maxX - minX;
  const dy = maxY - minY;
  const fx = (minX + maxX) / 2;
  const fz = -(minY + maxY) / 2; // z = -y
  const longer = Math.max(dx, dy);
  const shorter = Math.min(dx, dy);

  // 找最接近南北向的边（|ey| 最大），标签始终放在格位的东西两侧
  //   边方向即为格位的"长边/南北向"方向
  let bestAbsDy = 0, bestAngle = 0;
  for (let i = 0; i < ring.length - 1; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[i + 1];
    const ex = x2 - x1, ey = y2 - y1;
    if (Math.abs(ey) > bestAbsDy) {
      bestAbsDy = Math.abs(ey);
      // 边方向 (ex, ey) 在 z=-y 平面上映射到 (x, -z)
      bestAngle = Math.atan2(-ey, ex);
    }
  }
  return {
    cx: fx, cz: fz,
    angle: bestAngle,
    length: longer,
    shorter,
    ewWidth: dx,     // 东西向宽度（x 方向包围盒长度）
    nsHeight: dy,    // 南北向高度（y 方向包围盒长度）
  };
}

// 用 Canvas 生成文字纹理，做成 Sprite（始终朝向相机的广告牌）
function makeLabelSprite(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontPx = 256;
  const padding = 20;
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + padding * 2;
  const h = fontPx + padding * 2;
  canvas.width = w;
  canvas.height = h;

  // 再设一次，改变 canvas 尺寸会重置上下文
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 纯黄色文字
  ctx.fillStyle = '#ffff00';
  ctx.fillText(text, w / 2, h / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(material);
  // Sprite 的默认尺寸是 1x1，按画布真实比例设置 aspect
  sprite.scale.set(w / fontPx, h / fontPx, 1);
  sprite.userData.aspect = w / h;
  return sprite;
}
