// ---- EPSG:3857 (Web Mercator) -> WGS84 经纬度 ----
const R = 6378137.0;
function mercToLngLat(x, y) {
  return [
    (x / R) * 180 / Math.PI,
    (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * 180 / Math.PI,
  ];
}

function showError(msg) {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.innerHTML = msg;
}

// ---- GeoJSON 辅助 ----
function getPolygons(g) {
  if (!g) return [];
  if (g.type === 'MultiPolygon') return g.coordinates;
  if (g.type === 'Polygon') return [g.coordinates];
  return [];
}

// 射线法：点 [lng,lat] 是否在环内
function pointInRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

// 点 [lng,lat] 是否落在某个 feature 的多边形内（外环内且不在洞里）
function pointInFeature(lng, lat, feature) {
  return getPolygons(feature.geometry).some(rings => {
    if (!rings.length || !pointInRing(lng, lat, rings[0])) return false;
    for (let i = 1; i < rings.length; i++) {
      if (pointInRing(lng, lat, rings[i])) return false;
    }
    return true;
  });
}

// 把整个 FeatureCollection 的坐标从 3857 重投影到经纬度（返回新对象）
function reproject(fc) {
  const out = JSON.parse(JSON.stringify(fc));
  out.features.forEach(f => {
    const g = f.geometry;
    if (!g) return;
    const polys = getPolygons(g).map(rings =>
      rings.map(ring => ring.map(([x, y]) => mercToLngLat(x, y)))
    );
    if (g.type === 'MultiPolygon') g.coordinates = polys;
    else if (g.type === 'Polygon') g.coordinates = polys[0];
  });
  return out;
}

function bboxOf(fcs) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  fcs.forEach(fc => fc.features.forEach(f =>
    getPolygons(f.geometry).forEach(rings => rings.forEach(ring => ring.forEach(([x, y]) => {
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    })))
  ));
  return { minX, minY, maxX, maxY };
}

function centroid(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p[0]; y += p[1]; }
  return [x / pts.length, y / pts.length];
}

// 用 Canvas 生成文字纹理做成 Sprite（始终朝向相机的广告牌）
function makeLabelSprite(text, color = '#b8860b') {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontPx = 256;
  const padding = 24;
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + padding * 2;
  const h = fontPx + padding * 2;
  canvas.width = w;
  canvas.height = h;
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(text, w / 2, h / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.userData.aspect = w / h;
  return sprite;
}

// 每帧把船名标签缩放到接近固定的屏幕像素高度。
// 做法：用 map.project() 投影标签经纬度 + 往北一点，量出该处“每米几屏幕像素(pxPerM)”，
//       世界米数 = 目标像素 / pxPerM。
// 关键：倾斜看向地平线时，远处地面被极度压缩，pxPerM→0，会把标签放大到糊屏。
//       所以给 pxPerM 设一个下限 = 当前缩放级别下俯视时的地面分辨率(nadirPxPerM)，
//       标签因此永远不会比“俯视时 SHIP_LABEL_SCREEN_PX 像素”更大；近处的船仍按透视缩小。
const LABEL_REF_M = 20;
function updateLabelScales() {
  if (!window.tb || !SHIP_LABEL_SCREEN_PX || !shipLabels.length) return;
  const lat0 = shipLabels[0].lat;
  const dLat = LABEL_REF_M / 110574;
  // 当前 zoom 下的地面分辨率（米/像素），mapbox 用 512 瓦片：40075016.686·cos(lat) / (512·2^zoom)
  const mPerPx = 40075016.686 * Math.cos(lat0 * Math.PI / 180) / (512 * Math.pow(2, map.getZoom()));
  const minPxPerM = 0.85 / mPerPx;   // 下限：略低于俯视分辨率，允许透视把近处标签稍微放大
  for (const L of shipLabels) {
    const a = map.project([L.lng, L.lat]);
    const b = map.project([L.lng, L.lat + dLat]);
    let pxPerM = Math.hypot(b.x - a.x, b.y - a.y) / LABEL_REF_M;
    if (!(pxPerM > 0) || pxPerM < minPxPerM) pxPerM = minPxPerM;
    const hMeters = Math.max(SHIP_LABEL_SCREEN_PX / pxPerM, 1);
    L.sprite.scale.set(hMeters * L.aspect, hMeters, 1);
  }
}

// 堆位名称标签默认是固定真实尺寸(CELL_LABEL_HEIGHT_M 米)的 sprite。每帧量一次该处
// “每米几屏幕像素”，据此：屏幕高度低于 MIN 就整块隐藏；高于 MAX 就把世界尺寸压回去，
// 让屏幕高度停在 MAX（放大到一定程度字不再继续变大）；两者之间维持真实尺寸随缩放变化。
function updateCellLabelVisibility() {
  if (!window.tb || !cellLabels.length) return;
  const dLat = LABEL_REF_M / 110574;
  for (const L of cellLabels) {
    const a = map.project([L.lng, L.lat]);
    const b = map.project([L.lng, L.lat + dLat]);
    const pxPerM = Math.hypot(b.x - a.x, b.y - a.y) / LABEL_REF_M;
    if (!(pxPerM > 0) || CELL_LABEL_HEIGHT_M * pxPerM < CELL_LABEL_MIN_PX) {
      L.sprite.visible = false;
      continue;
    }
    L.sprite.visible = true;
    const hM = Math.min(CELL_LABEL_HEIGHT_M, CELL_LABEL_MAX_PX / pxPerM);
    const hWorld = hM * L.upm;
    L.sprite.scale.set(hWorld * L.aspect, hWorld, 1);
  }
}

// 竖直渐变纹理：墙底最亮，向上逐渐透明，用于制造光幕/辉光观感
function makeGlowGradient() {
  const c = document.createElement('canvas');
  c.width = 4;
  c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256); // canvas 顶(=v0=墙底) -> 底(=v1=墙顶)
  g.addColorStop(0.00, 'rgba(180,255,210,0.95)');
  g.addColorStop(0.30, 'rgba(0,255,140,0.45)');
  g.addColorStop(1.00, 'rgba(0,255,140,0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.flipY = false;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}

// 可竖直无缝平铺的扫描光带纹理：两条亮带，用 sin 保证首尾周期一致，
// 贴到墙面后随时间滚动 offset.y，形成能量流动效果
function makeScanTexture() {
  const c = document.createElement('canvas');
  c.width = 4;
  c.height = 256;
  const ctx = c.getContext('2d');
  for (let y = 0; y < 256; y++) {
    const s = 0.5 + 0.5 * Math.sin((y / 256) * Math.PI * 2 * 2); // 2 个周期
    const a = Math.pow(s, 4) * 0.85;
    ctx.fillStyle = `rgba(200,255,225,${a})`;
    ctx.fillRect(0, y, 4, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.flipY = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}

// 缓出插值
function easeOut(x) {
  return 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
}

// 沿闭合环生成一条贴平面的带状几何（真正有宽度的"粗线"），halfWidth 为半宽（世界单位）
function buildRibbonGeometry(pts2d, halfWidth) {
  const n = pts2d.length;
  const left = [], right = [];
  for (let i = 0; i < n; i++) {
    const p = pts2d[i];
    const prev = pts2d[(i - 1 + n) % n];
    const next = pts2d[(i + 1) % n];
    let nx = 0, ny = 0;
    [[prev, p], [p, next]].forEach(([a, b]) => {
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy) || 1;
      nx += -dy / len; ny += dx / len; // 段法线
    });
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    left.push([p[0] + nx * halfWidth, p[1] + ny * halfWidth]);
    right.push([p[0] - nx * halfWidth, p[1] - ny * halfWidth]);
  }
  const pos = [];
  for (let i = 0; i < n - 1; i++) {
    const l1 = left[i], l2 = left[i + 1], r1 = right[i], r2 = right[i + 1];
    pos.push(l1[0], l1[1], 0, r1[0], r1[1], 0, r2[0], r2[1], 0);
    pos.push(l1[0], l1[1], 0, r2[0], r2[1], 0, l2[0], l2[1], 0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

// 沿闭合环生成一圈竖直墙面（无顶无底），高度 h（世界单位）
// pts2d: [[x,y], ...]（首尾已闭合）；v 坐标 0=墙底 1=墙顶
function buildWallGeometry(pts2d, h) {
  const pos = [];
  const uv = [];
  for (let i = 0; i < pts2d.length - 1; i++) {
    const [x1, y1] = pts2d[i];
    const [x2, y2] = pts2d[i + 1];
    // 两个三角形组成一段墙
    pos.push(x1, y1, 0,  x2, y2, 0,  x2, y2, h);
    pos.push(x1, y1, 0,  x2, y2, h,  x1, y1, h);
    uv.push(0, 0, 1, 0, 1, 1);
    uv.push(0, 0, 1, 1, 0, 1);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geom.computeVertexNormals();
  return geom;
}

// Mapbox 自带 3D 建筑：矢量底图(streets / satellite-streets)的 composite 源里有
// building 源图层，带 height / min_height。切底图会重建样式，所以每次 style.load 都要重加。
// 纯光栅底图（没有 composite 源）会自动跳过。建筑插在第一个文字 symbol 图层之下，
// 让路名/标注压在建筑之上；也排在 threebox 自定义图层之前，threebox 的船/灯/墙渲染在建筑之上。

function addThreeboxLayer(yardLL, contourLL, houseLL) {

// 墙体动画：入场生长 + 扫描光带上涌 + 呼吸脉冲，并驱动地图持续重绘
let glowPulseRAF = null;
function startGlowPulse() {
  if (glowPulseRAF) cancelAnimationFrame(glowPulseRAF);  // 切底图会重启：先停掉旧循环，再从 grow=0 重放生长
  const t0 = performance.now();
  let last = t0;
  let grow = 0;
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;

    // 1) 入场生长：墙体从贴地长到全高（~1.2s，缓出）
    if (grow < 1) {
      grow = Math.min(grow + dt / 1.2, 1);
      const s = Math.max(easeOut(grow), 0.0001);
      wallGroups.forEach(g => { g.scale.z = s; });
    }

    // 2) 扫描光带持续上涌
    flowTextures.forEach(t => {
      t.offset.y = (t.offset.y - dt * 0.35) % 1;
    });

    // 3) 呼吸脉冲
    const k = 0.72 + 0.28 * Math.sin((now - t0) / 1000 * 1.6);
    glowMaterials.forEach(mat => {
      mat.opacity = (mat.userData.baseOpacity || 1) * k;
    });

    if (map && map.getLayer && map.getLayer('threebox-yard')) map.triggerRepaint();
    glowPulseRAF = requestAnimationFrame(tick);
  }
  glowPulseRAF = requestAnimationFrame(tick);
}

// ---- 船舶：把 jtg-web 3D 组件 initModel7 的"加港区船舶"逻辑搬到 Threebox ----
// jtg-web 里那套流程是：接口拿原始 AIS 数据 -> dealShipinfo 换算单位 + proj4 投影到本地坐标
// -> gltfLoader 加载 单船.glb -> 逐船 model.clone() 摆位。这里去掉投影那一步，直接用经纬度。

const SHIP_AIS_REF_CORRECTION = true; // 把 AIS 上报的参考点(偏船艉/驾驶台)换算到船体几何中心
// AIS 数据没给参考点字段(trail=距艉 / left=距左舷)时的经验默认：
// 天线在距船艉 0.25×船长处、横向居中。→ 船形中心相对上报点沿船艏方向前移 (0.5-0.25)×船长。
// 船讯网偏差偏大就调大这个（往船艏挪更多），偏过头就调小。横向默认居中(0.5)不横移。
const SHIP_AIS_ANTENNA_FROM_STERN_FRAC = 0.25;
const SHIP_AIS_ANTENNA_FROM_PORT_FRAC = 0.5;

// 对应 jtg-web dealShipinfo：把 shipxy 原始整数字段换算成常规单位（经纬度小数、艏向度、船长米）
function dealShipRaw(c) {
  const cog = (c.cog || 0) / 100;
  // AIS 艏向无效时常报 511；退用 cog，再不行给 0
  let hdg = (c.hdg || 0) / 100;
  if (hdg <= 0 || hdg >= 360) hdg = (cog > 0 && cog < 360) ? cog : 0;

  const lengthM = (c.length || 0) / 10;
  const widthM = (c.width || 0) / 10;
  // 参考点到船艉 / 到左舷；接口没给就按经验默认（距艉 0.25L、横向居中）
  let toStern = (c.trail || 0) / 10;
  let toPort = (c.left || 0) / 10;
  if (!(toStern > 0 && toStern < lengthM)) toStern = SHIP_AIS_ANTENNA_FROM_STERN_FRAC * lengthM;
  if (!(toPort > 0 && toPort < widthM))   toPort  = SHIP_AIS_ANTENNA_FROM_PORT_FRAC * widthM;
  let lng = c.lon / 1e6;
  let lat = c.lat / 1e6;

  // AIS 上报的是参考点，不是几何中心：沿船艏方向平移 (length/2 - toStern)，沿右舷方向平移 (width/2 - toPort)
  if (SHIP_AIS_REF_CORRECTION && lengthM > 0 && toStern > 0 && toStern < lengthM) {
    const dFwd = lengthM / 2 - toStern;
    const dStbd = (widthM > 0 && toPort > 0 && toPort < widthM) ? (widthM / 2 - toPort) : 0;
    const h = hdg * Math.PI / 180;
    const east = dFwd * Math.sin(h) + dStbd * Math.cos(h);
    const north = dFwd * Math.cos(h) - dStbd * Math.sin(h);
    lat += north / 111320;
    lng += east / (111320 * Math.cos(lat * Math.PI / 180));
  }

  return {
    ...c,
    mmsi: c.mmsi,
    lng,
    lat,
    hdg,
    cog,
    sog: (c.sog || 0) / 514,
    rot: (c.rot || 0) / 100,
    length: lengthM,
    width: widthM,
    left: toPort,
    trail: toStern,
    draught: (c.draught || 0) / 1000,
  };
}

// 拉港区船舶：配了 SHIP_API 就调接口，否则（或请求失败）用内置 PORT_SHIPS_RAW 假数据。
// 两条路径的原始数据都统一走 SHIP_ONLY_CARGO 过滤 + dealShipRaw 换算。
async function loadShips() {
  let raw = null;
  if (SHIP_API) {
    try {
      const url = SHIP_API + (SHIP_API.indexOf('?') === -1 ? '?' : '&') + 'area=' + encodeURIComponent(SHIP_AREA);
      const resp = await fetch(url, { headers: SHIP_SID ? { Sid: SHIP_SID } : {} });
      const json = await resp.json();
      if (json && (json.code === 200 || json.code === undefined) && Array.isArray(json.data)) {
        raw = json.data;
      } else {
        console.warn('港区船舶接口返回异常，改用内置假数据：', json);
      }
    } catch (e) {
      console.warn('港区船舶接口请求失败，改用内置假数据：', e);
    }
  }
  if (!raw || !raw.length) raw = PORT_SHIPS_RAW;

  const ships = raw
    .filter(c => !SHIP_ONLY_CARGO || (c.shiptype >= 70 && c.shiptype <= 79 && c.length > 500))
    .filter(c => !SHIP_MIN_LEN_M || (Number(c.length) || 0) >= SHIP_MIN_LEN_M * 10)  // c.length 原始口径 ×10
    .map(dealShipRaw);
  addShips(ships);
}

// 加载一次 ship.glb，逐船 duplicate 后用经纬度摆位（Threebox 原生支持，无需投影）。
// 关键点（都是踩过的坑）：
//  1) 模型已是真实尺寸（船长约 204m），loadObj 用 units:'meters' 直接按真实大小渲染；
//  2) 不能用 model.scale.set()——那会覆盖 threebox 为"米"单位算好的换算 scale，船会变成公里级，
//     要按船长微缩就在其基础上 model.scale.multiplyScalar(相对系数)；
//  3) 立正和艏向要【分两步】做：先 setRotation 只做 x:90 的 y-up→z-up 立正（不带 yaw），
//     再用 rotateOnWorldAxis 绕【世界竖直轴 Z】转艏向。若把 yaw 塞进同一个 Euler，
//     threebox 的 rotation.set(x,y,z) 是 XYZ 序，yaw 会在 x:90 之前绕模型自身轴转 → 变成横滚 → 船侧翻。
function addShips(ships) {
  if (!window.tb || !ships || !ships.length) return;
  const WORLD_UP = new THREE.Vector3(0, 0, 1); // threebox 世界是 Z-up
  tb.loadObj({ obj: SHIP_MODEL_URL, type: 'gltf', units: 'meters', anchor: SHIP_ANCHOR, bbox: false }, proto => {
    // 量一次模型自身包围盒。glTF Y-up 所以 Y 恒为高度；但节点烘焙过 -90° 偏航，
    // 水平面里【船长到底落在 X 还是 Z 不一定】——取水平两轴里更长的那根当船长轴，另一根当船宽轴，
    // 避免把 AIS 船长错除到模型船宽上（会把船压短、横向拉宽、桅杆顶上天）。
    proto.updateWorldMatrix(true, true);
    const nbox = new THREE.Box3().setFromObject(proto);
    const extX = (nbox.max.x - nbox.min.x) || SHIP_MODEL_REAL_LEN_M;
    const extZ = (nbox.max.z - nbox.min.z) || SHIP_MODEL_REAL_BEAM_M;
    const lenAxis  = extX >= extZ ? 'x' : 'z';           // 船长轴（局部）
    const beamAxis = lenAxis === 'x' ? 'z' : 'x';        // 船宽轴（局部）
    const nativeLenM  = Math.max(extX, extZ);
    const nativeBeamM = Math.min(extX, extZ);
    console.log('[ship] 模型原生尺寸：长≈%sm(%s轴)  宽≈%sm(%s轴)', nativeLenM.toFixed(1), lenAxis, nativeBeamM.toFixed(1), beamAxis);
    ships.forEach((s, i) => {
      const lengthM = s.length > 0 ? s.length : nativeLenM;
      const widthM  = s.width  > 0 ? s.width  : nativeBeamM;
      const fLen  = (lengthM / nativeLenM)  * SHIP_SCALE; // 船长系数
      const fBeam = (widthM  / nativeBeamM) * SHIP_SCALE; // 船宽系数

      // 顺序有讲究：duplicate -> setCoords（写入 coordinates，unitsPerMeter 才有效）
      //           -> setRotation 立正（内部会把 scale 重置回 unitsPerMeter）
      //           -> rotateOnWorldAxis 转艏向 -> 最后再叠加相对缩放
      const model = proto.duplicate();               // 每条船独立一份，避免共用变换 / 材质
      model.name = String(s.mmsi || ('ship-' + i));
      model.userData.ship = s;
      model.setCoords([s.lng, s.lat, SHIP_ALT_M]);   // 直接用经纬度，不做任何坐标转换
      model.setRotation({ x: SHIP_PITCH_FIX_DEG, y: 0, z: 0 });  // 只立正，不转向
      // 艏向：绕世界竖直轴转 (OFFSET - hdg)。threebox 世界 +X=西 +Y=南，绕 +Z 正转=屏幕逆时针，
      // 故 hdg（正北顺时针）取【负号】。OFFSET 吸收模型默认朝向 + 节点烘焙的 -90° 偏航，按截图对照微调。
      model.rotateOnWorldAxis(WORLD_UP, (SHIP_HEADING_OFFSET_DEG - (s.hdg || 0)) * Math.PI / 180);
      // 分轴缩放到 AIS 实际长宽：lenAxis=船长、beamAxis=船宽；Y(高度) AIS 无此字段，
      // 取长宽系数平均，让小船（拖轮）整体矮下去而不被压成饼。
      // model.scale 是局部量，rotateOnWorldAxis 只改旋转不动它，故轴向恒定。
      model.scale[lenAxis]  *= fLen;
      model.scale[beamAxis] *= fBeam;
      model.scale.y         *= (fLen + fBeam) / 2;

      shipModels.push(model);
      tb.add(model);

      // 船名标签：单独作为一个 threebox 对象挂在船的经纬度上方，避免受船体 x:90 旋转/缩放影响
      const sprite = makeLabelSprite(s.cnname || s.name || model.name);
      const labelH = 8;                              // 世界米（SHIP_LABEL_SCREEN_PX 生效时每帧被 updateLabelScales 覆盖）
      sprite.scale.set(labelH * sprite.userData.aspect, labelH, 1);
      const labelObj = tb.Object3D({ obj: sprite, units: 'meters', bbox: false, tooltip: false });
      labelObj.setCoords([s.lng, s.lat, SHIP_ALT_M + SHIP_LABEL_HEIGHT_M]);
      tb.add(labelObj);
      shipModels.push(labelObj);
      shipLabels.push({ sprite, aspect: sprite.userData.aspect, lng: s.lng, lat: s.lat });
    });
    map.triggerRepaint();
  });
}

// ---- 灯：按 light.geojson 的点位加载 light.glb ----
async function loadLights() {
  let fc;
  try {
    const r = await fetch(LIGHT_GEOJSON_URL);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    fc = await r.json();
  } catch (e) {
    console.warn('灯 geojson 加载失败，跳过灯：', e);
    return;
  }
  const pts = (fc.features || [])
    .filter(f => f.geometry && f.geometry.type === 'Point' && Array.isArray(f.geometry.coordinates))
    .map(f => ({
      name: (f.properties && f.properties.name) || '',
      lng: f.geometry.coordinates[0],
      lat: f.geometry.coordinates[1],
    }));
  addLights(pts);
}

// 加载一次 light.glb，逐灯 duplicate 后用经纬度摆位。
// 坑同船：不要 model.scale.set()（会覆盖 threebox 的米制换算）；立正只做 x:90，不塞 yaw。
// 模型原点在灯杆底部中心，anchor:'none' 直接把经纬度点当灯杆脚。
function addLights(pts) {
  if (!window.tb || !pts || !pts.length) return;

  tb.loadObj({ obj: LIGHT_MODEL_URL, type: 'gltf', units: 'meters', anchor: 'none', bbox: false }, proto => {
    pts.forEach((p, i) => {
      const model = proto.duplicate();                       // 每盏灯独立一份
      model.name = p.name || ('light-' + i);
      model.setCoords([p.lng, p.lat, LIGHT_ALT_M]);          // 直接用经纬度
      model.setRotation({ x: LIGHT_PITCH_FIX_DEG, y: 0, z: 0 }); // 只立正
      if (LIGHT_SCALE !== 1) model.scale.multiplyScalar(LIGHT_SCALE);

      lightModels.push(model);
      tb.add(model);
    });
    map.triggerRepaint();
  });
}

function buildScene(yardLL, contourLL, houseLL) {
  // 轮廓：内部半透明面填充（贴地）+ 绿色发光墙（沿边界立起的光幕 + 底部亮线 + 顶部亮边）
  addFill(contourLL, { color: FILL_COLOR, opacity: FILL_OPACITY });
  addGlowWall(contourLL, { color: WALL_COLOR, heightM: WALL_HEIGHT_M });
  // 堆位：浅灰体 + 顶部黄色描边 + 名称标签
  addExtrusions(yardLL, { color: 0xdadada, heightM: CELL_HEIGHT_M, edge: 0xffff00, edgeWidthM: EDGE_WIDTH_M, labels: true });
  // 房子：每栋按自己的 properties.high 挤出高度，浅蓝描边 + 名称标签
  if (houseLL) {
    addExtrusions(houseLL, { color: HOUSE_WALL_COLOR, roofColor: HOUSE_ROOF_COLOR, heightM: HOUSE_DEFAULT_HEIGHT_M, heightProp: 'high', labels: true });
  }

  map.triggerRepaint();

  // 轮廓内部面填充：把每个多边形做成贴地的面片（参考 jtg-web 3D 组件 lunkuo.js
  // 的 ShapeGeometry 填充做法）。Threebox 世界是 Z-up，ShapeGeometry 天生落在 XY 平面，
  // 不需要像纯 three.js 项目那样再 rotation.x = -Math.PI/2。
  function addFill(fc, opt) {
    const group = new THREE.Group();

    fc.features.forEach(feature => {
      getPolygons(feature.geometry).forEach(rings => {
        if (!rings.length) return;

        // 以外环首点为锚点，把巨大的世界坐标偏移到局部原点附近（与 addGlowWall / addExtrusions 一致）
        const anchor = rings[0][0]; // [lng, lat]
        const base = tb.projectToWorld([anchor[0], anchor[1], 0]);
        const upm = tb.projectToWorld([anchor[0], anchor[1], 1]).z - base.z; // 每米对应的世界单位

        const toLocal = ([lng, lat]) => {
          const w = tb.projectToWorld([lng, lat, 0]);
          return [w.x - base.x, w.y - base.y];
        };

        const outer = rings[0].map(toLocal);
        const shape = new THREE.Shape(outer.map(([x, y]) => new THREE.Vector2(x, y)));
        for (let i = 1; i < rings.length; i++) {
          shape.holes.push(new THREE.Path(rings[i].map(toLocal).map(([x, y]) => new THREE.Vector2(x, y))));
        }

        // 不透明时按普通不透明材质渲染（写深度、走不透明队列），让更高的堆位挤出体
        // 靠真实深度盖在填充面之上；只有半透明时才切到透明队列。
        const translucent = opt.opacity < 1;
        const mat = new THREE.MeshBasicMaterial({
          color: opt.color,
          transparent: translucent,
          opacity: opt.opacity,
          side: THREE.DoubleSide,
          depthWrite: !translucent,
        });
        const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
        mesh.position.set(base.x, base.y, base.z + 0.02 * upm); // 略抬离地面，避免与卫星底图 z-fighting
        group.add(mesh);
      });
    });

    tb.add(group);
  }

  function addGlowWall(fc, opt) {
    const group = new THREE.Group();
    group.scale.z = 0.0001;        // 生长动画起始态（几乎贴地）
    wallGroups.push(group);
    const grad = makeGlowGradient();
    const scan = makeScanTexture();
    flowTextures.push(scan);

    fc.features.forEach(feature => {
      getPolygons(feature.geometry).forEach(rings => {
        if (!rings.length) return;

        const anchor = rings[0][0]; // [lng, lat]
        const base = tb.projectToWorld([anchor[0], anchor[1], 0]);
        const top = tb.projectToWorld([anchor[0], anchor[1], opt.heightM]);
        const hWorld = top.z - base.z;                 // 墙高（世界单位）
        const upm = hWorld / opt.heightM;              // 每米对应的世界单位

        const toLocal = ([lng, lat]) => {
          const w = tb.projectToWorld([lng, lat, 0]);
          return [w.x - base.x, w.y - base.y];
        };

        rings.forEach(ring => {
          const local = ring.map(toLocal);

          // 1) 光幕主体：竖直渐变 + 叠加混合，双面
          const bodyMat = new THREE.MeshBasicMaterial({
            map: grad,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });
          bodyMat.userData.baseOpacity = 1.0;
          glowMaterials.push(bodyMat);
          const wallGeom = buildWallGeometry(local, hWorld);
          const body = new THREE.Mesh(wallGeom, bodyMat);
          body.position.set(base.x, base.y, base.z);
          body.renderOrder = 10;
          group.add(body);

          // 1b) 流动扫描层：可平铺的亮带纹理，随时间滚动 offset.y 形成能量上涌
          const flowMat = new THREE.MeshBasicMaterial({
            map: scan,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });
          flowMat.userData.baseOpacity = 0.9;
          glowMaterials.push(flowMat);
          const flow = new THREE.Mesh(wallGeom, flowMat);
          flow.position.set(base.x, base.y, base.z);
          flow.renderOrder = 10;
          group.add(flow);

          // 2) 底部亮带：矮墙，纯亮绿叠加，强化与地面的接触光
          const skirtMat = new THREE.MeshBasicMaterial({
            color: opt.color,
            transparent: true,
            opacity: 0.5,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });
          skirtMat.userData.baseOpacity = 0.5;
          glowMaterials.push(skirtMat);
          const skirt = new THREE.Mesh(buildWallGeometry(local, hWorld * 0.14), skirtMat);
          skirt.position.set(base.x, base.y, base.z + 0.02 * upm);
          skirt.renderOrder = 11;
          group.add(skirt);

          // 3) 底部亮边线（顶部不画）
          {
            const pts = local.map(([x, y]) => new THREE.Vector3(x, y, 0.03 * upm));
            const lg = new THREE.BufferGeometry().setFromPoints(pts);
            const lm = new THREE.LineBasicMaterial({
              color: 0xaaffcc,
              transparent: true,
              opacity: 0.9,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
            });
            lm.userData.baseOpacity = 0.9;
            glowMaterials.push(lm);
            const line = new THREE.Line(lg, lm);
            line.position.set(base.x, base.y, base.z);
            line.renderOrder = 12;
            group.add(line);
          }
        });
      });
    });

    tb.add(group);
  }

  function addExtrusions(fc, opt) {
    const group = new THREE.Group();

    fc.features.forEach(feature => {
      const name = (feature.properties && feature.properties.name) || '';

      // 支持每个 feature 自己的高度（如房子的 properties.high），缺失/非法值退回 opt.heightM
      const featureHeightM = opt.heightProp
        ? (Number(feature.properties && feature.properties[opt.heightProp]) || opt.heightM)
        : opt.heightM;

      getPolygons(feature.geometry).forEach(rings => {
        if (!rings.length) return;

        // 以外环首点为锚点，把巨大的世界坐标偏移到局部原点附近
        const anchor = rings[0][0]; // [lng, lat]
        const base = tb.projectToWorld([anchor[0], anchor[1], 0]);
        const top = tb.projectToWorld([anchor[0], anchor[1], featureHeightM]);
        const depth = top.z - base.z;                 // 挤出高度（世界单位，z 朝上）
        const upm = depth / featureHeightM;            // 每米对应的世界单位

        const toLocal = ([lng, lat]) => {
          const w = tb.projectToWorld([lng, lat, 0]);
          return [w.x - base.x, w.y - base.y];
        };

        const outer = rings[0].map(toLocal);
        const shape = new THREE.Shape(outer.map(([x, y]) => new THREE.Vector2(x, y)));
        for (let i = 1; i < rings.length; i++) {
          shape.holes.push(new THREE.Path(rings[i].map(toLocal).map(([x, y]) => new THREE.Vector2(x, y))));
        }

        const geom = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
        // ExtrudeGeometry 材质组顺序是 [0]=顶/底盖、[1]=侧墙（和直觉相反，源码
        // buildLidFaces addGroup(...,0)、buildSideFaces addGroup(...,1)）。
        // roofColor 给了就传材质数组做"白墙灰顶"，否则退回单一材质（堆位挤出体走这条路，颜色统一）。
        const mat = opt.roofColor !== undefined
          ? [
              new THREE.MeshStandardMaterial({ color: opt.roofColor, roughness: 0.7, metalness: 0.0 }),
              new THREE.MeshStandardMaterial({ color: opt.color, roughness: 0.9, metalness: 0.0 }),
            ]
          : new THREE.MeshStandardMaterial({ color: opt.color, roughness: 0.85, metalness: 0.0 });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(base.x, base.y, base.z + (opt.zLift || 0) * upm);
        group.add(mesh);

        // 顶部描边：带宽度的黄色条带（贴在顶面，略微抬高避免 z-fighting）
        if (opt.edge !== undefined) {
          const halfW = (opt.edgeWidthM || 0.3) * upm / 2;
          const edgeMat = new THREE.MeshBasicMaterial({
            color: opt.edge,
            side: THREE.DoubleSide,
            depthWrite: false,
            polygonOffset: true,
            polygonOffsetFactor: -2,
            polygonOffsetUnits: -2,
          });
          rings.forEach(ring => {
            const ribbon = new THREE.Mesh(buildRibbonGeometry(ring.map(toLocal), halfW), edgeMat);
            ribbon.position.set(base.x, base.y, base.z + depth + 0.03 * upm);
            ribbon.renderOrder = 5;
            group.add(ribbon);
          });
        }

        // 名称标签：不压在堆位中间，而是挪到堆位边线外（参考 jtg-web 2D 组件
        // duiwei.js getPolygonCenter：纬度取几何中心，经度取边界再往外推半宽的 0.3）。
        // 默认放右侧边线外；若右侧紧挨着还有别的堆位（成对两列的左列，如 N01/N02
        // 里的 N01），放右边会压在两列公共边上，改放左侧边线外。
        if (opt.labels && name) {
          const ring = rings[0];
          let sumLat = 0, sumLng = 0, minLng = Infinity, maxLng = -Infinity, minLat = Infinity, maxLat = -Infinity;
          for (const [lng, lat] of ring) {
            sumLat += lat;
            sumLng += lng;
            if (lng < minLng) minLng = lng;
            if (lng > maxLng) maxLng = lng;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          }
          const centerLat = sumLat / ring.length;

          let labelLng, labelLat;
          if (/^Z/i.test(name)) {
            // Z 排：文字放堆位北侧边线外（经度取几何中心，纬度取北边界再往外推半高的 0.3）
            const halfH = (maxLat - minLat) / 2 || 1e-6;
            labelLng = sumLng / ring.length;
            labelLat = maxLat + halfH * 0.3;
          } else if (/^Y/i.test(name)) {
            // Y 排：文字放堆位南侧边线外（经度取几何中心，纬度取南边界再往外推半高的 0.3）
            const halfH = (maxLat - minLat) / 2 || 1e-6;
            labelLng = sumLng / ring.length;
            labelLat = minLat - halfH * 0.3;
          } else {
            // 其余堆位：默认放右侧边线外；若右侧紧挨着还有别的堆位（成对两列的左列，
            // 如 N01/N02 里的 N01），放右边会压在两列公共边上，改放左侧边线外。
            const halfW = (maxLng - minLng) / 2 || 1e-6;
            const probeEps = halfW * 0.08;
            const hasRight = fc.features.some(f => f !== feature && pointInFeature(maxLng + probeEps, centerLat, f));
            const hasLeft = fc.features.some(f => f !== feature && pointInFeature(minLng - probeEps, centerLat, f));
            const putLeft = hasRight && !hasLeft;
            labelLng = putLeft ? (minLng - halfW * 0.3) : (maxLng + halfW * 0.3);
            labelLat = centerLat;
          }
          const [lx, ly] = toLocal([labelLng, labelLat]);

          const sprite = makeLabelSprite(name, '#ffff00'); // 纯黄
          const hWorld = CELL_LABEL_HEIGHT_M * upm;
          sprite.scale.set(hWorld * sprite.userData.aspect, hWorld, 1);
          sprite.position.set(base.x + lx, base.y + ly, base.z + depth + hWorld * 0.6);
          group.add(sprite);
          cellLabels.push({ sprite, lng: labelLng, lat: labelLat, upm, aspect: sprite.userData.aspect });
        }
      });
    });

    tb.add(group);
  }
}
</script>
