<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小种子花园 · 亲手种与比一比</title>
<link rel="stylesheet" href="../touch.css"><link rel="stylesheet" href="plant.css"><script src="../touch.js"></script>
</head><body>
<main>
  <div class="background" aria-hidden="true"><div class="hill"></div><div class="cloud"></div></div>
  <section class="message" aria-live="polite"><h1 id="title"></h1><p id="description"></p></section>
  <section id="garden" aria-label="种子花园，点花盆、根或叶子探索"></section>
  <aside>
    <nav aria-label="玩法"><button data-mode="grow" data-speak-ignore>亲手种花</button><button data-mode="compare" data-speak-ignore>两盆比一比</button></nav>
    <div id="tools">
      <button id="sow" class="tool" data-speak-ignore><span aria-hidden="true">🌻</span>种下种子</button>
      <button id="water" class="tool" data-speak-ignore><span aria-hidden="true">💧</span>浇一点水</button>
      <button id="light" class="tool" data-speak-ignore><span aria-hidden="true">☀️</span><span id="light-label">遮住阳光</span></button>
      <button id="drain" class="tool" data-speak-ignore><span aria-hidden="true">🪴</span>排掉积水</button>
    </div>
    <div id="experiments" hidden><button data-factor="water" data-speak-ignore>有水 / 没有水</button><button data-factor="light" data-speak-ignore>有光 / 没有光</button></div>
    <p id="feedback" role="status"></p>
    <div id="stages" aria-label="生长记录"></div>
    <button id="next" class="primary" data-speak-ignore>过一段时间</button>
    <button id="reset" data-speak-ignore>重新播种</button>
    <p class="note">时间加快的向日葵示意 · 温度适宜、空气充足<br>现实中要等许多天，开花还要更久。</p>
  </aside>
</main>
<script src="../speak.js"></script><script src="plant-model.js"></script><script src="plant.js"></script>
</body></html>
