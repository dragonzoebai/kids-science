<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物生长模拟 · 小种子花园</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --soil: #6d4227;
      --soil-dark: #3a2418;
      --leaf: #35b85a;
      --leaf-dark: #178d43;
      --sun: #ffd85a;
      --water: #65caff;
      --cream: #fff7d6;
      --ink: #26422f;
      --muted: rgba(38, 66, 47, .68);
      --panel: rgba(255, 253, 232, .78);
      --line: rgba(91, 126, 82, .18);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: "YouYuan", "幼圆", "LXGW WenKai", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 232, 96, .48), transparent 24%),
        radial-gradient(circle at 78% 28%, rgba(132, 219, 255, .34), transparent 25%),
        linear-gradient(180deg, #bdf2ff 0%, #e7fbf1 50%, #fff3c0 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        linear-gradient(45deg, rgba(255,255,255,.25) 25%, transparent 25% 75%, rgba(255,255,255,.25) 75%);
      background-size: 48px 48px, 32px 32px;
      mix-blend-mode: soft-light;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #title-card {
      position: absolute;
      left: 24px;
      top: 22px;
      width: min(402px, calc(100vw - 48px));
      z-index: 3;
      padding: 22px 24px 20px;
      border: 2px solid rgba(255, 255, 255, .76);
      border-radius: 32px 32px 12px 32px;
      background: linear-gradient(145deg, rgba(255,253,232,.86), rgba(232,255,223,.7));
      box-shadow: 0 26px 82px rgba(71, 139, 91, .22), inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter: blur(18px);
    }

    #title-card::before {
      content: "🌱";
      position: absolute;
      right: 20px;
      top: -20px;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 22px;
      background: #fff;
      font-size: 32px;
      transform: rotate(9deg);
      box-shadow: 0 16px 36px rgba(65, 145, 67, .2);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(84, 211, 112, .18);
      color: #23804a;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    h1 {
      margin-top: 13px;
      color: #26422f;
      font-size: 35px;
      line-height: 1.08;
      letter-spacing: .08em;
      text-shadow: 0 3px 0 rgba(255,255,255,.85);
    }

    h1 span { color: #ff8b2b; }

    #title-card p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.76;
    }

    #controls {
      position: absolute;
      right: 24px;
      top: 22px;
      z-index: 3;
      width: 318px;
      padding: 18px 18px 16px;
      border: 2px solid rgba(255,255,255,.76);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 26px 76px rgba(65, 126, 87, .2), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .control-head strong {
      font-size: 16px;
      letter-spacing: .08em;
    }

    .pill-btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      color: #fff;
      background: linear-gradient(135deg, #35b85a, #16a6a6);
      font: 900 12px/1 "YouYuan", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      box-shadow: 0 11px 22px rgba(30, 166, 92, .24);
      transition: transform .18s ease, filter .18s ease;
    }

    .pill-btn:hover { transform: translateY(-2px) rotate(-1deg); filter: saturate(1.12); }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 11px;
    }

    .quick-actions .pill-btn:first-child { background: linear-gradient(135deg, #65caff, #3d8dff); }
    .quick-actions .pill-btn:last-child { background: linear-gradient(135deg, #ffd85a, #ff9233); }

    .control-row {
      display: grid;
      grid-template-columns: 78px 1fr 48px;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px dashed var(--line);
      color: rgba(38,66,47,.78);
      font-size: 13px;
    }

    .control-row input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #35b85a;
    }

    .control-row.water input { accent-color: #52bfff; }
    .control-row.sun input { accent-color: #ffaf2e; }

    .val {
      color: #178d43;
      text-align: right;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    #diagnosis {
      margin-top: 8px;
      padding: 13px 14px;
      min-height: 76px;
      border-radius: 20px;
      background: rgba(84, 211, 112, .14);
      color: rgba(38,66,47,.72);
      font-size: 12px;
      line-height: 1.62;
    }

    #diagnosis strong {
      display: block;
      color: #178d43;
      font-size: 14px;
      margin-bottom: 2px;
    }

    #story {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 22px;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      pointer-events: none;
    }

    .step {
      min-height: 105px;
      padding: 14px 14px 13px;
      border: 2px solid rgba(255,255,255,.68);
      border-radius: 24px;
      background: rgba(255,253,232,.58);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 38px rgba(71, 139, 91, .13);
      transition: transform .28s ease, background .28s ease, border-color .28s ease;
    }

    .step.active {
      transform: translateY(-9px);
      border-color: rgba(84, 211, 112, .9);
      background: rgba(240, 255, 220, .86);
      box-shadow: 0 22px 54px rgba(48, 164, 75, .18);
    }

    .num {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-bottom: 9px;
      color: #fff;
      border-radius: 12px;
      background: #26422f;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 4px 4px 0 rgba(255,216,90,.45);
    }

    .step strong {
      display: block;
      color: #26422f;
      font-size: 14px;
      letter-spacing: .08em;
    }

    .step span:last-child {
      display: block;
      margin-top: 7px;
      color: rgba(38,66,47,.64);
      font-size: 12px;
      line-height: 1.52;
    }

    #growth-badge {
      position: absolute;
      left: 50%;
      top: 17px;
      z-index: 3;
      transform: translateX(-50%);
      min-width: 250px;
      padding: 12px 18px;
      border: 2px solid rgba(255,255,255,.76);
      border-radius: 999px;
      background: rgba(255,253,232,.74);
      backdrop-filter: blur(14px);
      text-align: center;
      box-shadow: 0 18px 48px rgba(71, 139, 91, .16);
    }

    #growth-badge strong {
      color: #ff8b2b;
      font-size: 17px;
      letter-spacing: .08em;
    }

    #growth-badge span {
      display: block;
      margin-top: 3px;
      color: rgba(38,66,47,.64);
      font-size: 11px;
    }

    @media (max-width: 960px) {
      body { overflow: auto; }
      #title-card, #controls {
        left: 14px;
        right: 14px;
        width: auto;
      }
      #title-card { top: 14px; }
      #title-card h1 { font-size: 28px; }
      #growth-badge { display: none; }
      #controls { top: auto; bottom: 14px; }
      #story { display: none; }
    }
  </style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
  <canvas id="garden" aria-label="植物生长模拟画布"></canvas>

  <section id="title-card">
    <div class="eyebrow">BIO LAB · 儿童科普</div>
    <h1>小种子<span>花园</span></h1>
    <p>植物像小朋友一样需要合适的水、阳光和时间。点击浇水、晒太阳，或调节右侧滑块，观察种子怎样发芽、长叶、开花！</p>
  </section>

  <section id="growth-badge" data-speak-auto>
    <strong id="stage-title">种子睡醒中</strong>
    <span id="stage-tip">水分和阳光刚刚好，生长会更快。</span>
  </section>

  <section id="controls" aria-label="植物实验控制台">
    <div class="control-head">
      <strong>园丁工具箱</strong>
      <button class="pill-btn" id="reset" type="button">重新播种</button>
    </div>
    <div class="quick-actions">
      <button class="pill-btn" id="waterBtn" type="button">💧 浇一点水</button>
      <button class="pill-btn" id="sunBtn" type="button">☀️ 晒晒太阳</button>
    </div>
    <div class="control-row water">
      <label for="water">土壤水分</label>
      <input id="water" type="range" min="0" max="100" step="1" value="55">
      <span class="val" id="waterVal">55%</span>
    </div>
    <div class="control-row sun">
      <label for="sunlight">阳光强度</label>
      <input id="sunlight" type="range" min="0" max="100" step="1" value="68">
      <span class="val" id="sunVal">68%</span>
    </div>
    <div class="control-row">
      <label for="speed">时间速度</label>
      <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1.2">
      <span class="val" id="speedVal">1.2×</span>
    </div>
    <div id="diagnosis"><strong>状态很好</strong><span>土壤湿润，阳光温暖，小种子正在积攒力量。</span></div>
  </section>

  <section id="story" aria-label="植物生长步骤">
    <div class="step active"><span class="num">1</span><strong>种子</strong><span>种子吸水后，里面的小生命开始醒来。</span></div>
    <div class="step"><span class="num">2</span><strong>发芽</strong><span>根先向下找水，嫩芽向上找阳光。</span></div>
    <div class="step"><span class="num">3</span><strong>小苗</strong><span>叶片展开，开始进行光合作用。</span></div>
    <div class="step"><span class="num">4</span><strong>长高</strong><span>茎变粗变高，能支撑更多叶子。</span></div>
    <div class="step"><span class="num">5</span><strong>开花</strong><span>条件合适时，植物会开花甚至结果。</span></div>
  </section>

  <script>
    const canvas = document.getElementById('garden');
    const ctx = canvas.getContext('2d');
    const water = document.getElementById('water');
    const sunlight = document.getElementById('sunlight');
    const speed = document.getElementById('speed');
    const waterVal = document.getElementById('waterVal');
    const sunVal = document.getElementById('sunVal');
    const speedVal = document.getElementById('speedVal');
    const waterBtn = document.getElementById('waterBtn');
    const sunBtn = document.getElementById('sunBtn');
    const resetBtn = document.getElementById('reset');
    const diagnosis = document.getElementById('diagnosis');
    const stageTitle = document.getElementById('stage-title');
    const stageTip = document.getElementById('stage-tip');
    const steps = [...document.querySelectorAll('.step')];

    let w = 0;
    let h = 0;
    let dpr = 1;
    let t = 0;
    let growth = 0;
    let particles = [];
    let bugs = [];

    const stages = [
      ['种子睡醒中', '水分让种皮变软，胚芽准备出发。'],
      ['嫩芽冒出来', '根向下，芽向上，这是植物的方向感。'],
      ['小苗展开叶片', '叶子像小工厂，开始把阳光变成养分。'],
      ['茎叶快速长高', '水和养分通过茎运输到每一片叶子。'],
      ['花朵开放啦', '光照和水分合适，植物进入开花阶段。']
    ];

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      makeBugs();
    }

    function makeBugs() {
      bugs = Array.from({ length: 7 }, (_, i) => ({
        x: w * (.12 + i * .12),
        y: h * (.52 + Math.sin(i) * .08),
        r: 2 + (i % 3),
        hue: i % 2 ? '#ff8b2b' : '#35b85a',
        phase: i * 1.7
      }));
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#baf0ff');
      sky.addColorStop(.48, '#e8fbef');
      sky.addColorStop(1, '#fff0b7');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      const sunPower = Number(sunlight.value) / 100;
      const sx = w * .78;
      const sy = h * .18;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(t * .18);
      for (let i = 0; i < 20; i++) {
        ctx.rotate(Math.PI * 2 / 20);
        ctx.beginPath();
        ctx.moveTo(44, 0);
        ctx.lineTo(88 + Math.sin(t * 2 + i) * 7 * sunPower, 8);
        ctx.lineTo(88 + Math.sin(t * 2 + i) * 7 * sunPower, -8);
        ctx.closePath();
        ctx.fillStyle = `rgba(255, 184, 47, ${.12 + sunPower * .22})`;
        ctx.fill();
      }
      const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 120);
      glow.addColorStop(0, 'rgba(255,255,217,1)');
      glow.addColorStop(.35, `rgba(255,216,90,${.65 + sunPower * .25})`);
      glow.addColorStop(1, 'rgba(255,216,90,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, 120, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd85a';
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      for (let i = 0; i < 5; i++) {
        const x = (i * 270 + t * 11) % (w + 260) - 130;
        const y = 96 + i * 34 + Math.sin(t + i) * 9;
        drawCloud(x, y, .52 + i * .04);
      }
    }

    function drawCloud(x, y, s) {
      ctx.save();
      ctx.globalAlpha = .46;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x - 46 * s, y + 12 * s, 30 * s, 0, Math.PI * 2);
      ctx.arc(x - 8 * s, y - 4 * s, 43 * s, 0, Math.PI * 2);
      ctx.arc(x + 41 * s, y + 12 * s, 32 * s, 0, Math.PI * 2);
      ctx.roundRect(x - 76 * s, y + 8 * s, 150 * s, 38 * s, 20 * s);
      ctx.fill();
      ctx.restore();
    }

    function drawGround() {
      const y = h * .71;
      const grass = ctx.createLinearGradient(0, y, 0, h);
      grass.addColorStop(0, '#90df78');
      grass.addColorStop(.5, '#5bbc65');
      grass.addColorStop(1, '#39784d');
      ctx.fillStyle = grass;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, y + 28);
      for (let x = 0; x <= w + 80; x += 80) {
        ctx.quadraticCurveTo(x + 40, y + Math.sin(x * .014 + t) * 20, x + 80, y + 28);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();

      const soilY = h * .80;
      const soil = ctx.createLinearGradient(0, soilY, 0, h);
      soil.addColorStop(0, '#7a4a2d');
      soil.addColorStop(1, '#3d271a');
      ctx.fillStyle = soil;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, soilY);
      for (let x = 0; x <= w + 50; x += 50) {
        ctx.quadraticCurveTo(x + 25, soilY + Math.sin(x * .04) * 10, x + 50, soilY);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.globalAlpha = .28;
      ctx.fillStyle = '#2a190f';
      for (let i = 0; i < 70; i++) {
        const x = (i * 83) % w;
        const yy = soilY + 14 + ((i * 47) % Math.max(40, h - soilY - 20));
        ctx.beginPath();
        ctx.ellipse(x, yy, 2 + (i % 5), 1.2 + (i % 3), i, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawLeaf(x, y, length, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      const grad = ctx.createLinearGradient(0, 0, length, 0);
      grad.addColorStop(0, color);
      grad.addColorStop(1, '#8eea7e');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(length * .38, -length * .38, length * .92, -length * .20, length, 0);
      ctx.bezierCurveTo(length * .72, length * .38, length * .22, length * .25, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(23, 112, 54, .32)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(4, 0);
      ctx.lineTo(length * .84, 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawFlower(x, y, scale, color) {
      ctx.save();
      ctx.translate(x, y);
      for (let i = 0; i < 7; i++) {
        ctx.rotate(Math.PI * 2 / 7);
        const petal = ctx.createRadialGradient(0, -12 * scale, 1, 0, -18 * scale, 24 * scale);
        petal.addColorStop(0, '#fff');
        petal.addColorStop(1, color);
        ctx.fillStyle = petal;
        ctx.beginPath();
        ctx.ellipse(0, -17 * scale, 9 * scale, 19 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#ffd85a';
      ctx.beginPath();
      ctx.arc(0, 0, 9 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPlant() {
      const baseX = w * .52;
      const baseY = h * .805;
      const g = clamp(growth, 0, 100) / 100;
      const stage = Math.min(4, Math.floor(g * 5));
      const wind = Math.sin(t * 1.5) * 4;

      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,.13)';
      ctx.beginPath();
      ctx.ellipse(baseX, baseY + 10, 80 + g * 80, 12 + g * 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (g < .18) {
        ctx.save();
        ctx.translate(baseX, baseY + 8);
        ctx.rotate(-.16 + Math.sin(t * 1.3) * .02);
        ctx.fillStyle = '#9b6337';
        ctx.strokeStyle = '#5f341f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, 34, 22, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.18)';
        ctx.beginPath();
        ctx.ellipse(-10, -7, 10, 5, -.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (g >= .08) {
        const sprout = clamp((g - .08) / .18, 0, 1);
        ctx.strokeStyle = '#178d43';
        ctx.lineWidth = 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(baseX, baseY + 8);
        ctx.quadraticCurveTo(baseX - 12 + wind, baseY - 35 * sprout, baseX + wind, baseY - 78 * sprout);
        ctx.stroke();
        drawLeaf(baseX + wind - 4, baseY - 50 * sprout, 36 * sprout, -2.55, '#35b85a');
      }

      if (g >= .24) {
        const tall = clamp((g - .24) / .58, 0, 1);
        const topY = baseY - 70 - tall * 235;
        ctx.strokeStyle = '#249b4b';
        ctx.lineWidth = 10 + tall * 7;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(baseX, baseY + 8);
        ctx.bezierCurveTo(baseX - 20 + wind, baseY - 80, baseX + 28 + wind, baseY - 180, baseX + wind, topY);
        ctx.stroke();

        const leaves = [
          [.22, -2.68, 54], [.34, -.48, 62], [.48, -2.74, 72], [.62, -.43, 76], [.76, -2.62, 66], [.88, -.52, 54]
        ];
        leaves.forEach(([p, a, len], i) => {
          if (tall > p - .12) {
            const visible = clamp((tall - p + .12) / .18, 0, 1);
            const y = baseY - 80 - tall * 220 * p;
            const x = baseX + Math.sin(p * 7) * 10 + wind * p;
            drawLeaf(x, y, len * visible, a + Math.sin(t + i) * .04, i % 2 ? '#48c965' : '#35b85a');
          }
        });

        if (g > .78) {
          const bloom = clamp((g - .78) / .18, 0, 1);
          drawFlower(baseX + wind, topY, .45 + bloom * .65, '#ff7fb0');
          if (g > .92) {
            ctx.fillStyle = '#ff8b2b';
            ctx.beginPath();
            ctx.arc(baseX + 62 + wind * .4, baseY - 146, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.35)';
            ctx.beginPath();
            ctx.arc(baseX + 57 + wind * .4, baseY - 151, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      return stage;
    }

    function drawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= .015;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (p.kind === 'water') {
          ctx.ellipse(p.x, p.y, 4, 7, .2, 0, Math.PI * 2);
        } else {
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();
      }
    }

    function drawTinyLife() {
      bugs.forEach((b, i) => {
        const x = b.x + Math.sin(t * .9 + b.phase) * 26;
        const y = b.y + Math.cos(t * 1.2 + b.phase) * 10;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.sin(t + i) * .3);
        ctx.fillStyle = b.hue;
        ctx.beginPath();
        ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-2, -3);
        ctx.lineTo(-9, -11);
        ctx.moveTo(2, -3);
        ctx.lineTo(9, -11);
        ctx.stroke();
        ctx.restore();
      });
    }

    function emitWater() {
      const targetX = w * .52;
      const targetY = h * .54;
      for (let i = 0; i < 34; i++) {
        particles.push({
          kind: 'water',
          x: targetX - 135 + Math.random() * 70,
          y: targetY - 100 + Math.random() * 24,
          vx: 2.2 + Math.random() * 1.8,
          vy: 1.5 + Math.random() * 2.6,
          gravity: .04,
          color: '#58c8ff',
          size: 4,
          life: .9
        });
      }
    }

    function emitSun() {
      for (let i = 0; i < 42; i++) {
        particles.push({
          kind: 'sun',
          x: w * .78 + (Math.random() - .5) * 90,
          y: h * .18 + (Math.random() - .5) * 70,
          vx: -1.4 - Math.random() * 2.2,
          vy: 1.2 + Math.random() * 2.4,
          gravity: 0,
          color: i % 2 ? '#ffd85a' : '#fff7a7',
          size: 3 + Math.random() * 3,
          life: .95
        });
      }
    }

    function getHealth() {
      const wa = Number(water.value);
      const su = Number(sunlight.value);
      let score = 1;
      let title = '状态很好';
      let text = '土壤湿润，阳光温暖，小植物正在开心生长。';
      let color = '#178d43';

      if (wa < 25) {
        score *= .35;
        title = '有点口渴';
        text = '水太少，根很难吸到水，生长会变慢。';
        color = '#2d88b8';
      } else if (wa > 82) {
        score *= .42;
        title = '水太多啦';
        text = '土壤太湿，根可能呼吸困难，要少浇一点。';
        color = '#1b7aa7';
      }

      if (su < 28) {
        score *= .36;
        title = title === '状态很好' ? '阳光不足' : title + ' + 缺阳光';
        text = '阳光太少，叶子制造养分的速度会变慢。';
        color = '#8a7a22';
      } else if (su > 90 && wa < 45) {
        score *= .55;
        title = '太阳有点猛';
        text = '太阳很强但水不够，植物容易晒蔫，记得补水。';
        color = '#d06b1f';
      }

      if (wa >= 42 && wa <= 72 && su >= 48 && su <= 86) {
        score = 1.28;
        title = '黄金生长时间';
        text = '水分和阳光都刚刚好，小苗会长得特别快！';
        color = '#178d43';
      }
      return { score, title, text, color };
    }

    function updateUI(stage) {
      waterVal.textContent = water.value + '%';
      sunVal.textContent = sunlight.value + '%';
      speedVal.textContent = Number(speed.value).toFixed(1) + '×';
      const health = getHealth();
      diagnosis.innerHTML = `<strong style="color:${health.color}">${health.title}</strong><span>${health.text}</span>`;
      steps.forEach((el, i) => el.classList.toggle('active', i === stage));
      stageTitle.textContent = stages[stage][0];
      stageTip.textContent = stages[stage][1];
    }

    function tick() {
      t += .016;
      const health = getHealth();
      growth = clamp(growth + .025 * Number(speed.value) * health.score, 0, 100);
      const wa = Number(water.value);
      const su = Number(sunlight.value);
      water.value = clamp(wa - .018 * Number(speed.value) - su * .00008, 0, 100).toFixed(2);

      drawSky();
      drawGround();
      drawTinyLife();
      const stage = drawPlant();
      drawParticles();
      updateUI(stage);
      requestAnimationFrame(tick);
    }

    waterBtn.addEventListener('click', () => {
      water.value = clamp(Number(water.value) + 16, 0, 100);
      emitWater();
    });

    sunBtn.addEventListener('click', () => {
      sunlight.value = clamp(Number(sunlight.value) + 12, 0, 100);
      emitSun();
    });

    resetBtn.addEventListener('click', () => {
      growth = 0;
      water.value = 55;
      sunlight.value = 68;
      particles = [];
      emitWater();
      emitSun();
    });

    [water, sunlight, speed].forEach(input => input.addEventListener('input', () => updateUI(Math.min(4, Math.floor(growth / 20)))));
    window.addEventListener('resize', resize);

    resize();
    emitWater();
    emitSun();
    tick();
  </script>
<script src="../speak.js"></script>
</body>
</html>
