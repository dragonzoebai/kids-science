<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水循环 · 从太平洋到中国</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #020713;
      color: #eaf8ff;
      font-family: "STKaiti", "KaiTi", "Songti SC", "Noto Serif SC", serif;
    }
    canvas { display: block; }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 72% 38%, rgba(77, 216, 255, .08), transparent 28%),
        radial-gradient(circle at 18% 16%, rgba(255, 218, 122, .09), transparent 24%),
        linear-gradient(90deg, rgba(2, 7, 19, .72), transparent 30%, transparent 70%, rgba(2, 7, 19, .55));
    }

    #title {
      position: absolute;
      top: 22px;
      left: 24px;
      width: 390px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(167, 230, 255, .22);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(6, 19, 39, .82), rgba(4, 42, 63, .46));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08);
      backdrop-filter: blur(16px);
    }
    #title::before {
      content: "";
      position: absolute;
      inset: 10px auto 10px -1px;
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(#aef3ff, #6ee7b7, #facc15);
      box-shadow: 0 0 20px rgba(110, 231, 183, .8);
    }
    #title h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .12em;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 0 28px rgba(103, 232, 249, .32);
    }
    #title h1 span { color: #84f3ff; }
    #title p {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.75;
      color: rgba(219, 246, 255, .78);
    }

    #story {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: min(620px, calc(100vw - 48px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .step {
      min-height: 88px;
      padding: 12px 12px 10px;
      border: 1px solid rgba(185, 236, 255, .14);
      border-radius: 17px;
      background: rgba(5, 17, 35, .68);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      transition: border-color .28s ease, background .28s ease, transform .28s ease;
    }
    .step.active {
      transform: translateY(-7px);
      border-color: rgba(122, 241, 255, .7);
      background: linear-gradient(160deg, rgba(21, 115, 146, .76), rgba(7, 28, 50, .78));
      box-shadow: 0 15px 40px rgba(18, 165, 214, .22), inset 0 1px 0 rgba(255, 255, 255, .16);
    }
    .step .num {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-bottom: 8px;
      border-radius: 50%;
      color: #02121f;
      background: #bff7ff;
      font: 800 12px/1 Georgia, serif;
    }
    .step strong {
      display: block;
      font-size: 14px;
      color: #fff;
      letter-spacing: .08em;
    }
    .step span {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(223, 244, 255, .72);
    }

    #controls {
      position: absolute;
      right: 24px;
      top: 22px;
      width: 260px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      background: rgba(4, 13, 29, .62);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(16px);
    }
    .control-row {
      display: grid;
      grid-template-columns: 58px 1fr 42px;
      align-items: center;
      gap: 10px;
      color: rgba(224, 245, 255, .78);
      font-size: 12px;
    }
    #speed { width: 100%; accent-color: #67e8f9; }
    #speed-val { color: #bff7ff; font-variant-numeric: tabular-nums; text-align: right; }
    #legend-note {
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      color: rgba(222, 241, 255, .6);
      font-size: 11px;
      line-height: 1.65;
    }

    #caption {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 320px;
      padding: 18px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, .13);
      background: linear-gradient(160deg, rgba(1, 20, 41, .7), rgba(2, 56, 78, .45));
      backdrop-filter: blur(16px);
    }
    #caption .tag {
      color: #fef08a;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    #caption h2 {
      margin-top: 7px;
      font-size: 21px;
      letter-spacing: .08em;
      color: #ffffff;
    }
    #caption p {
      margin-top: 9px;
      color: rgba(225, 246, 255, .74);
      font-size: 13px;
      line-height: 1.72;
    }

    #label-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      #title, #controls, #caption { width: auto; left: 14px; right: 14px; }
      #title { top: 14px; }
      #controls { display: none; }
      #caption { display: none; }
      #story { left: 14px; right: 14px; bottom: 14px; width: auto; grid-template-columns: 1fr; }
      .step { display: none; }
      .step.active { display: block; }
    }
  </style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
  <canvas id="label-canvas"></canvas>
  <div id="hud"></div>

  <section id="title">
    <h1>水循环<span>星球剧场</span></h1>
    <p>参考 hours.html 的三维地球结构：从太平洋升起水汽，凝结为云，被季风送到中国陆地降雨，雨水汇成长江、黄河，最终奔流回海。</p>
  </section>

  <section id="controls">
    <div class="control-row">
      <label for="speed">演示速度</label>
      <input type="range" id="speed" min="0.4" max="2.8" step="0.1" value="1">
      <span id="speed-val">1.0×</span>
    </div>
    <div id="legend-note">拖拽可旋转视角，滚轮缩放。蓝色光带表示水汽与河流，银白云团表示凝结云，金色粒子表示降雨。</div>
  </section>

  <section id="caption">
    <div class="tag">Hydrologic Cycle</div>
    <h2 id="phase-title">太平洋蒸发</h2>
    <p id="phase-text">太阳加热海面，水分子从太平洋表层逸出，变成看不见的水汽向上升腾。</p>
  </section>

  <section id="story" aria-label="水循环过程">
    <div class="step active"><span class="num">1</span><strong>海面蒸发</strong><span>太平洋吸收太阳能，水汽升空。</span></div>
    <div class="step"><span class="num">2</span><strong>云朵凝结</strong><span>水汽冷却，凝结成云滴。</span></div>
    <div class="step"><span class="num">3</span><strong>飘向中国</strong><span>云团随风跨越西太平洋。</span></div>
    <div class="step"><span class="num">4</span><strong>陆地下雨</strong><span>云滴增大，在中国上空降落。</span></div>
    <div class="step"><span class="num">5</span><strong>江河入海</strong><span>长江、黄河把水带回大海。</span></div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three-0.160.0/build/three.module.js",
      "three/addons/": "../vendor/three-0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020713, 0.0017);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 80000);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 150;
    controls.maxDistance = 640;
    controls.target.set(0, 7, 0);

    const labelCanvas = document.getElementById('label-canvas');
    const labelCtx = labelCanvas.getContext('2d');

    const EARTH_R = 100;
    const WATER_R = EARTH_R + 2.4;
    const clock = new THREE.Clock();
    let speed = 1;

    const PHASES = [
      { title: '太平洋蒸发', text: '太阳加热海面，水分子从太平洋表层逸出，变成看不见的水汽向上升腾。' },
      { title: '水汽凝结成云', text: '高空温度较低，水汽围绕微小尘埃凝结，形成银白色的云朵。' },
      { title: '云团飘向中国', text: '东亚季风把云团从西太平洋推向中国陆地，水在大气中完成远距离搬运。' },
      { title: '中国陆地下雨', text: '云滴不断碰并长大，重力超过上升气流托举后，就以雨滴形式落到地面。' },
      { title: '长江黄河回到大海', text: '雨水在地表汇流，进入长江与黄河，穿过平原和三角洲，最终重新注入海洋。' },
    ];

    const tl = new THREE.TextureLoader();
    function texture(path, fallback) {
      const t = tl.load(path, undefined, undefined, () => {
        const c = document.createElement('canvas');
        c.width = c.height = 2;
        const ctx = c.getContext('2d');
        ctx.fillStyle = fallback;
        ctx.fillRect(0, 0, 2, 2);
        t.image = c;
        t.needsUpdate = true;
      });
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function latLon3D(lat, lon, r = EARTH_R) {
      const phi = (lon + 180) * Math.PI / 180;
      const latRad = lat * Math.PI / 180;
      return new THREE.Vector3(
        -r * Math.cos(phi) * Math.cos(latRad),
         r * Math.sin(latRad),
         r * Math.sin(phi) * Math.cos(latRad)
      );
    }

    function makeArc(a, b, height = 54, samples = 96) {
      const start = latLon3D(a.lat, a.lon, WATER_R);
      const end = latLon3D(b.lat, b.lon, WATER_R);
      const mid = start.clone().add(end).normalize().multiplyScalar(EARTH_R + height);
      const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
      return curve.getPoints(samples);
    }

    function makeSurfacePath(points, r = EARTH_R + 3.2) {
      return points.map((p) => latLon3D(p.lat, p.lon, r));
    }

    function makeLine(points, color, opacity = 1) {
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      return new THREE.Line(geo, mat);
    }

    function makeGlowPoint(color, size, opacity = 1) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(size, 12, 12),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity })
      );
    }

    function resizeLabelCanvas() {
      labelCanvas.width = Math.floor(window.innerWidth * window.devicePixelRatio);
      labelCanvas.height = Math.floor(window.innerHeight * window.devicePixelRatio);
      labelCanvas.style.width = window.innerWidth + 'px';
      labelCanvas.style.height = window.innerHeight + 'px';
      labelCtx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    resizeLabelCanvas();

    {
      const pos = [], col = [];
      for (let i = 0; i < 2600; i++) {
        const r = 42000;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos.push(r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph));
        const b = Math.pow(Math.random(), 2.1) * .75 + .2;
        col.push(b * .72, b * .92, b + .1);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ vertexColors: true, size: 1.7, sizeAttenuation: false })));
    }

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(24, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffdf7a })
    );
    sun.position.set(210, 84, 42);
    scene.add(sun);
    for (const [scale, opacity, color] of [[1.45, .14, 0xffcf67], [2.05, .075, 0xff8c3a], [2.9, .04, 0xffef9f]]) {
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(24 * scale, 32, 32),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.BackSide })
      );
      glow.position.copy(sun.position);
      scene.add(glow);
    }

    scene.add(new THREE.AmbientLight(0x89cfff, .42));
    const sunLight = new THREE.DirectionalLight(0xfff4de, 2.65);
    sunLight.position.copy(sun.position).normalize();
    scene.add(sunLight);
    const rimLight = new THREE.DirectionalLight(0x56ccff, 1.4);
    rimLight.position.set(-1, .35, 1);
    scene.add(rimLight);

    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_R, 96, 96),
      new THREE.MeshStandardMaterial({
        map: texture('textures/2k_earth_daymap.jpg', '#0b4f7a'),
        roughness: .92,
        metalness: 0,
      })
    );
    earthGroup.add(earth);

    const oceanVeil = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_R * 1.006, 96, 96),
      new THREE.MeshBasicMaterial({ color: 0x0b8ac2, transparent: true, opacity: .075, blending: THREE.AdditiveBlending })
    );
    earthGroup.add(oceanVeil);

    const PACIFIC = { lat: 18, lon: 156 };
    const CHINA = { lat: 31.6, lon: 108.5 };
    const EAST_SEA = { lat: 30.8, lon: 122.6 };
    const BOHAI = { lat: 38.7, lon: 119.4 };

    // 与台风页面保持相同的中国默认朝向和观察距离。
    earthGroup.rotation.x = -8 * Math.PI / 180;
    earthGroup.rotation.y = -120 * Math.PI / 180;
    earthGroup.updateMatrixWorld(true);
    const chinaViewDirection = earthGroup.localToWorld(latLon3D(35, 105, 1)).normalize();
    camera.position.copy(controls.target).addScaledVector(chinaViewDirection, 220);
    controls.update();

    const labels = [
      { text: '太平洋蒸发区', color: '#89f7ff', pos: latLon3D(PACIFIC.lat, PACIFIC.lon, EARTH_R + 9) },
      { text: '中国降雨区', color: '#fef08a', pos: latLon3D(CHINA.lat, CHINA.lon, EARTH_R + 10) },
      { text: '长江入海', color: '#7dd3fc', pos: latLon3D(EAST_SEA.lat, EAST_SEA.lon, EARTH_R + 7) },
      { text: '黄河入海', color: '#fde68a', pos: latLon3D(BOHAI.lat, BOHAI.lon, EARTH_R + 7) },
    ];

    const pacificRing = new THREE.Mesh(
      new THREE.RingGeometry(7, 15, 72),
      new THREE.MeshBasicMaterial({ color: 0x71f3ff, transparent: true, opacity: .62, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
    );
    pacificRing.position.copy(latLon3D(PACIFIC.lat, PACIFIC.lon, EARTH_R + 3.8));
    pacificRing.lookAt(pacificRing.position.clone().multiplyScalar(2));
    earthGroup.add(pacificRing);

    const chinaRing = new THREE.Mesh(
      new THREE.RingGeometry(5, 11, 72),
      new THREE.MeshBasicMaterial({ color: 0xffe36e, transparent: true, opacity: .0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
    );
    chinaRing.position.copy(latLon3D(CHINA.lat, CHINA.lon, EARTH_R + 4));
    chinaRing.lookAt(chinaRing.position.clone().multiplyScalar(2));
    earthGroup.add(chinaRing);

    const vaporPoints = [];
    for (let i = 0; i < 90; i++) {
      const p = makeGlowPoint(i % 3 ? 0x8ff7ff : 0xffffff, .55 + Math.random() * .7, .5 + Math.random() * .35);
      p.userData = {
        seed: Math.random() * Math.PI * 2,
        height: Math.random() * 30,
        speed: .7 + Math.random() * 1.3,
      };
      earthGroup.add(p);
      vaporPoints.push(p);
    }

    function makeCloudPuff(seed) {
      const group = new THREE.Group();
      const coreGeo = new THREE.SphereGeometry(1, 28, 18);
      const hazeGeo = new THREE.SphereGeometry(1, 18, 12);

      for (let i = 0; i < 22; i++) {
        const edge = i > 14;
        const angle = i * 1.74 + seed;
        const band = i < 9 ? -8 : i < 16 ? 5 : 0;
        const puff = new THREE.Mesh(
          coreGeo,
          new THREE.MeshStandardMaterial({
            color: edge ? 0xe9f3f8 : 0xfbfdff,
            roughness: .86,
            transparent: true,
            opacity: edge ? .55 + Math.random() * .16 : .72 + Math.random() * .2,
            depthWrite: false,
            emissive: 0x9bdfff,
            emissiveIntensity: edge ? .05 : .1,
          })
        );
        const radius = edge ? 6.4 + Math.random() * 3.2 : 7.5 + Math.random() * 4.8;
        puff.position.set(
          band + Math.cos(angle) * (edge ? 8 : 5.5) + (Math.random() - .5) * 4,
          -1.8 + Math.sin(angle * 1.3) * 2.1 + Math.random() * (edge ? 2.2 : 5.2),
          Math.sin(angle) * (edge ? 5.8 : 3.8) + (Math.random() - .5) * 3.5
        );
        puff.scale.set(
          radius * (1.35 + Math.random() * .75),
          radius * (.38 + Math.random() * .24),
          radius * (.72 + Math.random() * .42)
        );
        puff.rotation.set(Math.random() * .35, Math.random() * .45, Math.random() * Math.PI);
        puff.userData = { baseOpacity: puff.material.opacity, drift: Math.random() * Math.PI * 2 };
        group.add(puff);
      }

      for (let i = 0; i < 8; i++) {
        const haze = new THREE.Mesh(
          hazeGeo,
          new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xffffff : 0xb8ecff,
            transparent: true,
            opacity: .13 + Math.random() * .08,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
          })
        );
        haze.position.set((Math.random() - .5) * 34, (Math.random() - .5) * 8, (Math.random() - .5) * 18);
        haze.scale.set(16 + Math.random() * 13, 4 + Math.random() * 3, 9 + Math.random() * 7);
        haze.rotation.z = Math.random() * Math.PI;
        haze.userData = { baseOpacity: haze.material.opacity, drift: Math.random() * Math.PI * 2 };
        group.add(haze);
      }

      group.userData.seed = seed;
      return group;
    }

    const cloudRoute = makeArc({ lat: 22, lon: 150 }, { lat: 32, lon: 111 }, 50, 160);
    const cloudRouteLine = makeLine(cloudRoute, 0x9befff, .18);
    earthGroup.add(cloudRouteLine);

    const cloudA = makeCloudPuff(0);
    const cloudB = makeCloudPuff(1.9);
    earthGroup.add(cloudA, cloudB);

    const rainDrops = [];
    for (let i = 0; i < 96; i++) {
      const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -8 - Math.random() * 9, 0)]);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: i % 4 ? 0x9eeaff : 0xffe88a, transparent: true, opacity: 0 }));
      line.userData = {
        lat: 25 + Math.random() * 12,
        lon: 103 + Math.random() * 18,
        phase: Math.random(),
      };
      earthGroup.add(line);
      rainDrops.push(line);
    }

    const yangtzePts = makeSurfacePath([
      { lat: 33.0, lon: 91.0 }, { lat: 30.7, lon: 99.5 }, { lat: 29.6, lon: 106.5 },
      { lat: 30.6, lon: 112.8 }, { lat: 31.1, lon: 118.1 }, { lat: 31.2, lon: 121.6 },
    ], EARTH_R + 4.2);
    const yellowPts = makeSurfacePath([
      { lat: 35.1, lon: 96.0 }, { lat: 36.6, lon: 103.8 }, { lat: 37.9, lon: 108.6 },
      { lat: 35.1, lon: 111.2 }, { lat: 34.8, lon: 114.5 }, { lat: 37.4, lon: 118.7 },
    ], EARTH_R + 4.6);
    const returnPts = makeSurfacePath([
      { lat: 31.2, lon: 121.6 }, { lat: 29.6, lon: 125.7 }, { lat: 25.4, lon: 132.2 }, { lat: 20.2, lon: 145.6 }, { lat: 18, lon: 156 },
    ], EARTH_R + 3.6);

    const yangtze = makeLine(yangtzePts, 0x18ddff, .28);
    const yellow = makeLine(yellowPts, 0xffdc68, .24);
    const returnLine = makeLine(returnPts, 0x54f0ff, .2);
    earthGroup.add(yangtze, yellow, returnLine);

    const riverDrops = [];
    const riverSpecs = [
      { pts: yangtzePts, color: 0x2ff3ff, count: 12 },
      { pts: yellowPts, color: 0xffe37b, count: 10 },
      { pts: returnPts, color: 0x74f7ff, count: 9 },
    ];
    riverSpecs.forEach((spec) => {
      for (let i = 0; i < spec.count; i++) {
        const dot = makeGlowPoint(spec.color, 1.2, 0);
        dot.userData = { pts: spec.pts, offset: i / spec.count };
        earthGroup.add(dot);
        riverDrops.push(dot);
      }
    });

    const chinaDot = makeGlowPoint(0xfff3a3, 2.4, .9);
    chinaDot.position.copy(latLon3D(CHINA.lat, CHINA.lon, EARTH_R + 5));
    earthGroup.add(chinaDot);

    const pacificDot = makeGlowPoint(0x8ff7ff, 2.1, .9);
    pacificDot.position.copy(latLon3D(PACIFIC.lat, PACIFIC.lon, EARTH_R + 5));
    earthGroup.add(pacificDot);

    function setPointOnPolyline(dot, pts, t) {
      const n = pts.length - 1;
      const scaled = Math.min(n - .001, Math.max(0, t * n));
      const i = Math.floor(scaled);
      const f = scaled - i;
      dot.position.copy(pts[i]).lerp(pts[i + 1], f);
    }

    function phaseFor(t) {
      const cycle = 20;
      return Math.floor(((t % cycle) / cycle) * PHASES.length);
    }

    function updateHud(active) {
      document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i === active));
      document.getElementById('phase-title').textContent = PHASES[active].title;
      document.getElementById('phase-text').textContent = PHASES[active].text;
    }

    let lastPhase = -1;
    function drawLabels() {
      labelCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      labelCtx.font = '600 13px STKaiti, KaiTi, serif';
      labelCtx.textBaseline = 'middle';
      labels.forEach((label) => {
        const world = label.pos.clone().applyMatrix4(earthGroup.matrixWorld);
        const cameraDir = camera.position.clone().sub(world).normalize();
        const normal = world.clone().normalize();
        if (normal.dot(cameraDir) < -.08) return;
        const projected = world.clone().project(camera);
        const x = (projected.x * .5 + .5) * window.innerWidth;
        const y = (-projected.y * .5 + .5) * window.innerHeight;
        labelCtx.save();
        labelCtx.fillStyle = 'rgba(2, 9, 22, .66)';
        labelCtx.strokeStyle = 'rgba(190, 241, 255, .28)';
        labelCtx.lineWidth = 1;
        const w = labelCtx.measureText(label.text).width + 22;
        const h = 27;
        roundRect(labelCtx, x + 13, y - h / 2, w, h, 13);
        labelCtx.fill();
        labelCtx.stroke();
        labelCtx.fillStyle = label.color;
        labelCtx.fillText(label.text, x + 24, y + 1);
        labelCtx.beginPath();
        labelCtx.arc(x, y, 3, 0, Math.PI * 2);
        labelCtx.fill();
        labelCtx.restore();
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function animate() {
      const dt = clock.getDelta();
      const t = clock.elapsedTime * speed;
      const active = phaseFor(t);
      if (active !== lastPhase) {
        lastPhase = active;
        updateHud(active);
      }

      pacificRing.scale.setScalar(1 + Math.sin(t * 2.8) * .12);
      pacificRing.material.opacity = .42 + Math.sin(t * 3.4) * .16;
      chinaRing.scale.setScalar(1 + Math.sin(t * 3.1) * .1);
      chinaRing.material.opacity = active >= 3 ? .5 + Math.sin(t * 5) * .18 : .08;
      cloudRouteLine.material.opacity = active >= 1 && active <= 3 ? .33 : .12;

      vaporPoints.forEach((p, i) => {
        const u = (Math.sin(t * p.userData.speed + p.userData.seed) + 1) / 2;
        const lat = PACIFIC.lat + Math.sin(p.userData.seed * 2.3) * 3.4;
        const lon = PACIFIC.lon + Math.cos(p.userData.seed * 1.7) * 6.5;
        const base = latLon3D(lat, lon, EARTH_R + 4 + p.userData.height * u);
        const swirl = latLon3D(lat + Math.sin(t + i) * .45, lon + Math.cos(t * 1.2 + i) * .55, EARTH_R + 4 + p.userData.height * u);
        p.position.copy(base.lerp(swirl, .38));
        p.material.opacity = active <= 1 ? .24 + u * .66 : Math.max(.06, .3 - u * .2);
        p.scale.setScalar(.7 + u * 1.1);
      });

      [cloudA, cloudB].forEach((cloud, index) => {
        const routeT = ((t / 11 + index * .18) % 1);
        const shaped = routeT < .1 ? .1 : routeT;
        const routeIndex = Math.floor(shaped * (cloudRoute.length - 1));
        const pos = cloudRoute[routeIndex];
        cloud.position.copy(pos);
        cloud.lookAt(pos.clone().multiplyScalar(2));
        cloud.rotation.z = Math.sin(t * .5 + cloud.userData.seed) * .08;
        cloud.scale.setScalar(.56 + Math.sin(t * 1.3 + index) * .035 + (active === 2 ? .12 : 0));
        cloud.children.forEach((puff, j) => {
          const breathe = Math.sin(t * 1.35 + puff.userData.drift + j * .31) * .07;
          puff.material.opacity = active === 0
            ? puff.userData.baseOpacity * .34
            : Math.min(.94, puff.userData.baseOpacity + breathe + (active === 3 ? .08 : 0));
          puff.position.y += Math.sin(t * .85 + puff.userData.drift) * .003;
        });
      });

      rainDrops.forEach((drop) => {
        const fall = ((t * .8 + drop.userData.phase) % 1);
        const top = latLon3D(drop.userData.lat, drop.userData.lon, EARTH_R + 34 - fall * 22);
        drop.position.copy(top);
        drop.lookAt(latLon3D(drop.userData.lat, drop.userData.lon, EARTH_R - 20));
        drop.material.opacity = active === 3 ? .18 + (1 - fall) * .72 : .0;
        drop.scale.set(1, .8 + fall * .65, 1);
      });

      const riverVisible = active === 4 ? 1 : .18;
      yangtze.material.opacity = .2 + riverVisible * .52 + Math.sin(t * 4) * .04;
      yellow.material.opacity = .16 + riverVisible * .44 + Math.sin(t * 3.6) * .035;
      returnLine.material.opacity = .16 + riverVisible * .46;
      riverDrops.forEach((dot, i) => {
        const localT = (t * .12 + dot.userData.offset) % 1;
        setPointOnPolyline(dot, dot.userData.pts, localT);
        dot.material.opacity = active === 4 ? .86 : .08;
        dot.scale.setScalar(active === 4 ? 1 + Math.sin(t * 7 + i) * .22 : .55);
      });

      chinaDot.scale.setScalar(1 + Math.sin(t * 4.6) * .22);
      pacificDot.scale.setScalar(1 + Math.sin(t * 4.2) * .2);

      controls.update();
      earthGroup.updateMatrixWorld();
      drawLabels();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    document.getElementById('speed').addEventListener('input', (event) => {
      speed = Number(event.target.value);
      document.getElementById('speed-val').textContent = speed.toFixed(1) + '×';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeLabelCanvas();
    });

    updateHud(0);
    animate();
  </script>
<script src="../speak.js"></script>
</body>
</html>
