<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台风路径 · 西北太平洋到华南</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #020713;
      color: #eaf8ff;
      font-family: "STKaiti", "KaiTi", "Songti SC", "Noto Serif SC", serif;
    }
    canvas { display: block; }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 66% 31%, rgba(83, 219, 255, .11), transparent 24%),
        radial-gradient(circle at 82% 60%, rgba(255, 214, 102, .08), transparent 22%),
        radial-gradient(circle at 26% 70%, rgba(32, 211, 238, .07), transparent 27%),
        linear-gradient(90deg, rgba(2, 7, 19, .78), transparent 33%, transparent 71%, rgba(2, 7, 19, .58));
    }

    #title {
      position: absolute;
      top: 22px;
      left: 24px;
      width: 414px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(167, 230, 255, .22);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(6, 19, 39, .84), rgba(3, 49, 70, .48));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08);
      backdrop-filter: blur(16px);
    }
    #title::before {
      content: "";
      position: absolute;
      inset: 10px auto 10px -1px;
      width: 3px;
      border-radius: 99px;
      background: linear-gradient(#aef3ff, #67e8f9, #facc15, #fb7185);
      box-shadow: 0 0 20px rgba(103, 232, 249, .8);
    }
    #title h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: .12em;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 0 28px rgba(103, 232, 249, .32);
    }
    #title h1 span { color: #84f3ff; }
    #title p {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.75;
      color: rgba(219, 246, 255, .78);
    }

    #controls {
      position: absolute;
      right: 24px;
      top: 22px;
      width: 276px;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 22px;
      background: rgba(4, 13, 29, .62);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(16px);
    }
    .control-row {
      display: grid;
      grid-template-columns: 58px 1fr 42px;
      align-items: center;
      gap: 10px;
      color: rgba(224, 245, 255, .78);
      font-size: 12px;
    }
    #speed { width: 100%; accent-color: #67e8f9; }
    #speed-val { color: #bff7ff; font-variant-numeric: tabular-nums; text-align: right; }
    #legend-note {
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      color: rgba(222, 241, 255, .6);
      font-size: 11px;
      line-height: 1.65;
    }

    #caption {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 342px;
      padding: 18px 20px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, .13);
      background: linear-gradient(160deg, rgba(1, 20, 41, .72), rgba(2, 56, 78, .45));
      box-shadow: 0 26px 70px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(16px);
    }
    #caption .tag {
      color: #fef08a;
      font-size: 11px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    #caption h2 {
      margin-top: 7px;
      font-size: 21px;
      letter-spacing: .08em;
      color: #ffffff;
    }
    #caption p {
      margin-top: 9px;
      color: rgba(225, 246, 255, .74);
      font-size: 13px;
      line-height: 1.72;
    }

    #story {
      position: absolute;
      left: 24px;
      bottom: 24px;
      width: min(720px, calc(100vw - 48px));
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .step {
      min-height: 92px;
      padding: 12px 12px 10px;
      border: 1px solid rgba(185, 236, 255, .14);
      border-radius: 17px;
      background: rgba(5, 17, 35, .68);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
      transition: border-color .28s ease, background .28s ease, transform .28s ease;
    }
    .step.active {
      transform: translateY(-7px);
      border-color: rgba(122, 241, 255, .7);
      background: linear-gradient(160deg, rgba(21, 115, 146, .76), rgba(7, 28, 50, .78));
      box-shadow: 0 15px 40px rgba(18, 165, 214, .22), inset 0 1px 0 rgba(255, 255, 255, .16);
    }
    .step .num {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      margin-bottom: 8px;
      border-radius: 50%;
      color: #02121f;
      background: #bff7ff;
      font: 800 12px/1 Georgia, serif;
    }
    .step strong {
      display: block;
      font-size: 14px;
      color: #fff;
      letter-spacing: .08em;
    }
    .step span {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(223, 244, 255, .72);
    }

    #meter {
      position: absolute;
      left: 24px;
      top: 198px;
      width: 262px;
      padding: 14px 15px;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 18px;
      background: rgba(4, 13, 29, .52);
      backdrop-filter: blur(14px);
      pointer-events: none;
    }
    #meter .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: rgba(224, 245, 255, .74);
      font-size: 12px;
    }
    #energy-shell {
      margin-top: 9px;
      height: 10px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .45);
    }
    #energy-bar {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #67e8f9, #fef08a, #fb7185);
      box-shadow: 0 0 18px rgba(103, 232, 249, .48);
      transition: width .2s linear;
    }

    #label-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      #title, #controls, #caption, #meter { width: auto; left: 14px; right: 14px; }
      #title { top: 14px; }
      #meter { top: 178px; }
      #controls, #caption { display: none; }
      #story { left: 14px; right: 14px; bottom: 14px; width: auto; grid-template-columns: 1fr; }
      .step { display: none; }
      .step.active { display: block; }
    }
  </style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
  <canvas id="label-canvas"></canvas>
  <div id="hud"></div>

  <section id="title">
    <h1>台风<span>登陆剧场</span></h1>
    <p>看看台风怎样在海上长大，吹向陆地，再慢慢减弱。这是一条示意路线，真实台风会走不同的路。</p>
  </section>

  <section id="meter" aria-label="台风能量">
    <div class="line"><span>台风能量</span><strong id="energy-value">0%</strong></div>
    <div id="energy-shell"><div id="energy-bar"></div></div>
  </section>

  <section id="controls">
    <div class="control-row">
      <label for="speed">演示速度</label>
      <input type="range" id="speed" min="0.4" max="2.8" step="0.1" value="1" aria-label="播放速度">
      <span id="speed-val">1.0×</span>
    </div>
    <div id="legend-note">拖拽可旋转视角，滚轮缩放。白色螺旋表示云墙，青蓝路径表示引导气流，金红雨带表示登陆前后的强降水。</div>
  </section>

  <section id="caption">
    <div class="tag">Western Pacific Typhoon</div>
    <h2 id="phase-title">太平洋扰动生成</h2>
    <p id="phase-text">暖海水持续蒸发，水汽在低压中心附近汇聚并上升，出现最初的旋转云团。</p>
  </section>

  <section id="story" aria-label="台风过程">
    <div class="step active"><span class="num">1</span><strong>洋面生成</strong><span>西北太平洋暖海水提供水汽与热量。</span></div>
    <div class="step"><span class="num">2</span><strong>增强成台风</strong><span>云墙旋转收紧，风眼逐渐清晰。</span></div>
    <div class="step"><span class="num">3</span><strong>趋向海南</strong><span>外围雨带扫过华南近海。</span></div>
    <div class="step"><span class="num">4</span><strong>台湾福建登陆</strong><span>强降雨与大风进入陆地。</span></div>
    <div class="step"><span class="num">5</span><strong>能量耗尽</strong><span>离开暖洋面，摩擦增强，结构瓦解消失。</span></div>
  </section>

  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three-0.160.0/build/three.module.js",
      "three/addons/": "../vendor/three-0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import { loadProgressiveTexture } from './progressive-texture.js';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020713, 0.00165);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 80000);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.minDistance = 148;
    controls.maxDistance = 640;
    controls.target.set(0, 7, 0);

    const labelCanvas = document.getElementById('label-canvas');
    const labelCtx = labelCanvas.getContext('2d');

    const EARTH_R = 100;
    const SKY_R = EARTH_R + 7;
    const clock = new THREE.Clock();
    let speed = 1;

    const PHASES = [
      { title: '太平洋扰动生成', text: '暖海水持续蒸发，水汽在低压中心附近汇聚并上升，出现最初的旋转云团。' },
      { title: '增强为强台风', text: '潜热释放让低压更深，云墙盘旋收紧，明亮风眼在云顶中央打开。' },
      { title: '吹向海南近海', text: '副热带高压引导台风西北行，外围雨带率先影响海南及南海北部海面。' },
      { title: '台湾福建登陆', text: '台风转向靠近台湾海峡，在台湾与福建沿海登陆，风雨核心进入陆地。' },
      { title: '陆地上消散', text: '登陆后失去暖洋面供能，地形摩擦破坏环流，台风能量快速耗尽并消失。' },
    ];

    const ROUTE = [
      { name: '生成区', lat: 15.4, lon: 151.0 },
      { name: '巴士海峡', lat: 19.6, lon: 126.5 },
      { name: '海南近海', lat: 19.4, lon: 111.8 },
      { name: '台湾', lat: 23.8, lon: 121.0 },
      { name: '福建登陆', lat: 25.9, lon: 119.4 },
      { name: '内陆消散', lat: 27.2, lon: 116.5 },
    ];

    function texture(path, fallback) {
      const t = loadProgressiveTexture(path, fallback);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function latLon3D(lat, lon, r = EARTH_R) {
      const phi = (lon + 180) * Math.PI / 180;
      const latRad = lat * Math.PI / 180;
      return new THREE.Vector3(
        -r * Math.cos(phi) * Math.cos(latRad),
         r * Math.sin(latRad),
         r * Math.sin(phi) * Math.cos(latRad)
      );
    }

    function makeSurfacePath(points, r = SKY_R) {
      const out = [];
      for (let i = 0; i < points.length - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const start = latLon3D(a.lat, a.lon, r);
        const end = latLon3D(b.lat, b.lon, r);
        const mid = start.clone().add(end).normalize().multiplyScalar(r + 11 + i * 2);
        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        const pts = curve.getPoints(46);
        if (i) pts.shift();
        out.push(...pts);
      }
      return out;
    }

    function makeLine(points, color, opacity = 1) {
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      return new THREE.Line(geo, mat);
    }

    function makeGlowPoint(color, size, opacity = 1) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(size, 14, 14),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending })
      );
    }

    function resizeLabelCanvas() {
      labelCanvas.width = Math.floor(window.innerWidth * window.devicePixelRatio);
      labelCanvas.height = Math.floor(window.innerHeight * window.devicePixelRatio);
      labelCanvas.style.width = window.innerWidth + 'px';
      labelCanvas.style.height = window.innerHeight + 'px';
      labelCtx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    resizeLabelCanvas();

    {
      const pos = [], col = [];
      for (let i = 0; i < 2600; i++) {
        const r = 42000;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos.push(r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph));
        const b = Math.pow(Math.random(), 2.1) * .75 + .2;
        col.push(b * .72, b * .92, b + .1);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ vertexColors: true, size: 1.7, sizeAttenuation: false })));
    }

    scene.add(new THREE.AmbientLight(0x89cfff, .42));
    const sunLight = new THREE.DirectionalLight(0xfff4de, 2.65);
    sunLight.position.set(210, 84, 42).normalize();
    scene.add(sunLight);
    const rimLight = new THREE.DirectionalLight(0x56ccff, 1.45);
    rimLight.position.set(-1, .35, 1);
    scene.add(rimLight);

    const earthGroup = new THREE.Group();
    earthGroup.rotation.x = -8 * Math.PI / 180;
    earthGroup.rotation.y = -120 * Math.PI / 180;
    scene.add(earthGroup);

    // 将中国中部的经纬度转换到旋转后的地球坐标，作为默认观察方向。
    earthGroup.updateMatrixWorld(true);
    const chinaViewDirection = earthGroup.localToWorld(latLon3D(35, 105, 1)).normalize();
    camera.position.copy(controls.target).addScaledVector(chinaViewDirection, 220);
    controls.update();
    controls.enablePan = false;
    const followDirection = chinaViewDirection.clone();
    const followRotation = new THREE.Quaternion();
    const followOffset = new THREE.Vector3();
    const stormWorld = new THREE.Vector3();

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_R, 96, 96),
      new THREE.MeshStandardMaterial({
        map: texture('textures/2k_earth_daymap.webp', '#0b4f7a'),
        roughness: .92,
        metalness: 0,
      })
    );
    earthGroup.add(earth);

    const oceanVeil = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_R * 1.006, 96, 96),
      new THREE.MeshBasicMaterial({ color: 0x0b8ac2, transparent: true, opacity: .075, blending: THREE.AdditiveBlending })
    );
    earthGroup.add(oceanVeil);

    const atmo = new THREE.Mesh(
      new THREE.SphereGeometry(EARTH_R * 1.047, 64, 64),
      new THREE.MeshBasicMaterial({ color: 0x65d8ff, transparent: true, opacity: .12, side: THREE.BackSide, blending: THREE.AdditiveBlending })
    );
    earthGroup.add(atmo);

    const routePoints = makeSurfacePath(ROUTE, EARTH_R + 6.4);
    const routeLine = makeLine(routePoints, 0x9befff, .35);
    earthGroup.add(routeLine);

    const routeGlow = makeLine(routePoints, 0x21d6ff, .12);
    routeGlow.scale.setScalar(1.006);
    earthGroup.add(routeGlow);

    const labels = [
      { text: '西北太平洋生成', color: '#89f7ff', pos: latLon3D(15.4, 151.0, EARTH_R + 11) },
      { text: '海南', color: '#fef08a', pos: latLon3D(19.2, 109.7, EARTH_R + 10) },
      { text: '台湾', color: '#fbbf24', pos: latLon3D(23.8, 121.0, EARTH_R + 10) },
      { text: '福建登陆', color: '#fb7185', pos: latLon3D(25.9, 119.4, EARTH_R + 11) },
      { text: '内陆消散', color: '#d8f3ff', pos: latLon3D(27.2, 116.5, EARTH_R + 11) },
    ];

    const markerGroup = new THREE.Group();
    earthGroup.add(markerGroup);
    ROUTE.forEach((p, i) => {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(i === 0 ? 5 : 4, i === 0 ? 11 : 9, 72),
        new THREE.MeshBasicMaterial({ color: i >= 3 ? 0xffb36e : 0x71f3ff, transparent: true, opacity: .34, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
      );
      ring.position.copy(latLon3D(p.lat, p.lon, EARTH_R + 4.2));
      ring.lookAt(ring.position.clone().multiplyScalar(2));
      ring.userData = { seed: i * .73 };
      markerGroup.add(ring);
    });

    function makeTyphoon() {
      const group = new THREE.Group();
      const armMat = new THREE.MeshBasicMaterial({ color: 0xf4fbff, transparent: true, opacity: .84, depthWrite: false, blending: THREE.AdditiveBlending });
      const outerMat = new THREE.MeshBasicMaterial({ color: 0xa8ecff, transparent: true, opacity: .33, depthWrite: false, blending: THREE.AdditiveBlending });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x061f37, transparent: true, opacity: .82, depthWrite: false });
      const rainMat = new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: .45 });

      for (let arm = 0; arm < 4; arm++) {
        const pts = [];
        for (let i = 0; i < 94; i++) {
          const u = i / 93;
          const angle = arm * Math.PI / 2 + u * Math.PI * 2.45;
          const r = 4 + u * 34;
          pts.push(new THREE.Vector3(Math.cos(angle) * r, Math.sin(angle) * r, 1.8 + u * 1.5));
        }
        const curve = new THREE.CatmullRomCurve3(pts);
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 1.12 - arm * .08, 8, false), armMat.clone());
        tube.userData = { arm, baseOpacity: .72 - arm * .04 };
        group.add(tube);
      }

      for (let i = 0; i < 3; i++) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(14 + i * 10, 16 + i * 10, 128),
          outerMat.clone()
        );
        ring.userData = { seed: i * 1.3, baseOpacity: .22 - i * .035 };
        group.add(ring);
      }

      const eye = new THREE.Mesh(new THREE.CircleGeometry(2.8, 64), eyeMat);
      eye.position.z = 4.2;
      group.add(eye);

      const wall = new THREE.Mesh(
        new THREE.TorusGeometry(3.6, .6, 12, 80),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .74, depthWrite: false, blending: THREE.AdditiveBlending })
      );
      wall.position.z = 4.4;
      group.add(wall);

      const rainBands = [];
      for (let i = 0; i < 72; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 14 + Math.random() * 38;
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0),
          new THREE.Vector3(Math.cos(a) * (r + 2.5), Math.sin(a) * (r + 2.5), -10 - Math.random() * 10)
        ]);
        const line = new THREE.Line(lineGeo, rainMat.clone());
        line.userData = { seed: Math.random(), radius: r };
        group.add(line);
        rainBands.push(line);
      }

      group.userData = { rainBands };
      return group;
    }

    const typhoon = makeTyphoon();
    earthGroup.add(typhoon);

    const debrisPoints = [];
    for (let i = 0; i < 70; i++) {
      const p = makeGlowPoint(i % 3 ? 0xeefbff : 0xffe3a3, .55 + Math.random() * .55, 0);
      p.userData = { seed: Math.random() * Math.PI * 2, drift: .5 + Math.random() * 1.6 };
      earthGroup.add(p);
      debrisPoints.push(p);
    }

    const windDots = [];
    for (let i = 0; i < 28; i++) {
      const dot = makeGlowPoint(i % 4 ? 0x75f4ff : 0xfef08a, 1.0, .75);
      dot.userData = { offset: i / 28 };
      earthGroup.add(dot);
      windDots.push(dot);
    }

    function pointOnRoute(t) {
      const n = routePoints.length - 1;
      const scaled = Math.min(n - .001, Math.max(0, t * n));
      const i = Math.floor(scaled);
      const f = scaled - i;
      return routePoints[i].clone().lerp(routePoints[i + 1], f);
    }

    function easeInOut(x) {
      return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    }

    function typhoonState(t) {
      const cycle = 27;
      const u = (t % cycle) / cycle;
      let travel;
      if (u < .14) travel = 0;
      else if (u < .74) travel = easeInOut((u - .14) / .60) * .86;
      else travel = .86 + easeInOut((u - .74) / .26) * .14;

      let energy;
      if (u < .18) energy = u / .18 * .42;
      else if (u < .40) energy = .42 + (u - .18) / .22 * .58;
      else if (u < .72) energy = .96 - (u - .40) / .32 * .16;
      else energy = Math.max(0, .80 - (u - .72) / .28 * .92);

      const phase = Math.min(PHASES.length - 1, Math.floor(u * PHASES.length));
      return { u, travel, energy, phase };
    }

    function updateHud(active, energy) {
      document.querySelectorAll('.step').forEach((el, i) => el.classList.toggle('active', i === active));
      document.getElementById('phase-title').textContent = PHASES[active].title;
      document.getElementById('phase-text').textContent = PHASES[active].text;
      document.getElementById('energy-bar').style.width = Math.round(energy * 100) + '%';
      document.getElementById('energy-value').textContent = Math.round(energy * 100) + '%';
    }

    function orientStorm(group, pos, spin = 0) {
      const normal = pos.clone().normalize();
      const tangent = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
      if (tangent.lengthSq() < .01) tangent.set(1, 0, 0);
      const bitangent = normal.clone().cross(tangent).normalize();
      const matrix = new THREE.Matrix4().makeBasis(tangent, bitangent, normal);
      group.quaternion.setFromRotationMatrix(matrix);
      group.rotateZ(spin);
    }

    let lastPhase = -1;
    function drawLabels() {
      labelCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      labelCtx.font = '600 13px STKaiti, KaiTi, serif';
      labelCtx.textBaseline = 'middle';
      labels.forEach((label) => {
        const world = label.pos.clone().applyMatrix4(earthGroup.matrixWorld);
        const cameraDir = camera.position.clone().sub(world).normalize();
        const normal = world.clone().normalize();
        if (normal.dot(cameraDir) < -.08) return;
        const projected = world.clone().project(camera);
        const x = (projected.x * .5 + .5) * window.innerWidth;
        const y = (-projected.y * .5 + .5) * window.innerHeight;
        labelCtx.save();
        labelCtx.fillStyle = 'rgba(2, 9, 22, .66)';
        labelCtx.strokeStyle = 'rgba(190, 241, 255, .28)';
        labelCtx.lineWidth = 1;
        const w = labelCtx.measureText(label.text).width + 22;
        const h = 27;
        roundRect(labelCtx, x + 13, y - h / 2, w, h, 13);
        labelCtx.fill();
        labelCtx.stroke();
        labelCtx.fillStyle = label.color;
        labelCtx.fillText(label.text, x + 24, y + 1);
        labelCtx.beginPath();
        labelCtx.arc(x, y, 3, 0, Math.PI * 2);
        labelCtx.fill();
        labelCtx.restore();
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    let animationFrame;
    function animate() {
      if (document.hidden) return;
      const dt = clock.getDelta();
      const t = clock.elapsedTime * speed;
      const state = typhoonState(t);
      if (state.phase !== lastPhase) lastPhase = state.phase;
      updateHud(state.phase, state.energy);

      routeLine.material.opacity = .22 + Math.sin(t * 1.8) * .07;
      routeGlow.material.opacity = .08 + Math.sin(t * 2.3) * .04;

      markerGroup.children.forEach((ring, i) => {
        const pulse = 1 + Math.sin(t * 2.8 + ring.userData.seed) * .12;
        ring.scale.setScalar(pulse);
        ring.material.opacity = (i / (ROUTE.length - 1) <= state.travel + .08) ? .42 : .16;
      });

      windDots.forEach((dot, i) => {
        const localT = (state.travel + dot.userData.offset * .22 + t * .025) % 1;
        dot.position.copy(pointOnRoute(localT));
        dot.material.opacity = .18 + state.energy * .55;
        dot.scale.setScalar(.7 + Math.sin(t * 7 + i) * .18 + state.energy * .35);
      });

      const stormPos = pointOnRoute(state.travel).normalize().multiplyScalar(EARTH_R + 2.5);
      typhoon.position.copy(stormPos);
      orientStorm(typhoon, stormPos, -t * (1.4 + state.energy * 3.2));
      typhoon.scale.setScalar(.05 + state.energy * .17);
      typhoon.visible = state.energy > .025;

      typhoon.children.forEach((child, i) => {
        if (child.material) {
          if (child.type === 'Line') child.material.opacity = state.energy * (.18 + Math.sin(t * 8 + i) * .05 + .35);
          else if (child.geometry.type === 'CircleGeometry') child.material.opacity = .30 + state.energy * .55;
          else child.material.opacity = Math.min(.92, state.energy * (child.userData.baseOpacity || .72));
        }
        if (child.geometry && child.geometry.type === 'RingGeometry') {
          child.rotation.z -= dt * (1.2 + i * .18);
          child.scale.setScalar(1 + Math.sin(t * 2.6 + child.userData.seed) * .05);
        }
      });

      debrisPoints.forEach((p, i) => {
        const spread = Math.max(0, (state.u - .70) / .30);
        const angle = p.userData.seed + t * (.4 + p.userData.drift * .1);
        const radius = 1.5 + spread * (5 + i % 9 * .6);
        const normal = stormPos.clone().normalize();
        const tangent = new THREE.Vector3(0, 1, 0).cross(normal).normalize();
        const bitangent = normal.clone().cross(tangent).normalize();
        const pos = stormPos.clone()
          .add(tangent.multiplyScalar(Math.cos(angle) * radius))
          .add(bitangent.multiplyScalar(Math.sin(angle) * radius))
          .add(normal.multiplyScalar(spread * (1 + (i % 5) * .2)));
        p.position.copy(pos);
        p.material.opacity = spread * (1 - state.energy) * (.25 + Math.random() * .08);
        p.scale.setScalar(.1 + spread * .26);
      });

      earthGroup.updateMatrixWorld();
      // 跟随台风路径平滑转向；保留用户旋转和缩放后的观察偏移。
      stormWorld.copy(stormPos).applyMatrix4(earthGroup.matrixWorld);
      const nextDirection = followDirection.clone().lerp(
        stormWorld.clone().normalize(), 1 - Math.exp(-dt * 3)
      ).normalize();
      followRotation.setFromUnitVectors(followDirection, nextDirection);
      followOffset.copy(camera.position).sub(controls.target).applyQuaternion(followRotation);
      controls.target.lerp(stormWorld, 1 - Math.exp(-dt * 3));
      camera.position.copy(controls.target).add(followOffset);
      followDirection.copy(nextDirection);
      controls.update();
      drawLabels();
      renderer.render(scene, camera);
      animationFrame = requestAnimationFrame(animate);
    }

    document.getElementById('speed').addEventListener('input', (event) => {
      speed = Number(event.target.value);
      document.getElementById('speed-val').textContent = speed.toFixed(1) + '×';
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeLabelCanvas();
    });

    updateHud(0, 0);
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(animationFrame);
      if (document.hidden) { clock.stop(); return; }
      const elapsed = clock.elapsedTime;
      clock.start(); clock.elapsedTime = elapsed;
      animate();
    });
    animate();
  </script>
<script src="../speak.js"></script>
</body>
</html>
