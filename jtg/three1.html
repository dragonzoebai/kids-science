<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>小堆场 3857 - Three.js</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #1e1e1e; }
  #info {
    position: absolute; top: 10px; left: 10px; color: #ddd;
    font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,0.4);
    padding: 6px 10px; border-radius: 4px; pointer-events: none;
  }
  #error {
    position: absolute; top: 10px; left: 10px; color: #fff; background: #a33;
    font-family: sans-serif; font-size: 14px; padding: 10px 14px; border-radius: 4px;
    display: none; max-width: 480px;
  }
</style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
<div id="info">duiwei3857.geojson + 轮廓3857 + 房子3857 &nbsp;|&nbsp; 堆场：黄色边线 / 灰色填充 &nbsp;|&nbsp; 轮廓：浅灰色填充面 &nbsp;|&nbsp; 房子按 high 属性挤出 &nbsp;|&nbsp; 鼠标拖拽旋转，滚轮缩放</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-0.160.0/build/three.module.js",
    "three/addons/": "../vendor/three-0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { Line2 } from 'three/addons/lines/Line2.js';

const scene = new THREE.Scene();

// near 用 1 而非 0.1：near 越小远距离深度精度越差（z-fighting 根源之一）
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 100000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.5;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// ---- 天空 ----
const sky = new Sky();
sky.scale.setScalar(20000);
scene.add(sky);

const sun = new THREE.Vector3();
const skyUniforms = sky.material.uniforms;
skyUniforms['turbidity'].value = 8;
skyUniforms['rayleigh'].value = 2;
skyUniforms['mieCoefficient'].value = 0.005;
skyUniforms['mieDirectionalG'].value = 0.8;

const elevation = 8; // 太阳高度角
const azimuth = 180; // 太阳方位角
const phi = THREE.MathUtils.degToRad(90 - elevation);
const theta = THREE.MathUtils.degToRad(azimuth);
sun.setFromSphericalCoords(1, phi, theta);
skyUniforms['sunPosition'].value.copy(sun);

// ---- 水面 ----
const waterGeometry = new THREE.PlaneGeometry(20000, 20000);
const water = new Water(waterGeometry, {
  textureWidth: 512,
  textureHeight: 512,
  waterNormals: new THREE.TextureLoader().load(
    '../vendor/three-0.160.0/examples/textures/waternormals.jpg',
    texture => { texture.wrapS = texture.wrapT = THREE.RepeatWrapping; }
  ),
  sunDirection: sun.clone(),
  sunColor: 0xffffff,
  waterColor: 0x0a3d5c,
  distortionScale: 3.7,
  fog: scene.fog !== undefined,
});
water.rotation.x = -Math.PI / 2;
water.position.y = -1;
scene.add(water);

// 各数据集的边线材质收集（Line2/LineMaterial 才能显示线宽），resize 时统一更新 resolution
const lineMaterials = [];

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  lineMaterials.forEach(m => m.resolution.set(window.innerWidth, window.innerHeight));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  water.material.uniforms['time'].value += 1.0 / 60.0;
  renderer.render(scene, camera);
}
animate();

function showError(msg) {
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.innerHTML = msg;
}

// ---- 加载 GeoJSON 并绘制 ----
function loadGeoJSON(path) {
  return fetch(path).then(res => {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}

Promise.all([
  loadGeoJSON('./duiwei3857.geojson'),
  loadGeoJSON('./lunkuo3857.geojson'),
  loadGeoJSON('./房子.geojson'),
])
  .then(([smallYard, contour, house]) => {
    buildScene([
      {
        geojson: smallYard,
        fillColor: 0xcccccc,
        fillOpacity: 1,
        lineColor: 0xffff00,
        lineWidth: 3,
        showLabels: true,
        zOffset: 0.2,
        // 相邻格位共面共享边会闪：每个格位交替深度偏移
        polygonOffsetVariation: true,
      },
      {
        geojson: contour,
        fillColor: 0x808080,
        fillOpacity: 1,
        drawLine: false,
        showLabels: false,
        zOffset: 0.05,
        // 始终垫在堆位面下面（偏移量远大于堆位的 1~4）
        polygonOffsetFactor: 2,
        polygonOffsetUnits: 8,
      },
    ], house);
  })
  .catch(err => {
    showError(
      '加载 GeoJSON 失败: ' + err.message +
      '<br>请通过本地 HTTP 服务器打开本页面（例如 VSCode Live Server），' +
      '直接以 file:// 方式打开会因浏览器安全限制导致 fetch 失败。'
    );
    console.error(err);
  });

function buildScene(datasets, houseGeojson) {
  const houseFeatures = (houseGeojson && houseGeojson.features) || [];

  // 计算所有数据整体包围盒中心，用于把巨大的 EPSG:3857 坐标平移到原点附近
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  [...datasets.map(d => d.geojson), houseGeojson].forEach(g => {
    (g && g.features || []).forEach(f => {
      forEachRing(f.geometry, ring => {
        ring.forEach(([x, y]) => {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        });
      });
    });
  });
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const size = Math.max(maxX - minX, maxY - minY) || 1;

  const group = new THREE.Group();

  datasets.forEach(d => {
    const features = d.geojson.features || [];

    // 每个数据集使用独立的面/线材质。
    // polygonOffset 用于解决共面/近距离 z-fighting：不同面片用不同的深度偏移，
    // 从深度缓冲层面强制分层（不改变几何位置），彻底消除闪烁。
    function makeFillMaterial(units) {
      return new THREE.MeshBasicMaterial({
        color: d.fillColor,
        side: THREE.DoubleSide,
        transparent: d.fillOpacity < 1,
        opacity: d.fillOpacity,
        polygonOffset: true,
        polygonOffsetFactor: d.polygonOffsetFactor ?? 1,
        polygonOffsetUnits: units ?? d.polygonOffsetUnits ?? 1,
      });
    }
    const sharedFill = makeFillMaterial();
    let lineMat = null;
    if (d.drawLine !== false) {
      lineMat = new LineMaterial({
        color: d.lineColor,
        linewidth: d.lineWidth,
      });
      lineMat.resolution.set(window.innerWidth, window.innerHeight);
      lineMaterials.push(lineMat);
    }

    // 只有需要标签的数据集才收集相邻格位信息，用于判断标签显示在哪一侧
    const featureInfos = [];
    if (d.showLabels) {
      features.forEach(feature => {
        const polygons = getPolygons(feature.geometry);
        polygons.forEach(rings => {
          if (!rings.length) return;
          const info = ringCenterAndAngle(rings[0], cx, cy);
          featureInfos.push({ feature, info });
        });
      });
    }

    // 判断格位某一侧（-1 西 / +1 东）是否紧邻另一个格位
    function hasCloseNeighbor(info, side) {
      const perpX = Math.sin(info.angle);
      const perpZ = -Math.cos(info.angle);
      const sideX = info.cx + perpX * info.ewWidth * 0.6 * side;
      const sideZ = info.cz + perpZ * info.ewWidth * 0.6 * side;
      for (const other of featureInfos) {
        if (other.info === info) continue;
        const dx = other.info.cx - sideX;
        const dz = other.info.cz - sideZ;
        // 南北向距离必须在半个格位高度内（同一排）
        const alongX = Math.cos(info.angle);
        const alongZ = Math.sin(info.angle); // 南北向在 (x,z) 平面中的方向
        const alongDist = Math.abs(dx * alongX + dz * alongZ);
        if (alongDist > info.nsHeight * 0.5) continue;
        // 东西向距离小于本格位宽度的 60% 视为紧邻
        const perpDist = Math.abs(dx * perpX + dz * perpZ);
        if (perpDist < info.ewWidth * 0.6) return true;
      }
      return false;
    }

    features.forEach((feature, featureIndex) => {
      const name = feature.properties?.name || '';
      const polygons = getPolygons(feature.geometry);

      // 面 + 边线（每个环都画，含洞）—— 边线用 Line2 实现真正的粗线
      polygons.forEach(rings => {
        if (!rings.length) return;
        const outer = ringToPoints(rings[0], cx, cy);
        const shape = new THREE.Shape(outer);
        for (let i = 1; i < rings.length; i++) {
          shape.holes.push(new THREE.Path(ringToPoints(rings[i], cx, cy)));
        }
        const geometry = new THREE.ShapeGeometry(shape);
        // 相邻格位共面共享边是 z-fighting 重灾区：按格位序号交替给不同深度偏移
        const mat = d.polygonOffsetVariation
          ? makeFillMaterial(1 + (featureIndex % 4))
          : sharedFill;
        const mesh = new THREE.Mesh(geometry, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.y = d.zOffset || 0;
        group.add(mesh);

        if (lineMat) {
          const lineY = (d.zOffset || 0) + 0.05;
          rings.forEach(ring => {
            const pts = ringToPoints(ring, cx, cy).map(p => new THREE.Vector3(p.x, lineY, -p.y));
            pts.push(pts[0].clone()); // Line2 没有 LineLoop，手动闭合首尾
            const positions = [];
            pts.forEach(p => positions.push(p.x, p.y, p.z));
            const lineGeom = new LineGeometry();
            lineGeom.setPositions(positions);
            const line = new Line2(lineGeom, lineMat);
            line.computeLineDistances();
            group.add(line);
          });
        }
      });

      // 名称标签（贴地文字）
      //   Z 排（名称以 Z 开头）：文字放堆位北侧边线外
      //   Y 排（名称以 Y 开头）：文字放堆位南侧边线外
      //   其余堆位：放在格位东西两侧，紧邻格位的内侧不显示
      if (d.showLabels && name) {
        const entry = featureInfos.find(ii => ii.feature === feature);
        if (!entry) return;
        const { cx: fx, cz: fz, angle: fAngle, nsHeight, ewWidth } = entry.info;
        const labelHeight = Math.max(3, nsHeight * 0.1);
        const perpX = Math.sin(fAngle);
        const perpZ = -Math.cos(fAngle);
        const firstChar = name.trim().charAt(0).toUpperCase();

        const placeLabel = (px, pz, rotY) => {
          const plane = makeLabelPlane(name);
          const aspect = plane.userData.aspect;
          plane.scale.set(labelHeight * aspect, labelHeight, 1);

          const holder = new THREE.Group();
          holder.add(plane);
          holder.rotation.y = rotY;
          holder.position.set(px, (d.zOffset || 0) + 0.06, pz); // 略高于黄色边线，避免 z-fighting
          group.add(holder);
        };

        if (firstChar === 'Z' || firstChar === 'Y') {
          // 沿格位南北向长轴偏移到北/南边线外，文字横排（沿东西向）
          const alongX = Math.cos(fAngle);
          const alongZ = Math.sin(fAngle);
          // (alongX, alongZ) * northSign 指向 -z（正北）
          const northSign = alongZ < 0 ? 1 : -1;
          const dir = firstChar === 'Z' ? northSign : -northSign;
          const nsOffset = nsHeight / 2 + nsHeight * 0.08;
          // 归一化长轴朝向（消除多边形绕向带来的 ±π 歧义），再据此定文字旋转。
          // Z/Y 排文字取同一朝向，从默认视角看都是正向横排。
          const northAngle = northSign === 1 ? fAngle : fAngle + Math.PI;
          const rotY = northAngle + Math.PI / 2;
          placeLabel(fx + alongX * nsOffset * dir, fz + alongZ * nsOffset * dir, rotY);
        } else {
          const offset = ewWidth / 2 + ewWidth * 0.08;
          const sides = [];
          if (!hasCloseNeighbor(entry.info, -1)) sides.push(-1); // 西侧没邻居才显示
          if (!hasCloseNeighbor(entry.info, 1))  sides.push(1);  // 东侧没邻居才显示

          for (const side of sides) {
            // 沿格位长边方向朝向；文字"上方"朝向格位内侧（对面朝向过道的人），
            // 这样西侧文字供东侧过道的人读、东侧文字供西侧过道的人读时都是正向的。
            // 东西两侧互为 180° 镜像。
            const rotY = side === 1 ? Math.PI - fAngle : -fAngle;
            placeLabel(fx + perpX * offset * side, fz + perpZ * offset * side, rotY);
          }
        }
      }
    });
  });

  // 房子：按 properties.high 挤出成体块，浅蓝顶部边线 + 名称标签
  addHouses(houseFeatures, cx, cy, group);

  scene.add(group);

  // 辅助轴
  const axesHelper = new THREE.AxesHelper(size * 0.6);
  scene.add(axesHelper);

  // 相机根据数据范围自适应
  camera.position.set(0, size * 0.8, size * 0.8);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.update();
}

// 房子：每个 feature 按自己的 properties.high（米，缺失则用默认值）挤出成体块。
// ExtrudeGeometry 默认沿本地 Z 方向挤出，挤出体做和其它面片一样的 rotation.x=-90°
// 后，本地 Z 会变成世界 +Y（朝上），效果就是墙体立在地面上、高度=high。
const HOUSE_DEFAULT_HEIGHT_M = 3;
function addHouses(features, cx, cy, group) {
  // ExtrudeGeometry 的材质组顺序是 [0]=顶/底盖、[1]=侧墙（和直觉相反，源码 buildLidFaces
  // addGroup(...,0)、buildSideFaces addGroup(...,1)），数组顺序不能写反，否则墙顶颜色互换
  const houseMaterials = [
    new THREE.MeshBasicMaterial({ color: 0xc5c8cc, side: THREE.DoubleSide }), // 浅灰顶
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }), // 纯白墙
  ];

  features.forEach(feature => {
    const name = feature.properties?.name || '';
    const high = Number(feature.properties?.high) || HOUSE_DEFAULT_HEIGHT_M;

    getPolygons(feature.geometry).forEach(rings => {
      if (!rings.length) return;
      const outer = ringToPoints(rings[0], cx, cy);
      const shape = new THREE.Shape(outer);
      for (let i = 1; i < rings.length; i++) {
        shape.holes.push(new THREE.Path(ringToPoints(rings[i], cx, cy)));
      }

      const geometry = new THREE.ExtrudeGeometry(shape, { depth: high, bevelEnabled: false });
      const mesh = new THREE.Mesh(geometry, houseMaterials);
      mesh.rotation.x = -Math.PI / 2;
      group.add(mesh);

      if (name) {
        const c = centroid2D(outer);
        const sprite = makeLabelSprite(name);
        const labelHeight = Math.max(2, high * 0.4);
        sprite.scale.set(labelHeight * sprite.userData.aspect, labelHeight, 1);
        sprite.position.set(c.x, high + labelHeight / 2, -c.y);
        group.add(sprite);
      }
    });
  });
}

function centroid2D(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p.x; y += p.y; }
  return { x: x / pts.length, y: y / pts.length };
}

// 用 Canvas 生成文字纹理做成 Sprite（始终朝向相机的广告牌），供挂在房子顶部的名称标签使用
function makeLabelSprite(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontPx = 256;
  const padding = 20;
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + padding * 2;
  const h = fontPx + padding * 2;
  canvas.width = w;
  canvas.height = h;
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffff00';
  ctx.fillText(text, w / 2, h / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.userData.aspect = w / h;
  return sprite;
}

function getPolygons(geometry) {
  if (!geometry) return [];
  if (geometry.type === 'MultiPolygon') return geometry.coordinates;
  if (geometry.type === 'Polygon') return [geometry.coordinates];
  return [];
}

function forEachRing(geometry, cb) {
  getPolygons(geometry).forEach(rings => rings.forEach(cb));
}

function ringToPoints(ring, cx, cy) {
  return ring.map(([x, y]) => new THREE.Vector2(x - cx, y - cy));
}

// 计算多边形外环的包围盒中心、长边方向角（弧度，绕 y 轴）和长边长度
// 世界坐标：x 对应地理 x，z = -地理 y
function ringCenterAndAngle(ring, cx, cy) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of ring) {
    const dx = x - cx, dy = y - cy;
    if (dx < minX) minX = dx;
    if (dx > maxX) maxX = dx;
    if (dy < minY) minY = dy;
    if (dy > maxY) maxY = dy;
  }
  const dx = maxX - minX;
  const dy = maxY - minY;
  const fx = (minX + maxX) / 2;
  const fz = -(minY + maxY) / 2; // z = -y
  const longer = Math.max(dx, dy);
  const shorter = Math.min(dx, dy);

  // 找最接近南北向的边（|ey| 最大），标签始终放在格位的东西两侧
  //   边方向即为格位的"长边/南北向"方向
  let bestAbsDy = 0, bestAngle = 0;
  for (let i = 0; i < ring.length - 1; i++) {
    const [x1, y1] = ring[i];
    const [x2, y2] = ring[i + 1];
    const ex = x2 - x1, ey = y2 - y1;
    if (Math.abs(ey) > bestAbsDy) {
      bestAbsDy = Math.abs(ey);
      // 边方向 (ex, ey) 在 z=-y 平面上映射到 (x, -z)
      bestAngle = Math.atan2(-ey, ex);
    }
  }
  return {
    cx: fx, cz: fz,
    angle: bestAngle,
    length: longer,
    shorter,
    ewWidth: dx,     // 东西向宽度（x 方向包围盒长度）
    nsHeight: dy,    // 南北向高度（y 方向包围盒长度）
  };
}

// 用 Canvas 生成文字纹理，贴在一个水平面片上（贴地文字，非广告牌）
function makeLabelPlane(text) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const fontPx = 256;
  const padding = 20;
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width) + padding * 2;
  const h = fontPx + padding * 2;
  canvas.width = w;
  canvas.height = h;

  // 再设一次，改变 canvas 尺寸会重置上下文
  ctx.font = `bold ${fontPx}px "Microsoft YaHei", "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 纯黄色文字
  ctx.fillStyle = '#ffff00';
  ctx.fillText(text, w / 2, h / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  const material = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  // 单位正方形面片，缩放在旋转前的本地坐标系中生效，
  // 因此可以先设缩放再旋转躺平，效果等同于按画布比例缩放后贴地
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
  plane.rotation.x = -Math.PI / 2; // 躺平贴地，法线朝上
  plane.userData.aspect = w / h;
  return plane;
}
</script>
</body>
</html>
