<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科学游乐园</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1f2328; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e6e8eb; --muted: #9aa1ab;
      --border: #2a2f37; --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 28px; }
  .group { margin-top: 20px; }
  .group summary {
    display: flex; align-items: center; gap: 10px; min-height: 44px;
    cursor: pointer; list-style: none; touch-action: manipulation; border-radius: 6px;
  }
  .group summary::-webkit-details-marker { display: none; }
  .group summary::before {
    content: ''; width: 8px; height: 8px; flex-shrink: 0;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg); transition: transform .3s cubic-bezier(.22, 1, .36, 1);
  }
  .group.is-expanded > summary::before { transform: rotate(45deg); }
  .group summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .group-content { overflow: hidden; }
  .group-content > .grid { padding-top: 8px; }
  @media (prefers-reduced-motion: reduce) {
    .group summary::before { transition: none; }
  }
  h2 { font-size: 17px; margin: 0; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h2 small { color: var(--muted); font-weight: normal; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  a.card {
    display: block; padding: 14px 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .title { font-weight: 600; }
  .path { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; margin-top: 4px; }
  main { max-width: 1100px; padding-top: 24px; }
  h1 { color: var(--text); font-size: 30px; }
  .grid { grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 14px; }
  a.card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 152px; border-radius: 24px; background: var(--card); text-align: center; box-shadow: 0 4px 12px #153b2810; }
  .picture { display: block; font-size: 62px; line-height: 1.2; }
  .title { font-size: 19px; }
  a.card:nth-child(4n+1) { border-color: #83cbb2; }
  a.card:nth-child(4n+2) { border-color: #edbd70; }
  a.card:nth-child(4n+3) { border-color: #8bbde2; }
  a.card:active { transform: scale(.97); }
  a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  @media(max-width: 380px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .title { font-size: 17px; } }
  @media(prefers-reduced-motion: reduce) { a.card { transition: none; } }
</style>
<link rel="stylesheet" href="touch.css">
<script src="touch.js"></script>
</head>
<body>
<main>
  <h1>科学游乐园</h1>
  <div class="sub" id="count"></div>
  <div id="list"></div>
</main>
<script>
  const groups = [
    { dir: 'math', name: '数学', pages: [
      { href: 'math/arithmetic.html', title: '苹果加减法', icon: '🍎' },
    ]},
    { dir: 'earth', name: '地球与地图', pages: [
      { href: 'earth/beijing-subway.html', title: '北京地铁', icon: '🚇' },
      { href: 'earth/china.html', title: '认识中国', icon: '🌏' },
      { href: 'earth/rooster-map.html', title: '雄鸡地图', icon: '🐓' },
      { href: 'earth/rooster-map-mapbox.html', title: '唱儿歌看中国', icon: '🌍' },
      { href: 'earth/city-china.html', title: '中国城市', icon: '🏙️' },
      { href: 'earth/city.html', title: '世界城市', icon: '🌃' },
      { href: 'earth/earthquake.html', title: '看看地震', icon: '🌋' },
      { href: 'earth/hsr.html', title: '坐高铁', icon: '🚄' },
      { href: 'earth/highway.html', title: '走高速', icon: '🚗' },
      { href: 'earth/longitude.html', title: '经线和纬线', icon: '🌐' },
      { href: 'earth/subway.html', title: '找地铁', icon: '🚉' },
      { href: 'earth/timezone.html', title: '世界的时间', icon: '🕒' },
    ]},
    { dir: 'threejs', name: '天文与气象', pages: [
      { href: 'threejs/ar-earth.html', title: '转动看地球', icon: '🌎' },
      { href: 'threejs/hours.html', title: '白天和黑夜', icon: '☀️' },
      { href: 'threejs/moon.html', title: '看月亮', icon: '🌙' },
      { href: 'threejs/season.html', title: '春夏秋冬', icon: '🍂' },
      { href: 'threejs/solar.html', title: '太阳系', icon: '🪐' },
      { href: 'threejs/typhoon.html', title: '看台风', icon: '🌀' },
      { href: 'threejs/watercycle.html', title: '小水滴旅行', icon: '🌧️' },
    ]},
    { dir: 'biology', name: '生物', pages: [
      { href: 'biology/digestion.html', title: '食物去哪儿', icon: '🍎' },
      { href: 'biology/food-chain.html', title: '谁的午饭', icon: '🐰' },
      { href: 'biology/plant.html', title: '种小花', icon: '🌻' },
    ]},
    { dir: 'physics', name: '物理', pages: [
      { href: 'physics/color-mixing.html', title: '调颜色', icon: '🎨' },
      { href: 'physics/light-mixing.html', title: '玩彩色光', icon: '🔦' },
      { href: 'physics/rainbow.html', title: '找彩虹', icon: '🌈' },
      { href: 'physics/sound.html', title: '听声音', icon: '🥁' },
    ]},
  ];

  const list = document.getElementById('list');
  for (const g of groups) {
    const group = document.createElement('details');
    group.className = 'group';
    group.open = true;
    group.classList.toggle('is-expanded', group.open);
    const summary = document.createElement('summary');
    const h = document.createElement('h2');
    h.textContent = g.name;
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const {href, title, icon} of g.pages) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = href;
      a.setAttribute('data-speak', title);
      const picture = document.createElement('span'); picture.className = 'picture'; picture.setAttribute('aria-hidden', 'true'); picture.textContent = icon;
      const caption = document.createElement('span'); caption.className = 'title'; caption.textContent = title;
      a.append(picture, caption);
      grid.appendChild(a);
    }
    summary.appendChild(h);
    const content = document.createElement('div');
    content.className = 'group-content';
    content.appendChild(grid);
    group.append(summary, content);
    list.appendChild(group);

    let expanded = group.open;
    let animation = null;
    summary.setAttribute('aria-expanded', String(expanded));
    summary.addEventListener('click', (event) => {
      event.preventDefault();
      const wasOpen = group.open;
      const startHeight = wasOpen ? content.getBoundingClientRect().height : 0;
      const startOpacity = wasOpen ? getComputedStyle(content).opacity : '0';
      if (animation) {
        animation.cancel();
        animation = null;
      }
      expanded = !expanded;
      group.classList.toggle('is-expanded', expanded);
      summary.setAttribute('aria-expanded', String(expanded));
      // Keep native details open until the closing animation finishes.
      group.open = true;
      content.inert = !expanded;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || !content.animate) {
        group.open = expanded;
        return;
      }
      animation = content.animate([
        { height: `${startHeight}px`, opacity: startOpacity },
        { height: `${expanded ? content.scrollHeight : 0}px`, opacity: expanded ? 1 : 0 },
      ], { duration: 320, easing: 'cubic-bezier(.22, 1, .36, 1)' });
      animation.onfinish = () => {
        group.open = expanded;
        animation = null;
      };
    });
  }
  document.getElementById('count').textContent = '点一张图，开始探索吧';
</script>
<script src="speak.js"></script>
</body>
</html>
