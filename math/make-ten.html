<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>凑十法</title>
<link rel="stylesheet" href="../table-lab.css">
<body>
<header><a href="../index.html" aria-label="返回首页">⌂</a><h1>凑十法</h1>
  <button type="button" class="read-all" data-speak-all data-speak-ignore aria-pressed="false" disabled>全部朗读</button>
</header>
<main class="ten" aria-label="凑十算式">
  <button data-speak="一加九等于十"><span>1</span> + <span>9</span> = 10</button>
  <button data-speak="二加八等于十"><span>2</span> + <span>8</span> = 10</button>
  <button data-speak="三加七等于十"><span>3</span> + <span>7</span> = 10</button>
  <button data-speak="四加六等于十"><span>4</span> + <span>6</span> = 10</button>
  <button data-speak="五加五等于十"><span>5</span> + <span>5</span> = 10</button>
  <button data-speak="六加四等于十"><span>6</span> + <span>4</span> = 10</button>
  <button data-speak="七加三等于十"><span>7</span> + <span>3</span> = 10</button>
  <button data-speak="八加二等于十"><span>8</span> + <span>2</span> = 10</button>
  <button data-speak="九加一等于十"><span>9</span> + <span>1</span> = 10</button>
</main>
<script src="../speak.js"></script>
</body>
</html>
