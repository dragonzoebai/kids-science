<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>AR 地球 · 转动手机看地球</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; touch-action: none; }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    canvas { position: fixed; inset: 0; display: block; z-index: 1; }
    #info, #cross, #hint, #bar { z-index: 2; }

    #info {
      position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px; padding: 10px 18px; text-align: center; min-width: 200px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #place { font-size: 22px; font-weight: bold; color: #ffe066; letter-spacing: 2px; }
    #coord { font-size: 12px; color: rgba(220,235,255,.7); margin-top: 3px; font-variant-numeric: tabular-nums; }

    #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }
    #cross::before, #cross::after { content: ""; position: absolute; background: rgba(255,224,102,.9); }
    #cross::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #cross::after  { top: 10px; left: 0; height: 2px; width: 22px; }

    #bar {
      position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 16px;
    }
    #bar button {
      border: none; border-radius: 22px; padding: 10px 16px; font-size: 14px; color: #fff;
      background: rgba(30,60,110,.75); border: 1px solid rgba(140,190,255,.35);
    }
    #bar button.on { background: rgba(220,150,30,.85); border-color: rgba(255,220,120,.6); }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(68px + env(safe-area-inset-bottom)); text-align: center; color: rgba(220,235,255,.75); font-size: 12px; pointer-events: none; text-shadow: 0 1px 3px #000; padding: 0 16px; }

  </style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>

<div id="info" data-speak-ignore><div id="place">地球</div><div id="coord"></div></div>
<div id="cross"></div>
<div id="hint"></div>
<div id="bar">
  <button id="btnCam" data-speak="相机背景">📷 相机背景</button>
  <button id="btnGyro" data-speak="陀螺仪">🧭 陀螺仪</button>
  <button id="btnReset" data-speak="回到中国">🎯 回到中国</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

const DEG = Math.PI / 180;
const HOME = { lat: 32, lon: 108 };   // 初始对准中国

/* ── Renderer / Scene ─────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 200);

/* ── Stars（无相机画面时的背景） ──────────────── */
const stars = (() => {
  const pos = [];
  for (let i = 0; i < 2500; i++) {
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.push(80 * Math.sin(ph) * Math.cos(th), 80 * Math.sin(ph) * Math.sin(th), 80 * Math.cos(ph));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const p = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false }));
  scene.add(p);
  return p;
})();

/* ── Earth ────────────────────────────────────── */
const tl = new THREE.TextureLoader();
const earthTex = tl.load('textures/2k_earth_daymap.jpg', (t) => buildLandMask(t.image));
earthTex.colorSpace = THREE.SRGBColorSpace;
earthTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, 128, 64),
  new THREE.MeshPhongMaterial({ map: earthTex, shininess: 12, specular: 0x333333 })
);
scene.add(earth);

// 大气光晕
earth.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.06, 64, 32),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `varying vec3 vN; void main(){ float i = pow(0.72 - dot(vN, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(0.35,0.65,1.0,1.0) * i; }`,
  })
));

// 灯光跟着相机，看到的一面始终是亮的
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-1.5, 1.2, 2);
camera.add(sun);
scene.add(camera);

/* ── 经纬度 ↔ 三维坐标（与 SphereGeometry 的 UV 对齐） ── */
// lon=0 在 +X，东经 90° 在 -Z，北极 +Y
function vecToLatLon(v) {
  const n = v.clone().normalize();
  return { lat: Math.asin(n.y) / DEG, lon: Math.atan2(-n.z, n.x) / DEG };
}

/* ── 视角状态 ─────────────────────────────────── */
// baseQuat：手指拖动决定的“看向哪个经纬度”；devRel：手机相对开始时转过的角度
// 相机姿态 = baseQuat * devRel，相机位置 = 姿态 * (0,0,dist)，始终看向球心
const view = { lat: HOME.lat, lon: HOME.lon, dist: 3.2 };
const baseQuat = new THREE.Quaternion();
const devRel = new THREE.Quaternion();
const camQuatTarget = new THREE.Quaternion();
const euler = new THREE.Euler();

function updateBase() {
  view.lat = Math.max(-85, Math.min(85, view.lat));
  baseQuat.setFromEuler(euler.set(-view.lat * DEG, (view.lon + 90) * DEG, 0, 'YXZ'));
}
updateBase();
camera.quaternion.copy(baseQuat);
camera.position.set(0, 0, view.dist).applyQuaternion(baseQuat);

/* ── 陀螺仪（DeviceOrientation → 四元数，同 three.js DeviceOrientationControls） ── */
const zee = new THREE.Vector3(0, 0, 1);
const qScreen = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // 手机平放 → 竖起看前方
const qTmp = new THREE.Quaternion();
const devQuat = new THREE.Quaternion();
const devInitInv = new THREE.Quaternion();
let gyroOn = false, needCalib = true;

function screenAngle() {
  return ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * DEG;
}
function onOrient(e) {
  if (e.alpha == null && e.beta == null) return;
  euler.set((e.beta || 0) * DEG, (e.alpha || 0) * DEG, -(e.gamma || 0) * DEG, 'YXZ');
  devQuat.setFromEuler(euler).multiply(qScreen).multiply(qTmp.setFromAxisAngle(zee, -screenAngle()));
  if (needCalib) { devInitInv.copy(devQuat).invert(); needCalib = false; }
  if (gyroOn) devRel.copy(devInitInv).multiply(devQuat);
}

async function enableGyro() {
  const DOE = window.DeviceOrientationEvent;
  if (!window.isSecureContext || !DOE) return false;
  if (typeof DOE.requestPermission === 'function') {   // iOS 13+
    try { if (await DOE.requestPermission() !== 'granted') return false; } catch { return false; }
  }
  window.addEventListener('deviceorientation', onOrient);
  return true;
}

/* ── 摄像头背景 ───────────────────────────────── */
const video = document.getElementById('cam');
let camStream = null;
async function setCamera(on) {
  btnCam.disabled = true;
  if (on) {
    try {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) throw new Error('CAMERA_UNAVAILABLE');
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = camStream;
      await video.play();
      video.style.display = 'block';
      stars.visible = false;
    } catch (err) {
      console.warn('摄像头不可用', err);
      setHint(window.isSecureContext
        ? '摄像头不可用，请检查浏览器网站权限后轻触相机重试；当前使用星空背景'
        : '摄像头需要 HTTPS 地址；当前可用手指拖动、双指缩放', 0);
      on = false;
    }
  }
  if (!on) {
    camStream?.getTracks().forEach((t) => t.stop());
    camStream = null;
    video.srcObject = null;
    video.style.display = 'none';
    stars.visible = true;
  }
  btnCam.classList.toggle('on', on);
  btnCam.disabled = false;
}

/* ── 触摸 / 鼠标：拖动转地球，双指 / 滚轮缩放 ──── */
const pointers = new Map();
let pinchDist = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  renderer.domElement.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
renderer.domElement.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (pointers.size === 1) {
    const k = 0.25 * (view.dist - 1) / 2.2;   // 拉近时转得慢一点
    view.lon -= (e.clientX - p.x) * k;
    view.lat += (e.clientY - p.y) * k;
    updateBase();
  }
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist) view.dist *= pinchDist / d;
    pinchDist = d;
    clampDist();
  }
});
const endPointer = (e) => { pointers.delete(e.pointerId); pinchDist = 0; };
renderer.domElement.addEventListener('pointerup', endPointer);
renderer.domElement.addEventListener('pointercancel', endPointer);
renderer.domElement.addEventListener('wheel', (e) => { view.dist *= Math.exp(e.deltaY * 0.001); clampDist(); }, { passive: true });
function clampDist() { view.dist = Math.max(1.4, Math.min(8, view.dist)); }

/* ── 当前看的是哪里（读贴图像素判断海陆） ───── */
let mask = null;
function buildLandMask(img) {
  try {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(img, 0, 0, c.width, c.height);
    mask = ctx.getImageData(0, 0, c.width, c.height);
  } catch (err) { console.warn('无法读取贴图像素', err); }
}
function isLand(lat, lon) {
  if (!mask) return null;
  const x = Math.min(mask.width - 1, Math.floor((lon + 180) / 360 * mask.width));
  const y = Math.min(mask.height - 1, Math.floor((90 - lat) / 180 * mask.height));
  const i = (y * mask.width + x) * 4, r = mask.data[i], g = mask.data[i + 1], b = mask.data[i + 2];
  return !(b > r + 8 && b >= g - 4);   // 海洋偏蓝
}
const inBox = (lat, lon, [la0, la1, lo0, lo1]) => lat >= la0 && lat <= la1 && lon >= lo0 && lon <= lo1;
const LANDS = [   // [名字, [纬度下, 纬度上, 经度左, 经度右]]，顺序靠前优先
  ['南极洲', [-90, -60, -180, 180]],
  ['格陵兰岛', [59, 84, -74, -11]],
  ['日本', [30, 46, 129, 146]],
  ['朝鲜半岛', [33, 43, 124, 130]],
  ['台湾岛', [21.8, 25.4, 119.8, 122.2]],
  ['中国', [18, 54, 73, 135]],
  ['蒙古', [41, 52, 87, 120]],
  ['印度', [6, 31, 68, 90]],
  ['东南亚', [-11, 28, 92, 141]],
  ['中东', [12, 42, 34, 63]],
  ['俄罗斯', [41, 82, 27, 180]],
  ['中亚', [35, 56, 46, 87]],
  ['欧洲', [35, 72, -25, 45]],
  ['非洲', [-36, 38, -18, 52]],
  ['澳大利亚', [-44, -10, 112, 154]],
  ['新西兰', [-48, -34, 166, 179]],
  ['北美洲', [7, 84, -170, -50]],
  ['南美洲', [-56, 13, -82, -34]],
];
function oceanName(lat, lon) {
  if (lat > 66) return '北冰洋';
  if (lat < -58) return '南大洋';
  if (lon >= 20 && lon <= 120 && lat < 25 && !(lon > 100 && lat > 0)) return '印度洋';
  if (lon > 20 && lon <= 147 && lat < -30) return '印度洋';
  if (lat >= 0 ? (lon > -100 && lon < 0) : (lon > -68 && lon < 20)) return '大西洋';
  if (lon >= 0 && lon <= 45 && lat > 30) return '地中海';
  return '太平洋';
}
function placeName(lat, lon) {
  const land = isLand(lat, lon);
  if (land === false) return oceanName(lat, lon);
  for (const [name, box] of LANDS) if (inBox(lat, lon, box)) return name;
  return land ? '陆地' : oceanName(lat, lon);
}

const placeEl = document.getElementById('place'), coordEl = document.getElementById('coord');
let shownPlace = '', pendingPlace = '', pendingSince = 0;
const fmt = (v, pos, neg) => `${Math.abs(v).toFixed(1)}°${v >= 0 ? pos : neg}`;
function updateInfo(now) {
  const { lat, lon } = vecToLatLon(camera.position);   // 屏幕中心正对的地面点
  coordEl.textContent = `${fmt(lat, 'N', 'S')}  ${fmt(lon, 'E', 'W')}`;
  const name = placeName(lat, lon);
  if (name !== pendingPlace) { pendingPlace = name; pendingSince = now; }
  if (name !== shownPlace && now - pendingSince > 700) {   // 停留一会儿再切换并朗读，避免转动时乱念
    shownPlace = name;
    placeEl.textContent = name;
    window.kidSpeak?.(name);
  }
}

/* ── 按钮 ─────────────────────────────────────── */
const btnCam = document.getElementById('btnCam');
const btnGyro = document.getElementById('btnGyro');
const hintEl = document.getElementById('hint');
let hintTimer = 0;
function setHint(text, ms = 4000) {
  hintEl.textContent = text;
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(() => (hintEl.textContent = ''), ms);
}

btnCam.onclick = () => setCamera(!camStream);
btnGyro.classList.remove('on');
btnGyro.onclick = async () => {
  if (gyroOn) {
    gyroOn = false;
    devRel.identity();
  } else {
    const permission = enableGyro(); // 保持在用户轻触时申请 iOS 权限
    btnGyro.disabled = true;
    gyroOn = await permission;
    btnGyro.disabled = false;
    needCalib = true;
  }
  btnGyro.classList.toggle('on', gyroOn);
  setHint(gyroOn ? '陀螺仪已打开，转动设备试试' : window.isSecureContext
    ? '陀螺仪未启用，可用手指拖动；轻触陀螺仪可重新申请权限'
    : '陀螺仪需要 HTTPS 地址；当前可用手指拖动', 6000);
};
document.getElementById('btnReset').onclick = () => {
  view.lat = HOME.lat; view.lon = HOME.lon; view.dist = 3.2;
  updateBase();
  needCalib = true; devRel.identity();
};

setHint('拖动地球、双指缩放；轻触陀螺仪可开启转动设备浏览', 6000);
window.addEventListener('orientationchange', () => { needCalib = true; });

// 竖屏时按水平方向保证 50° 视野，地球不会撑满屏宽
function fitCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.aspect = aspect;
  camera.fov = aspect < 1 ? 2 * Math.atan(Math.tan(25 * DEG) / aspect) / DEG : 50;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
fitCamera();
window.addEventListener('resize', fitCamera);

/* ── Loop ─────────────────────────────────────── */
const camPos = new THREE.Vector3();
renderer.setAnimationLoop((now) => {
  camQuatTarget.copy(baseQuat).multiply(devRel);
  camera.quaternion.slerp(camQuatTarget, 0.25);   // 平滑一下陀螺仪抖动
  camPos.set(0, 0, view.dist).applyQuaternion(camera.quaternion);
  camera.position.lerp(camPos, 0.5);
  camera.position.setLength(THREE.MathUtils.lerp(camera.position.length(), view.dist, 0.2));
  updateInfo(now);
  renderer.render(scene, camera);
});
</script>
<script src="../speak.js"></script>
</body>
</html>
