<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乘法口诀表</title>
<link rel="stylesheet" href="../table-lab.css">
<body>
<header><a href="../index.html" aria-label="返回首页">⌂</a><h1>乘法口诀表</h1></header>
<main class="pan" aria-label="乘法口诀表">
  <div class="times"></div>
</main>
<script src="../speak.js"></script>
<script>
  const table = document.querySelector('.times');
  const digits = '〇一二三四五六七八九';
  let selected;

  function rhyme(first, second) {
    const product = first * second;
    if (product < 10) return digits[first] + digits[second] + '得' + digits[product];
    if (product === 10) return digits[first] + digits[second] + '一十';
    const tens = Math.floor(product / 10);
    const ones = product % 10;
    return digits[first] + digits[second] + (tens === 1 ? '' : digits[tens]) + '十' + (ones ? digits[ones] : '');
  }

  for (let second = 1; second <= 9; second++) {
    for (let first = 1; first <= second; first++) {
      const button = document.createElement('button');
      button.style.gridArea = second + ' / ' + first;
      button.textContent = first + 'x' + second + '=' + first * second;
      button.dataset.speak = rhyme(first, second);
      button.setAttribute('aria-pressed', 'false');
      button.addEventListener('click', () => {
        selected?.setAttribute('aria-pressed', 'false');
        selected = button;
        button.setAttribute('aria-pressed', 'true');
      });
      table.append(button);
    }
  }
</script>
</body>
</html>
