<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf6f0">
<title>认识银行 · 科学游乐园</title>
<link rel="stylesheet" href="../touch.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#edf6f0;color:#203e35;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{width:100%;margin:0;padding:16px 12px 96px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.bank-card{font:inherit;appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:160px;padding:24px 18px;background:white;border:2px solid #dce8e0;border-radius:24px;box-shadow:0 5px 0 #dce8e080;cursor:pointer;color:#203e35;transition:transform .15s,border-color .15s}.logo{display:flex;align-items:center;justify-content:center;width:100%;height:100px;margin:0}.logo img{display:block;max-width:100%;width:280px;height:100%;object-fit:contain}.bank-card:hover,.bank-card.selected{border-color:var(--bank)}.bank-card:active{transform:scale(.97)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #246fbd;outline-offset:4px}@media(max-width:800px){main{padding:16px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bank-card{min-height:150px}}@media(max-width:420px){main{padding:14px 12px 90px}.grid{gap:12px}.bank-card{padding:16px 10px;min-height:120px;border-radius:20px}.logo{height:80px;margin:0}}@media(prefers-reduced-motion:reduce){.bank-card{transition:none}}
</style>
<script src="../touch.js"></script>
</head>
<body>
<main>
<section class="grid" aria-label="银行标志">

<script src="../speak.js"></script>
<script>
document.querySelectorAll('.bank-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelector('.bank-card.selected')?.classList.remove('selected');
    card.classList.add('selected');
  });
});

</script>
</body>
</html>
