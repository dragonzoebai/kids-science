<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>月相 Moon Phases</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #03050b; overflow: hidden; font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif; }
    canvas { display: block; }

    #ui {
      position: absolute;
      top: 16px; left: 16px;
      color: rgba(215,230,255,.88);
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 1px 6px #000;
      max-width: 330px;
    }
    #ui h2 { font-size: 21px; margin-bottom: 8px; color: #f8d36b; letter-spacing: 1px; }
    #ui li  { margin: 4px 0; list-style: none; line-height: 1.45; }
    #ui b { color: #fff1ad; }

    #phase-card {
      position: absolute;
      top: 16px; right: 16px;
      width: 260px;
      padding: 16px 18px;
      color: #eaf2ff;
      background: linear-gradient(145deg, rgba(7,12,26,.82), rgba(14,20,38,.58));
      border: 1px solid rgba(180,205,255,.18);
      border-radius: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(10px);
    }
    #phase-card .eyebrow {
      color: rgba(248,211,107,.78);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    #phase-row { display: flex; align-items: center; gap: 16px; }
    #phase-moon {
      width: 78px; height: 78px;
      border-radius: 50%;
      background: #10131d;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 32px rgba(180,205,255,.18);
      flex: none;
    }
    #phase-name { font-size: 25px; color: #ffffff; letter-spacing: 2px; }
    #phase-desc { margin-top: 4px; font-size: 12px; color: rgba(215,230,255,.66); line-height: 1.55; }
    #phase-angle { margin-top: 11px; font-size: 12px; color: rgba(248,211,107,.85); }

    #panel {
      position: absolute;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px;
      background: rgba(3,6,14,.72);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 30px;
      padding: 10px 24px;
      color: #d7e6ff; font-size: 13px;
      box-shadow: 0 12px 45px rgba(0,0,0,.38);
      backdrop-filter: blur(10px);
    }
    #panel input[type=range] { width: 170px; accent-color: #f8d36b; }
    #panel button {
      border: 1px solid rgba(248,211,107,.35);
      background: rgba(248,211,107,.12);
      color: #ffe59a;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      transition: .2s ease;
    }
    #panel button:hover { background: rgba(248,211,107,.22); transform: translateY(-1px); }

    #label-canvas { position: absolute; top: 0; left: 0; pointer-events: none; }

@media (max-width: 900px) {
  #ui { top: 10px; left: 10px; max-width: 55vw; font-size: 11px; }
  #ui h2 { font-size: 17px; }
  #panel { bottom: max(12px, env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); width: max-content; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 8px 12px; border-radius: 16px; }
  #panel input[type=range] { width: min(130px, 30vw); }
  #info { top: 115px; left: 10px; width: min(290px, 65vw); max-height: calc(100dvh - 230px); overflow-y: auto; }
  #bodies { right: 8px; max-height: 58dvh; overflow-y: auto; padding: 4px; }
  #bodies .item { padding: 4px; gap: 4px; font-size: 11px; }
  #bodies .thumb { width: 24px; height: 24px; flex-shrink: 0; }
  #clock-panel, #phase-card, #season-info { top: 10px; right: 10px; width: min(210px, 42vw); min-width: 0; padding: 10px; }
  .time-val { font-size: 20px; letter-spacing: 1px; }
}
@media (max-width: 600px) {
  #ui li { display: none; }
  #ui { max-width: 50vw; }
  #phase-moon { width: 48px; height: 48px; }
  #phase-desc { max-height: 72px; overflow-y: auto; }
}
</style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>

<div id="ui">
  <h2>☾ 日地月与月相</h2>
  <ul>
    <li>☀ 太阳固定在左侧，光照方向决定月球亮面。</li>
    <li>🌍 地球在中央，月球绕地球公转形成 <b>新月、上弦、满月、下弦</b> 等月相。</li>
    <li>🖱 拖拽旋转视角，滚轮缩放，右键平移。</li>
  </ul>
</div>

<div id="phase-card">
  <div class="eyebrow">view from earth</div>
  <div id="phase-row">
    <canvas id="phase-moon" width="156" height="156"></canvas>
    <div>
      <div id="phase-name">新月</div>
      <div id="phase-desc">月球在太阳与地球之间，朝向地球的一面几乎不被照亮。</div>
    </div>
  </div>
  <div id="phase-angle">月龄：0.0 / 29.5 天</div>
</div>

<canvas id="label-canvas"></canvas>

<div id="panel">
  <button id="play">暂停</button>
  <span>速度</span>
  <input type="range" id="speed" min="0" max="10" step="0.1" value="1">
  <span id="speed-val" style="min-width:36px">1.0×</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three-0.160.0/build/three.module.js",
    "three/addons/": "../vendor/three-0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Renderer ─────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ── Scene / Camera ───────────────────────────── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 20000);
camera.position.set(0, 80, 185);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 35;
controls.maxDistance = 900;
controls.target.set(0, 0, 0);

/* ── 星空背景 ─────────────────────────────────── */
{
  const pos = [], col = [];
  for (let i = 0; i < 1400; i++) {
    const r = 9000;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos.push(r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph));
    const b = Math.pow(Math.random(), 2.0) * 0.82 + 0.18;
    const warm = Math.random() * 0.14;
    col.push(b + warm, b, b + 0.08);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Points(geo,
    new THREE.PointsMaterial({ vertexColors: true, size: 1.65, sizeAttenuation: false })));
}

/* ── Texture loader ───────────────────────────── */
const tl = new THREE.TextureLoader();
function tex(file, fallbackColor) {
  const t = tl.load('textures/' + file, texture => {
    texture.colorSpace = THREE.SRGBColorSpace;
  }, undefined, () => {
    t.image = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 2;
      const ctx = c.getContext('2d');
      ctx.fillStyle = fallbackColor; ctx.fillRect(0,0,2,2);
      return c;
    })();
    t.needsUpdate = true;
  });
  return t;
}
const T = {
  sun:   tex('2k_sun.jpg',          '#ffcc00'),
  earth: tex('2k_earth_daymap.jpg', '#2255aa'),
  moon:  tex('2k_moon.jpg',         '#999999'),
};

/* ── Lighting：太阳是真正的光源 ─────────────────── */
scene.add(new THREE.AmbientLight(0x24324f, 0.16));

const SUN_POS = new THREE.Vector3(-360, 0, 0);
const sunLight = new THREE.PointLight(0xfff0c2, 7.0, 0, 0.72);
sunLight.position.copy(SUN_POS);
sunLight.castShadow = true;
scene.add(sunLight);

/* ── Sun / Earth / Moon ───────────────────────── */
const sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(32, 64, 64),
  new THREE.MeshBasicMaterial({ map: T.sun })
);
sunMesh.position.copy(SUN_POS);
scene.add(sunMesh);

for (const [scale, opacity, color] of [
  [1.10, 0.22, 0xffd46b],
  [1.35, 0.09, 0xff9d2e],
  [1.75, 0.035, 0xff5b1a],
]) {
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(32 * scale, 40, 40),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.BackSide })
  );
  glow.position.copy(SUN_POS);
  scene.add(glow);
}

const earthAxis = new THREE.Object3D();
earthAxis.rotation.z = THREE.MathUtils.degToRad(23.5);
scene.add(earthAxis);

const earthMaterial = new THREE.ShaderMaterial({
  uniforms: {
    dayMap: { value: T.earth },
    sunDirection: { value: new THREE.Vector3(-1, 0, 0) },
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    void main() {
      vUv = uv;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D dayMap;
    uniform vec3 sunDirection;
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    void main() {
      vec3 dayColor = texture2D(dayMap, vUv).rgb;
      float sunlight = dot(normalize(vWorldNormal), normalize(sunDirection));
      float dayMask = smoothstep(-0.08, 0.22, sunlight);
      float rim = smoothstep(-0.18, 0.08, sunlight) * (1.0 - smoothstep(0.08, 0.35, sunlight));
      vec3 nightColor = dayColor * vec3(0.025, 0.045, 0.10) + vec3(0.0, 0.012, 0.045);
      vec3 twilight = vec3(0.95, 0.42, 0.16) * rim * 0.23;
      vec3 color = mix(nightColor, dayColor * (0.72 + 0.34 * max(sunlight, 0.0)), dayMask) + twilight;
      gl_FragColor = vec4(color, 1.0);
    }
  `,
});

const earthMesh = new THREE.Mesh(
  new THREE.SphereGeometry(18, 96, 96),
  earthMaterial
);
earthMesh.castShadow = true;
earthMesh.receiveShadow = true;
earthAxis.add(earthMesh);

const cloudMesh = new THREE.Mesh(
  new THREE.SphereGeometry(18.35, 64, 64),
  new THREE.MeshBasicMaterial({ color: 0xbfd8ff, transparent: true, opacity: 0.05, depthWrite: false })
);
earthAxis.add(cloudMesh);

const moonPivot = new THREE.Object3D();
scene.add(moonPivot);

const moonMaterial = new THREE.ShaderMaterial({
  uniforms: {
    moonMap: { value: T.moon },
    sunDirection: { value: new THREE.Vector3(-1, 0, 0) },
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    void main() {
      vUv = uv;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D moonMap;
    uniform vec3 sunDirection;
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    void main() {
      vec3 texColor = texture2D(moonMap, vUv).rgb;
      float sunlight = dot(normalize(vWorldNormal), normalize(sunDirection));
      float dayMask = smoothstep(-0.06, 0.18, sunlight);
      float terminator = smoothstep(-0.12, 0.04, sunlight) * (1.0 - smoothstep(0.05, 0.22, sunlight));
      vec3 nightColor = texColor * vec3(0.075, 0.085, 0.105) + vec3(0.015, 0.020, 0.040);
      vec3 dayColor = texColor * (0.62 + 0.48 * max(sunlight, 0.0));
      vec3 earthshine = vec3(0.12, 0.16, 0.24) * (1.0 - dayMask) * 0.22;
      vec3 color = mix(nightColor, dayColor, dayMask) + earthshine + vec3(0.40, 0.34, 0.24) * terminator * 0.12;
      gl_FragColor = vec4(color, 1.0);
    }
  `,
});

const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(5, 64, 64),
  moonMaterial
);
moonMesh.castShadow = true;
moonMesh.receiveShadow = true;
moonPivot.add(moonMesh);

const MOON_R = 58;
let moonAngle = 0; // 0：新月，月球位于太阳与地球之间
moonMesh.position.set(-MOON_R, 0, 0);

/* ── Orbit and phase markers ──────────────────── */
function orbitLine(radius, color, opacity) {
  const pts = [];
  for (let i=0;i<=320;i++) {
    const a = (i/320)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, transparent:true, opacity })
  );
}
scene.add(orbitLine(MOON_R, 0x9ebcff, .52));
scene.add(orbitLine(360, 0xffd36b, .16));

const markerGroup = new THREE.Group();
scene.add(markerGroup);
const phaseMarkers = [
  ['新月', 0, '#1d2436'],
  ['上弦', Math.PI/2, '#cdd8ea'],
  ['满月', Math.PI, '#fff1b5'],
  ['下弦', Math.PI*1.5, '#cdd8ea'],
];
for (const [, angle, color] of phaseMarkers) {
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 16, 16),
    new THREE.MeshBasicMaterial({ color })
  );
  dot.position.set(-Math.cos(angle) * MOON_R, 0, Math.sin(angle) * MOON_R);
  markerGroup.add(dot);
}

const sunArrow = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(-118, -22, 0), 86, 0xffd36b, 8, 5);
scene.add(sunArrow);

/* ── Phase data / inset moon ──────────────────── */
const phaseName = document.getElementById('phase-name');
const phaseDesc = document.getElementById('phase-desc');
const phaseAngle = document.getElementById('phase-angle');
const phaseCanvas = document.getElementById('phase-moon');
const pctx = phaseCanvas.getContext('2d');

const PHASES = [
  { name:'新月',     at:0,     desc:'月球在太阳与地球之间，朝向地球的一面几乎不被照亮。' },
  { name:'蛾眉月',   at:0.125, desc:'亮面刚刚露出一弯，日落后可在西方低空看见。' },
  { name:'上弦月',   at:0.25,  desc:'右半边被照亮，月球与太阳方向约成 90°。' },
  { name:'盈凸月',   at:0.375, desc:'亮面超过一半，正在走向满月。' },
  { name:'满月',     at:0.5,   desc:'地球位于太阳与月球之间，月面几乎全部被照亮。' },
  { name:'亏凸月',   at:0.625, desc:'满月之后亮面开始减少，但仍超过一半。' },
  { name:'下弦月',   at:0.75,  desc:'左半边被照亮，常在后半夜升起。' },
  { name:'残月',     at:0.875, desc:'只剩一弯亮面，清晨可在东方天空看见。' },
];

function phaseInfo(t) {
  let best = PHASES[0], bd = 1;
  for (const p of PHASES) {
    const d = Math.min(Math.abs(t - p.at), 1 - Math.abs(t - p.at));
    if (d < bd) { best = p; bd = d; }
  }
  return best;
}

function drawPhaseMoon(t) {
  const w = phaseCanvas.width, h = phaseCanvas.height;
  const cx = w/2, cy = h/2, r = w * 0.42;
  pctx.clearRect(0, 0, w, h);

  const halo = pctx.createRadialGradient(cx, cy, r*.6, cx, cy, r*1.35);
  halo.addColorStop(0, 'rgba(210,225,255,.18)');
  halo.addColorStop(1, 'rgba(210,225,255,0)');
  pctx.fillStyle = halo;
  pctx.fillRect(0, 0, w, h);

  pctx.save();
  pctx.beginPath();
  pctx.arc(cx, cy, r, 0, Math.PI * 2);
  pctx.clip();

  pctx.fillStyle = '#111722';
  pctx.fillRect(cx-r, cy-r, r*2, r*2);

  const k = Math.cos(t * Math.PI * 2);
  const waxing = t < 0.5;
  pctx.fillStyle = '#d8dde5';
  pctx.beginPath();
  if (waxing) {
    pctx.arc(cx, cy, r, -Math.PI/2, Math.PI/2, false);
    pctx.ellipse(cx, cy, Math.abs(k) * r, r, 0, Math.PI/2, -Math.PI/2, k > 0);
  } else {
    pctx.arc(cx, cy, r, Math.PI/2, -Math.PI/2, false);
    pctx.ellipse(cx, cy, Math.abs(k) * r, r, 0, -Math.PI/2, Math.PI/2, k > 0);
  }
  pctx.closePath();
  pctx.fill();

  const shade = pctx.createRadialGradient(cx-r*.25, cy-r*.25, r*.1, cx, cy, r*1.2);
  shade.addColorStop(0, 'rgba(255,255,255,.22)');
  shade.addColorStop(.55, 'rgba(255,255,255,0)');
  shade.addColorStop(1, 'rgba(0,0,0,.38)');
  pctx.fillStyle = shade;
  pctx.fillRect(cx-r, cy-r, r*2, r*2);

  pctx.fillStyle = 'rgba(75,82,96,.32)';
  for (const c of [[-.2,-.08,.10], [.18,.16,.07], [.04,-.28,.055], [-.34,.25,.045], [.32,-.14,.04]]) {
    pctx.beginPath();
    pctx.arc(cx+c[0]*r, cy+c[1]*r, c[2]*r, 0, Math.PI*2);
    pctx.fill();
  }
  pctx.restore();

  pctx.strokeStyle = 'rgba(255,255,255,.16)';
  pctx.lineWidth = 2;
  pctx.beginPath(); pctx.arc(cx, cy, r, 0, Math.PI*2); pctx.stroke();
}

function updatePhasePanel() {
  const t = (moonAngle % (Math.PI * 2)) / (Math.PI * 2);
  const p = phaseInfo(t);
  phaseName.textContent = p.name;
  phaseDesc.textContent = p.desc;
  phaseAngle.textContent = `月龄：${(t * 29.5).toFixed(1)} / 29.5 天  ·  相位角 ${(t * 360).toFixed(0)}°`;
  drawPhaseMoon(t);
}

/* ── Label overlay ────────────────────────────── */
const labelCanvas = document.getElementById('label-canvas');
labelCanvas.width  = window.innerWidth;
labelCanvas.height = window.innerHeight;
const lctx = labelCanvas.getContext('2d');
const labelTargets = [
  { name:'太阳', get: () => sunMesh.position },
  { name:'地球', get: () => earthMesh.getWorldPosition(new THREE.Vector3()) },
  { name:'月球', get: () => moonMesh.getWorldPosition(new THREE.Vector3()) },
  ...phaseMarkers.map(([name, angle]) => ({ name, get: () => new THREE.Vector3(-Math.cos(angle) * MOON_R, 0, Math.sin(angle) * MOON_R) })),
];

function drawLabels() {
  lctx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
  lctx.font = 'bold 12px Trebuchet MS, Microsoft YaHei';
  for (const item of labelTargets) {
    const wp = item.get();
    const proj = wp.clone().project(camera);
    if (proj.z > 1) continue;
    const sx = ( proj.x * .5 + .5) * labelCanvas.width;
    const sy = (-proj.y * .5 + .5) * labelCanvas.height;
    if (sx < -80 || sx > labelCanvas.width + 80 || sy < -80 || sy > labelCanvas.height + 80) continue;
    lctx.fillStyle = 'rgba(0,0,0,.58)';
    lctx.fillText(item.name, sx + 1, sy - 13 + 1);
    lctx.fillStyle = item.name.includes('月') ? '#e8efff' : '#ffe28a';
    lctx.fillText(item.name, sx, sy - 13);
  }
}

/* ── Controls ─────────────────────────────────── */
let speedFactor = 1;
let playing = true;
const playBtn = document.getElementById('play');
document.getElementById('speed').addEventListener('input', e => {
  speedFactor = parseFloat(e.target.value);
  document.getElementById('speed-val').textContent = speedFactor.toFixed(1) + '×';
});
playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '暂停' : '播放';
});

/* ── Resize ───────────────────────────────────── */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelCanvas.width  = window.innerWidth;
  labelCanvas.height = window.innerHeight;
});

/* ── Animate ──────────────────────────────────── */
const clock = new THREE.Clock();
const earthWP = new THREE.Vector3();
const moonWP = new THREE.Vector3();
const sunDirForEarth = new THREE.Vector3();
const sunDirForMoon = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const frameDt = clock.getDelta();
  const dt = playing ? frameDt * speedFactor : 0;

  sunMesh.rotation.y += dt * 0.13;
  sunDirForEarth.copy(SUN_POS).sub(earthMesh.getWorldPosition(earthWP)).normalize();
  earthMaterial.uniforms.sunDirection.value.copy(sunDirForEarth);
  earthMesh.rotation.y += dt * 1.25;
  cloudMesh.rotation.y += dt * 1.36;

  moonAngle += dt * 0.42;
  moonMesh.position.set(
    -Math.cos(moonAngle) * MOON_R,
    Math.sin(moonAngle) * 2.6,
     Math.sin(moonAngle) * MOON_R
  );
  moonMesh.getWorldPosition(moonWP);
  sunDirForMoon.copy(SUN_POS).sub(moonWP).normalize();
  moonMaterial.uniforms.sunDirection.value.copy(sunDirForMoon);
  earthMesh.getWorldPosition(earthWP);
  moonMesh.lookAt(earthWP); // 潮汐锁定：同一面朝向地球
  moonMesh.rotateY(Math.PI);

  markerGroup.rotation.y = 0;
  sunArrow.setDirection(new THREE.Vector3(1, 0, 0));

  controls.update();
  renderer.render(scene, camera);
  drawLabels();
  updatePhasePanel();
}
updatePhasePanel();
animate();
</script>
<script src="../speak.js"></script>
</body>
</html>
