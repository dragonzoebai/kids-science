<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食物链小森林 · 能量接力赛</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #21372b;
      --muted: rgba(33, 55, 43, .68);
      --leaf: #39b75d;
      --leaf-dark: #1e8544;
      --sun: #ffd85a;
      --fox: #f47b32;
      --bird: #46a6e8;
      --rabbit: #f7f1e7;
      --bug: #8a56d9;
      --panel: rgba(255, 251, 226, .78);
      --line: rgba(66, 111, 71, .18);
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      font-family: "YouYuan", "幼圆", "LXGW WenKai", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 220, 90, .45), transparent 22%),
        radial-gradient(circle at 75% 18%, rgba(100, 207, 255, .32), transparent 24%),
        linear-gradient(180deg, #9ce9ff 0%, #d9f7d7 50%, #ffe9a8 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.4px),
        linear-gradient(135deg, rgba(255,255,255,.24) 25%, transparent 25% 75%, rgba(255,255,255,.24) 75%);
      background-size: 46px 46px, 34px 34px;
      mix-blend-mode: soft-light;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #title-card {
      position: absolute;
      left: 24px;
      top: 22px;
      z-index: 3;
      width: min(405px, calc(100vw - 48px));
      padding: 22px 24px 20px;
      border: 2px solid rgba(255,255,255,.76);
      border-radius: 32px 32px 12px 32px;
      background: linear-gradient(145deg, rgba(255,251,226,.86), rgba(228,255,220,.70));
      box-shadow: 0 26px 82px rgba(73, 133, 78, .22), inset 0 1px 0 rgba(255,255,255,.92);
      backdrop-filter: blur(18px);
    }

    #title-card::before {
      content: "🦊";
      position: absolute;
      right: 20px;
      top: -20px;
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      border-radius: 22px;
      background: #fff;
      font-size: 32px;
      transform: rotate(9deg);
      box-shadow: 0 16px 36px rgba(244, 123, 50, .2);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(57, 183, 93, .18);
      color: #247f46;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    h1 {
      margin-top: 13px;
      color: var(--ink);
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: .08em;
      text-shadow: 0 3px 0 rgba(255,255,255,.85);
    }

    h1 span { color: var(--fox); }

    #title-card p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.76;
    }

    #controls {
      position: absolute;
      right: 24px;
      top: 22px;
      z-index: 3;
      width: 330px;
      padding: 18px 18px 16px;
      border: 2px solid rgba(255,255,255,.76);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 26px 76px rgba(65, 126, 87, .2), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
    }

    .control-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .control-head strong {
      font-size: 16px;
      letter-spacing: .08em;
    }

    .pill-btn {
      border: 0;
      border-radius: 999px;
      padding: 9px 13px;
      color: #fff;
      background: linear-gradient(135deg, #39b75d, #1aa0a0);
      font: 900 12px/1 "YouYuan", "Microsoft YaHei", sans-serif;
      cursor: pointer;
      box-shadow: 0 11px 22px rgba(30, 166, 92, .24);
      transition: transform .18s ease, filter .18s ease;
    }

    .pill-btn:hover { transform: translateY(-2px) rotate(-1deg); filter: saturate(1.12); }

    .population-row {
      display: grid;
      grid-template-columns: 58px 32px 1fr 32px 42px;
      align-items: center;
      gap: 7px;
      padding: 9px 0;
      border-top: 1px dashed var(--line);
      font-size: 13px;
      color: rgba(33,55,43,.78);
    }

    .population-row button {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: #264b34;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 7px 14px rgba(38, 75, 52, .14);
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(38,75,52,.12);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.08);
    }

    .bar span {
      display: block;
      height: 100%;
      border-radius: inherit;
      width: 50%;
      transition: width .25s ease;
    }

    .val {
      text-align: right;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    #balance {
      margin-top: 10px;
      padding: 13px 14px;
      min-height: 78px;
      border-radius: 20px;
      background: rgba(57, 183, 93, .14);
      color: rgba(33,55,43,.72);
      font-size: 12px;
      line-height: 1.62;
    }

    #balance strong {
      display: block;
      margin-bottom: 2px;
      color: #1e8544;
      font-size: 14px;
    }

    #info-card {
      position: absolute;
      left: 50%;
      top: 20px;
      z-index: 4;
      transform: translateX(-50%);
      width: min(360px, calc(100vw - 48px));
      padding: 14px 18px;
      border: 2px solid rgba(255,255,255,.78);
      border-radius: 24px;
      background: rgba(255,251,226,.76);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 50px rgba(73, 133, 78, .18);
      text-align: center;
      pointer-events: none;
    }

    #info-card strong {
      color: var(--fox);
      font-size: 17px;
      letter-spacing: .08em;
    }

    #info-card p {
      margin-top: 6px;
      color: rgba(33,55,43,.68);
      font-size: 12px;
      line-height: 1.55;
    }

    #story {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 22px;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      pointer-events: none;
    }

    .step {
      min-height: 106px;
      padding: 14px 14px 13px;
      border: 2px solid rgba(255,255,255,.68);
      border-radius: 24px;
      background: rgba(255,251,226,.58);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 38px rgba(71, 139, 91, .13);
      transition: transform .28s ease, background .28s ease, border-color .28s ease;
    }

    .step.active {
      transform: translateY(-9px);
      border-color: rgba(255, 216, 90, .9);
      background: rgba(255, 248, 204, .86);
      box-shadow: 0 22px 54px rgba(239, 163, 49, .18);
    }

    .num {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-bottom: 9px;
      color: #fff;
      border-radius: 12px;
      background: #264b34;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 4px 4px 0 rgba(255,216,90,.45);
    }

    .step strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      letter-spacing: .08em;
    }

    .step span:last-child {
      display: block;
      margin-top: 7px;
      color: rgba(33,55,43,.64);
      font-size: 12px;
      line-height: 1.52;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      #title-card, #controls {
        left: 14px;
        right: 14px;
        width: auto;
      }
      #title-card { top: 14px; }
      #title-card h1 { font-size: 28px; }
      #info-card { display: none; }
      #controls { top: auto; bottom: 14px; }
      #story { display: none; }
    }
  </style>
<link rel="stylesheet" href="../touch.css">
<script src="../touch.js"></script>
</head>
<body>
  <canvas id="forest" aria-label="食物链小森林画布"></canvas>

  <section id="title-card">
    <div class="eyebrow">BIO LAB · 儿童科普</div>
    <h1>食物链<span>小森林</span></h1>
    <p>太阳把能量送给植物，植物被兔子和昆虫吃，鸟和狐狸再捕食它们。点击森林里的生物，看一看“谁吃谁”，再调节数量观察生态平衡。</p>
  </section>

  <section id="info-card" data-speak-auto>
    <strong id="info-title">太阳能量出发</strong>
    <p id="info-text">点击草、兔子、昆虫、鸟或狐狸，会高亮它在食物链里的能量关系。</p>
  </section>

  <section id="controls" aria-label="生态数量控制台">
    <div class="control-head">
      <strong>生态调节器</strong>
      <button class="pill-btn" id="reset" type="button">恢复平衡</button>
    </div>
    <div class="population-row" data-key="grass"><label>植物</label><button data-delta="-1">−</button><div class="bar"><span style="background:#39b75d"></span></div><button data-delta="1">+</button><span class="val">50</span></div>
    <div class="population-row" data-key="bugs"><label>昆虫</label><button data-delta="-1">−</button><div class="bar"><span style="background:#8a56d9"></span></div><button data-delta="1">+</button><span class="val">24</span></div>
    <div class="population-row" data-key="rabbits"><label>兔子</label><button data-delta="-1">−</button><div class="bar"><span style="background:#d7cbb8"></span></div><button data-delta="1">+</button><span class="val">18</span></div>
    <div class="population-row" data-key="birds"><label>小鸟</label><button data-delta="-1">−</button><div class="bar"><span style="background:#46a6e8"></span></div><button data-delta="1">+</button><span class="val">10</span></div>
    <div class="population-row" data-key="foxes"><label>狐狸</label><button data-delta="-1">−</button><div class="bar"><span style="background:#f47b32"></span></div><button data-delta="1">+</button><span class="val">6</span></div>
    <div id="balance"><strong>森林很平衡</strong><span>植物、食草动物和捕食者数量合适，能量接力很顺畅。</span></div>
  </section>

  <section id="story" aria-label="食物链步骤">
    <div class="step active"><span class="num">1</span><strong>太阳</strong><span>太阳能量是许多食物链的起点。</span></div>
    <div class="step"><span class="num">2</span><strong>植物</strong><span>植物用阳光、水和空气制造养分。</span></div>
    <div class="step"><span class="num">3</span><strong>食草动物</strong><span>兔子和昆虫吃植物获得能量。</span></div>
    <div class="step"><span class="num">4</span><strong>捕食者</strong><span>鸟吃昆虫，狐狸会捕食兔子。</span></div>
    <div class="step"><span class="num">5</span><strong>生态平衡</strong><span>任一环太多或太少，森林都会变化。</span></div>
  </section>

  <script>
    const canvas = document.getElementById('forest');
    const ctx = canvas.getContext('2d');
    const rows = [...document.querySelectorAll('.population-row')];
    const resetBtn = document.getElementById('reset');
    const balance = document.getElementById('balance');
    const infoTitle = document.getElementById('info-title');
    const infoText = document.getElementById('info-text');
    const steps = [...document.querySelectorAll('.step')];

    let w = 0;
    let h = 0;
    let dpr = 1;
    let t = 0;
    let selected = 'sun';
    let sparks = [];

    const maxPop = { grass: 80, bugs: 45, rabbits: 36, birds: 25, foxes: 18 };
    const pop = { grass: 50, bugs: 24, rabbits: 18, birds: 10, foxes: 6 };
    const defaults = { ...pop };

    const nodes = {
      sun: { label: '太阳', emoji: '☀️', color: '#ffd85a', info: '太阳能量出发，植物把它变成身体里的养分。' },
      grass: { label: '植物', emoji: '🌿', color: '#39b75d', info: '植物是生产者：它们用阳光、水和空气制造养分。兔子和昆虫会吃植物。' },
      bugs: { label: '昆虫', emoji: '🐛', color: '#8a56d9', info: '昆虫吃叶子，也会被小鸟吃掉，是能量接力的中间站。' },
      rabbits: { label: '兔子', emoji: '🐇', color: '#f7f1e7', info: '兔子吃草和嫩叶，狐狸会捕食兔子。兔子太多时，植物会被吃得很快。' },
      birds: { label: '小鸟', emoji: '🐦', color: '#46a6e8', info: '小鸟会吃昆虫，也帮助森林控制虫子数量。' },
      foxes: { label: '狐狸', emoji: '🦊', color: '#f47b32', info: '狐狸是捕食者，会捕食兔子，让兔子数量不至于太多。' }
    };

    const links = [
      ['sun', 'grass', '#ffd85a', '阳光能量'],
      ['grass', 'bugs', '#39b75d', '叶子'],
      ['grass', 'rabbits', '#39b75d', '青草'],
      ['bugs', 'birds', '#8a56d9', '昆虫'],
      ['rabbits', 'foxes', '#f7f1e7', '兔子']
    ];

    const positions = {};

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layoutNodes();
    }

    function layoutNodes() {
      positions.sun = { x: w * .17, y: h * .23, r: 54 };
      positions.grass = { x: w * .36, y: h * .64, r: 58 };
      positions.bugs = { x: w * .56, y: h * .56, r: 44 };
      positions.rabbits = { x: w * .56, y: h * .72, r: 50 };
      positions.birds = { x: w * .74, y: h * .48, r: 46 };
      positions.foxes = { x: w * .76, y: h * .70, r: 52 };
    }

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, '#9ce9ff');
      sky.addColorStop(.54, '#d9f7d7');
      sky.addColorStop(1, '#ffe9a8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 7; i++) {
        const x = (i * 220 + t * 9) % (w + 260) - 130;
        const y = 92 + i * 23 + Math.sin(t + i) * 8;
        drawCloud(x, y, .45 + (i % 3) * .07);
      }
    }

    function drawCloud(x, y, s) {
      ctx.save();
      ctx.globalAlpha = .38;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x - 42 * s, y + 10 * s, 28 * s, 0, Math.PI * 2);
      ctx.arc(x - 6 * s, y - 4 * s, 41 * s, 0, Math.PI * 2);
      ctx.arc(x + 40 * s, y + 10 * s, 30 * s, 0, Math.PI * 2);
      ctx.roundRect(x - 72 * s, y + 6 * s, 145 * s, 36 * s, 18 * s);
      ctx.fill();
      ctx.restore();
    }

    function drawGround() {
      const y = h * .73;
      const grass = ctx.createLinearGradient(0, y, 0, h);
      grass.addColorStop(0, '#92df77');
      grass.addColorStop(.5, '#58b85f');
      grass.addColorStop(1, '#2e7047');
      ctx.fillStyle = grass;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, y + 18);
      for (let x = 0; x <= w + 80; x += 80) {
        ctx.quadraticCurveTo(x + 40, y + Math.sin(x * .015 + t) * 18, x + 80, y + 18);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.globalAlpha = .22;
      ctx.strokeStyle = '#1f6d3e';
      ctx.lineWidth = 2;
      for (let i = 0; i < 70; i++) {
        const x = (i * 41) % w;
        const yy = y + 28 + (i * 29) % Math.max(60, h - y - 30);
        ctx.beginPath();
        ctx.moveTo(x, yy);
        ctx.quadraticCurveTo(x + 4, yy - 14 - (i % 8), x + 10, yy - 3);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTree(x, y, s) {
      ctx.save();
      ctx.fillStyle = '#7c4a2a';
      ctx.fillRect(x - 10 * s, y - 62 * s, 20 * s, 70 * s);
      const grad = ctx.createRadialGradient(x - 22 * s, y - 88 * s, 8, x, y - 86 * s, 82 * s);
      grad.addColorStop(0, '#93e06a');
      grad.addColorStop(1, '#238b49');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x - 34 * s, y - 86 * s, 38 * s, 0, Math.PI * 2);
      ctx.arc(x + 4 * s, y - 112 * s, 48 * s, 0, Math.PI * 2);
      ctx.arc(x + 42 * s, y - 84 * s, 36 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawArrow(from, to, color, label, active) {
      const a = positions[from];
      const b = positions[to];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const sx = a.x + dx / len * (a.r + 8);
      const sy = a.y + dy / len * (a.r + 8);
      const ex = b.x - dx / len * (b.r + 8);
      const ey = b.y - dy / len * (b.r + 8);
      const pulse = (Math.sin(t * 4) + 1) / 2;

      ctx.save();
      ctx.globalAlpha = active ? .92 : .28;
      ctx.strokeStyle = color;
      ctx.lineWidth = active ? 7 : 4;
      ctx.lineCap = 'round';
      ctx.shadowColor = active ? color : 'transparent';
      ctx.shadowBlur = active ? 12 : 0;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      const cx = (sx + ex) / 2;
      const cy = (sy + ey) / 2 - 26;
      ctx.quadraticCurveTo(cx, cy, ex, ey);
      ctx.stroke();

      const q = .78;
      const ax = (1 - q) * (1 - q) * sx + 2 * (1 - q) * q * cx + q * q * ex;
      const ay = (1 - q) * (1 - q) * sy + 2 * (1 - q) * q * cy + q * q * ey;
      const angle = Math.atan2(ey - cy, ex - cx);
      ctx.translate(ax, ay);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(15, 0);
      ctx.lineTo(-7, -10);
      ctx.lineTo(-5, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      if (active) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.globalAlpha = .45 + pulse * .35;
        const q2 = (t * .45) % 1;
        const px = (1 - q2) * (1 - q2) * sx + 2 * (1 - q2) * q2 * cx + q2 * q2 * ex;
        const py = (1 - q2) * (1 - q2) * sy + 2 * (1 - q2) * q2 * cy + q2 * q2 * ey;
        ctx.beginPath();
        ctx.arc(px, py, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = active ? .95 : .52;
      ctx.fillStyle = 'rgba(255,251,226,.78)';
      ctx.strokeStyle = active ? color : 'rgba(38,75,52,.16)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect((sx + ex) / 2 - 38, (sy + ey) / 2 - 42, 76, 24, 12);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#264b34';
      ctx.font = '900 12px "YouYuan", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, (sx + ex) / 2, (sy + ey) / 2 - 25);
      ctx.restore();
    }

    function drawNode(key) {
      const p = positions[key];
      const n = nodes[key];
      const selectedNow = selected === key;
      const amount = key === 'sun' ? 1 : pop[key] / maxPop[key];
      const scale = key === 'sun' ? 1 : .74 + amount * .36;
      const bob = Math.sin(t * 2 + p.x * .01) * 5;

      ctx.save();
      ctx.translate(p.x, p.y + bob);
      if (key === 'sun') {
        ctx.rotate(t * .18);
        for (let i = 0; i < 18; i++) {
          ctx.rotate(Math.PI * 2 / 18);
          ctx.fillStyle = 'rgba(255,184,47,.26)';
          ctx.beginPath();
          ctx.moveTo(42, 0);
          ctx.lineTo(82 + Math.sin(t * 2 + i) * 6, 8);
          ctx.lineTo(82 + Math.sin(t * 2 + i) * 6, -8);
          ctx.closePath();
          ctx.fill();
        }
      }

      const grad = ctx.createRadialGradient(-p.r * .2, -p.r * .26, 8, 0, 0, p.r * 1.3);
      grad.addColorStop(0, 'rgba(255,255,255,.98)');
      grad.addColorStop(.52, n.color);
      grad.addColorStop(1, 'rgba(255,255,255,.1)');
      ctx.fillStyle = grad;
      ctx.shadowColor = selectedNow ? n.color : 'rgba(73,133,78,.18)';
      ctx.shadowBlur = selectedNow ? 28 : 12;
      ctx.beginPath();
      ctx.arc(0, 0, p.r * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = selectedNow ? '#fff' : 'rgba(255,255,255,.72)';
      ctx.lineWidth = selectedNow ? 5 : 3;
      ctx.stroke();

      ctx.rotate(selectedNow ? Math.sin(t * 6) * .04 : 0);
      ctx.font = `${Math.round(p.r * .78 * scale)}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.emoji, 0, -3 * scale);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = 'rgba(255,251,226,.82)';
      ctx.strokeStyle = selectedNow ? n.color : 'rgba(38,75,52,.18)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(p.x - 48, p.y + p.r + 15, 96, 30, 15);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#264b34';
      ctx.font = '900 14px "YouYuan", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(key === 'sun' ? n.label : `${n.label} ${pop[key]}`, p.x, p.y + p.r + 35);
      ctx.restore();
    }

    function drawForestBits() {
      drawTree(w * .08, h * .72, .78);
      drawTree(w * .91, h * .73, .68);
      drawTree(w * .18, h * .79, .48);
      drawTree(w * .86, h * .82, .42);

      ctx.save();
      ctx.globalAlpha = .55;
      for (let i = 0; i < Math.min(55, pop.grass); i++) {
        const x = w * (.25 + ((i * 37) % 55) / 100);
        const y = h * (.77 + ((i * 19) % 13) / 100);
        ctx.strokeStyle = i % 2 ? '#1e8544' : '#39b75d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y + 12);
        ctx.quadraticCurveTo(x + 4, y - 7 - (i % 9), x + 12, y + 5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawSparks() {
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= .018;
        s.x += s.vx;
        s.y += s.vy;
        if (s.life <= 0) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = s.life;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x - s.size, s.y);
        ctx.lineTo(s.x + s.size, s.y);
        ctx.moveTo(s.x, s.y - s.size);
        ctx.lineTo(s.x, s.y + s.size);
        ctx.stroke();
        ctx.restore();
      }
    }

    function activeLink(from, to) {
      return selected === 'sun' || selected === from || selected === to;
    }

    function diagnose() {
      let title = '森林很平衡';
      let text = '植物、食草动物和捕食者数量合适，能量接力很顺畅。';
      let color = '#1e8544';

      const herb = pop.bugs + pop.rabbits * 1.25;
      const plantNeed = herb * 1.55;
      const predator = pop.birds + pop.foxes * 1.5;
      const prey = pop.bugs + pop.rabbits;

      if (pop.grass < plantNeed * .55) {
        title = '植物快被吃光了';
        text = '兔子和昆虫太多，植物恢复不过来，森林会变得光秃秃。';
        color = '#d06b1f';
      } else if (herb < 16 && predator > 20) {
        title = '捕食者有点多';
        text = '鸟和狐狸太多，但食物不够，它们可能会迁走寻找新家。';
        color = '#bc4d2c';
      } else if (pop.foxes < 3 && pop.rabbits > 25) {
        title = '兔子要开派对';
        text = '狐狸太少，兔子数量容易变多，植物会被吃得更快。';
        color = '#d06b1f';
      } else if (pop.birds < 4 && pop.bugs > 34) {
        title = '虫子有点多';
        text = '小鸟太少，昆虫会变多，树叶可能被咬出许多小洞。';
        color = '#8a56d9';
      } else if (pop.grass > 62 && prey > 26 && predator > 8) {
        title = '能量接力很棒';
        text = '植物充足，食草动物和捕食者也合适，小森林很热闹。';
        color = '#1e8544';
      }

      balance.innerHTML = `<strong style="color:${color}">${title}</strong><span>${text}</span>`;
    }

    function updateRows() {
      rows.forEach(row => {
        const key = row.dataset.key;
        row.querySelector('.bar span').style.width = `${pop[key] / maxPop[key] * 100}%`;
        row.querySelector('.val').textContent = pop[key];
      });
      diagnose();
    }

    function updateInfo() {
      const n = nodes[selected];
      infoTitle.textContent = selected === 'sun' ? '太阳能量出发' : `你点中了：${n.label}`;
      infoText.textContent = n.info;
      const storyIndex = selected === 'sun' ? 0 : selected === 'grass' ? 1 : (selected === 'bugs' || selected === 'rabbits') ? 2 : 3;
      steps.forEach((el, i) => el.classList.toggle('active', i === storyIndex));
    }

    function burst(x, y, color) {
      for (let i = 0; i < 24; i++) {
        const a = Math.PI * 2 * i / 24;
        sparks.push({
          x, y,
          vx: Math.cos(a) * (1.2 + (i % 5) * .28),
          vy: Math.sin(a) * (1.2 + (i % 5) * .28),
          size: 4 + (i % 4),
          color,
          life: .95
        });
      }
    }

    function animate() {
      t += .016;
      drawSky();
      drawGround();
      drawForestBits();
      links.forEach(([from, to, color, label]) => drawArrow(from, to, color, label, activeLink(from, to)));
      Object.keys(nodes).forEach(drawNode);
      drawSparks();
      requestAnimationFrame(animate);
    }

    canvas.addEventListener('click', e => {
      const found = Object.keys(positions).find(key => {
        const p = positions[key];
        return Math.hypot(e.clientX - p.x, e.clientY - p.y) < p.r + 22;
      });
      if (found) {
        selected = found;
        updateInfo();
        burst(positions[found].x, positions[found].y, nodes[found].color);
      }
    });

    rows.forEach(row => {
      row.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const key = row.dataset.key;
        pop[key] = clamp(pop[key] + Number(btn.dataset.delta) * (key === 'grass' ? 5 : 2), 0, maxPop[key]);
        selected = key;
        updateRows();
        updateInfo();
        burst(positions[key].x, positions[key].y, nodes[key].color);
      });
    });

    resetBtn.addEventListener('click', () => {
      Object.assign(pop, defaults);
      selected = 'sun';
      updateRows();
      updateInfo();
      burst(positions.sun.x, positions.sun.y, nodes.sun.color);
    });

    window.addEventListener('resize', resize);

    resize();
    updateRows();
    updateInfo();
    animate();
  </script>
<script src="../speak.js"></script>
</body>
</html>
